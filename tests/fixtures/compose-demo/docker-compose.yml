# Compose 夹具：单服务 web（redis），宿主 18214 → 容器 6379。
# 故意不配置 docker healthcheck —— 就绪判定走组件声明的 tcp 端口探针
# （V2.7“无 health 用端口探针”路径）。
# 镜像选择说明：本机已拉取 redis:7-alpine（arm64，与 colima 匹配）。
# 之前的 alpine:3.20 方案在本机为 amd64 模拟镜像且 busybox 无 httpd applet（N04 F-B2），已弃用。
services:
  web:
    image: redis:7-alpine
    command: ["redis-server", "--port", "6379"]
    ports:
      - "18214:6379"
