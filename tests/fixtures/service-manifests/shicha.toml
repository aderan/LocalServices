id = "shicha"
name = "ShiCha"
source = "/example/commerce"

[[components]]
id = "api"
cwd = "services/api"
build = ["python3", "../../scripts/dev_api.py", "build"]
cmd = ["python3", "../../scripts/dev_api.py", "run"]
port = 8000
ready = { http = "http://127.0.0.1:8000/v1/admin/commerce/runtime", json_ok = "receiverEnabled" }

[[components]]
id = "admin"
cwd = "apps/admin-web"
cmd = ["vite", "--host", "127.0.0.1", "--port", "5176"]
port = 5176
env = { VITE_PROXY_TARGET = "http://127.0.0.1:8000" }
after = ["api"]
