id = "explore"
name = "Explore"
description = "UI-Atlas 采集与灵感库：独立前端 + 本地后台（不自动启动采集任务）"
adapter = "explore"
options = { api = "http://127.0.0.1:8787" }
source = "~/Sources/Products/UI-Atlas"
open = "http://127.0.0.1:5178/explore/#/capture?mode=agent"

group = "ui-atlas"
group_name = "UI-Atlas 工作区"
group_order = 0
project = "ui-atlas"

[[components]]
id = "api"
name = "Explore API · 8787"
cmd = ["node", "tools/explore-server/src/server.mjs"]
env_files = [".env", ".env.local"]
env = { EXPLORE_HOST = "127.0.0.1", EXPLORE_PORT = "8787" }
port = 8787
ready = { http = "http://127.0.0.1:8787/api/health", json_ok = "ok", timeout = 5 }
# A source edit must not restart the backend during a capture or classification job.
auto_update = false
watch = ["tools/explore-server/src", "tools/capture-agent/src"]
external_cmd = "tools/explore-server/src/server[.]mjs"
external_cwd_exact = true

[[components]]
id = "web"
name = "Explore 前端 · 5178"
cwd = "apps/explore"
cmd = ["node_modules/.bin/vite", "--host", "127.0.0.1", "--port", "5178", "--strictPort"]
after = ["api"]
port = 5178
ready = { http = "http://127.0.0.1:5178/explore/" }
hot = true
watch = ["src", "index.html"]
restart_on = ["vite.config.ts", "package.json"]
install = ["pnpm", "install", "--ignore-workspace"]
install_when = ["pnpm-lock.yaml"]
install_marker = "node_modules"
external_cmd = "vite"
external_cwd_exact = true
