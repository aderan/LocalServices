id = "browsercapture"
name = "BrowserCapture"
description = "数据服务 + worker（源码运行，复用数据根与配对）"
source = "~/Sources/Products/BrowserCapture"
autostart = true
adapter = "browsercapture"
options = { port = 47615, data_dir = "~/Library/Application Support/BrowserCapture" }
project = "browsercapture"

[[components]]
id = "service"
name = "数据服务"
# fixed port: the extension and Host/Origin checks expect 127.0.0.1:47615
cmd = ["node", "--no-warnings", "bin/bc.js", "serve", "--no-worker"]
port = 47615
ready = { http = "http://127.0.0.1:47615/v1/health", json_ok = "ok" }
start_timeout = 30
watch = ["bin", "src", "package.json"]
ignore = ["src/ui"]
external_cmd = "bc\\.js serve"

[[components]]
id = "worker"
name = "Worker"
cmd = ["node", "--no-warnings", "bin/bc.js", "worker"]
after = ["service"]
start_timeout = 60
watch = ["bin", "src", "package.json"]
ignore = ["src/ui", "src/service"]
external_cmd = "bc\\.js worker"
