id = "shicha"
name = "ShiCha"
description = "管理后台 + Go API（依赖 Colima 中的 shicha-postgres）"
source = "~/Sources/Products/ShiCha"
open = "http://127.0.0.1:5176/"

[[components]]
id = "api"
name = "Go API"
cwd = "services/api"
# compile first; a failed build keeps the running binary (config/ is read relative to cwd)
build = ["python3", "../../scripts/dev_api.py", "build", "--binary", "{build}/shicha-api"]
cmd = ["python3", "../../scripts/dev_api.py", "run", "--binary", "{build}/shicha-api"]
env = { SHICHA_APP_PORT = "8000" }
port = 8000
# API initializes Postgres before this route; receiver configuration must also be present.
ready = { http = "http://127.0.0.1:8000/v1/admin/commerce/runtime", json_ok = "receiverEnabled", timeout = 5, interval = 15 }
start_timeout = 60
watch = [".", "../../scripts/dev_api.py", "../../tools/crawler", "../../tools/acquire", "../../packages/capture-contract"]
ignore = ["uploads"]
external_cmd = "go-build.*/exe/main|shicha-api|go run main.go"

[[components]]
id = "admin"
name = "管理前端"
cwd = "apps/admin-web"
cmd = ["node_modules/.bin/vite", "--host", "127.0.0.1", "--port", "5176", "--strictPort"]
env = { VITE_PROXY_TARGET = "http://127.0.0.1:8000" }
after = ["api"]
port = 5176
ready = { http = "http://127.0.0.1:5176/" }
start_timeout = 60
hot = true
watch = ["src", "index.html"]  # used only when FSEvents is down (restart fallback)
restart_on = ["vite.config.ts", "package.json", ".env.development"]
install = ["npm", "install"]
install_when = ["package-lock.json"]
install_marker = "node_modules"
external_cmd = "vite"

[[dependencies]]
name = "Postgres（shicha-postgres :5435）"
probe = { tcp = "127.0.0.1:5435" }
affects = ["Go API"]
required = true
container = "shicha-postgres"
volume = "shicha_postgres_data"
note = "可恢复 Colima 与现有容器及原数据卷；不随项目停止"
