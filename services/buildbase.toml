id = "buildbase"
name = "Buildbase"
description = "Next.js 开发模式（热更新）"
source = "~/Sources/Products/Buildbase"
open = "http://localhost:3000/zh"

[[components]]
id = "web"
name = "Next.js dev"
# port 3000 = NEXT_PUBLIC_SITE_URL default; .env.local is loaded by Next itself
cmd = ["node_modules/.bin/next", "dev", "--turbopack", "-p", "3000", "-H", "127.0.0.1"]
port = 3000
# A cold compile exceeding the startup budget is a visible failure, not an endless start.
ready = { http = "http://127.0.0.1:3000/zh", timeout = 2, interval = 30 }
start_timeout = 30
hot = true
watch = ["src", "messages"]
restart_on = ["next.config.ts", ".env.local", "package.json", "tsconfig.json"]
install = ["npm", "install"]
install_when = ["package-lock.json"]
install_marker = "node_modules"
external_cmd = "next[- ](server|dev|start)"
