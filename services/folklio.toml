id = "folklio"
name = "Folklio"
description = "Vite 热更新 + preview 内容索引自动重建"
source = "~/Sources/Products/Ideas/DailyLifeAtlas"
open = "http://127.0.0.1:5174/"

[[components]]
id = "web"
name = "Vite dev"
cwd = "app/web"
cmd = ["node_modules/.bin/vite", "--host", "127.0.0.1", "--port", "5174", "--strictPort"]
port = 5174
ready = { http = "http://127.0.0.1:5174/" }
start_timeout = 60
hot = true
watch = ["src", "index.html"]  # used only when FSEvents is down (restart fallback)
restart_on = ["vite.config.ts", "package.json", "tailwind.config.js", "postcss.config.js"]
install = ["npm", "install"]
install_when = ["package-lock.json"]
install_marker = "node_modules"
external_cmd = "vite"

[[components]]
id = "content"
name = "preview 内容索引"
kind = "generator"
# validate first; build-index exits before touching output on invalid content.
# Only the preview scope: publishing state is never changed here.
cmd = ["/bin/sh", "-c", "node scripts/validate-content.mjs && node scripts/build-index.mjs --scope=preview"]
watch = ["content", "schemas"]
debounce = 2.0
