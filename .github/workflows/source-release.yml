name: Source release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Package and verify the source
        id: package
        shell: bash
        run: |
          source_version=$(python3 -c 'from localservices import __version__; print(__version__)')
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$source_version" ]]; then
              printf 'Tag version %s does not match source version %s.\n' "$version" "$source_version" >&2
              exit 1
            fi
          else
            version="preview-${GITHUB_SHA:0:12}"
          fi

          local_paths=$(git ls-tree --name-only HEAD -- artifacts services tmp .tmp .pytest_cache)
          if [[ -n "$local_paths" ]]; then
            printf 'Remove local data from the tagged tree before packaging:\n%s\n' "$local_paths" >&2
            exit 1
          fi

          archive="locove-$version.tar.gz"
          mkdir -p "$RUNNER_TEMP/locove-source"
          git archive --format=tar --prefix="locove-$version/" HEAD |
            gzip -n > "$RUNNER_TEMP/locove-source/$archive"

          cd "$RUNNER_TEMP/locove-source"
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check "$archive.sha256"
          mkdir verified
          tar -xzf "$archive" -C verified
          test -f "verified/locove-$version/LICENSE"
          bash -n "verified/locove-$version/scripts/install.sh"
          awk -v heading="## [$source_version]" '
            /^## / {
              if (section) exit
              section = ($0 == heading || index($0, heading " - ") == 1)
              next
            }
            section {
              if (!body && $0 !~ /[^[:space:]]/) next
              body = 1
              print
            }
            END { if (!body) exit 1 }
          ' "verified/locove-$version/CHANGELOG.md" > release-notes.md
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: locove-source
          path: |
            ${{ runner.temp }}/locove-source/${{ steps.package.outputs.archive }}
            ${{ runner.temp }}/locove-source/${{ steps.package.outputs.archive }}.sha256
            ${{ runner.temp }}/locove-source/release-notes.md
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: locove-source

      - name: Publish the verified archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag \
            --title "Locove ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
