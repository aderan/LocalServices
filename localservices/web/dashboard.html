<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locove／洛湾</title>
<link rel="icon" type="image/png" href="/locove-logo.png">
<style>
  :root { color-scheme: light dark;
          --fg:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --bg:#fff; --soft:#f5f5f7; --page:#f5f5f7; --card:#fff;
          --ok:#1f7a3a; --warn:#9a6700; --bad:#b42318; --btn:#0b57d0;
          --hair:#ececf0; }
  @media (prefers-color-scheme: dark) { :root {
          --fg:#f5f5f7; --mute:#a1a1a6; --line:#38383a; --bg:#1c1c1e; --soft:#2c2c2e; --page:#111113; --card:#1c1c1e;
          --ok:#5bd17a; --warn:#f2c14e; --bad:#ff6b5e; --btn:#7aa7ff;
          --hair:#2a2a2d; } }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0;
         background: var(--page); color: var(--fg); }
  .banner { background: var(--soft); border-bottom: 1px solid var(--line); color: var(--bad);
            font-weight: 600; padding: 8px 20px; text-align: center; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  nav { background: var(--bg); border-right: 1px solid var(--line); padding: 14px 10px;
        display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start;
        max-height: 100vh; overflow-y: auto; }
  .brand { padding: 2px 10px 12px; }
  .brand-heading { display: flex; align-items: center; gap: 6px; }
  .brand-heading img { flex: none; }
  .brand h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .01em; }
  .brand .brand-sub { color: var(--mute); font-size: 11px; }
  #conn { color: var(--mute); font-size: 11.5px; margin-top: 1px; }
  #conn.bad { color: var(--bad); font-weight: 600; }
  .navitem { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
             padding: 6px 10px; border-radius: 7px; border: 0; background: none; color: var(--fg);
             cursor: pointer; }
  .navitem:hover { background: var(--soft); }
  .navitem.active { background: var(--soft); color: var(--btn); font-weight: 600; }
  .navitem.add { color: var(--btn); }
  .project-navitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .project-alert { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .project-alert.partial { background: var(--warn); }
  .navlabel { color: var(--mute); font-size: 11px; padding: 12px 10px 3px; text-transform: uppercase; letter-spacing: .05em; }
  .navspacer { flex: 1; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px;
           background: var(--bad); color: #fff; text-align: center; margin-left: 4px; }
  .badge.mut { background: var(--mute); }
  .content { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: baseline; gap: 12px; padding: 18px 26px 6px; flex-wrap: wrap; }
  .topbar h2 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .topbar .subtitle { color: var(--mute); font-size: 12.5px; flex: 1 1 160px; }
  .topbar .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  #nav-settings[aria-pressed="true"] { color: var(--btn); border-color: currentColor; }
  #globalSearch { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px;
                  border: 1px solid var(--line); background: var(--card); color: var(--fg); width: 220px; }
  main { padding: 4px 26px 56px; max-width: 1080px; width: 100%; container-type: inline-size;
         container-name: mainc; }
  /* —— 分组：一个项目一组紧凑行（Magpie 语法：细分隔、整组一体） —— */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           margin: 0 0 14px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px 8px;
                background: var(--card); border-bottom: 1px solid var(--hair); }
  .group-head h3 { font-size: 13.5px; margin: 0 auto 0 0; font-weight: 600; }
  .group-head .note { margin: 0; }
  .group-tools { display: flex; align-items: center; gap: 4px; padding: 6px 14px;
                 border-bottom: 1px solid var(--hair); font-size: 12.5px; color: var(--mute); }
  .group-tools .acts { gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px 8px; margin: 0 0 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .card-head h3 { font-size: 15px; margin: 0 auto 0 0; }
  .card-head .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .star { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px;
          color: var(--mute); }
  .star.on { color: var(--warn); }
  .note { color: var(--mute); font-size: 12px; margin: 2px 0 8px; }
  /* —— 服务行（Magpie：主副文本 + 行尾对齐 + 细分隔；整行可点开详情） —— */
  .svc { border-top: 1px solid var(--hair); }
  .svc:first-of-type { border-top: 0; }
  .svc.expanded { background: color-mix(in srgb, var(--soft) 45%, var(--card)); }
  /* W1：状态与构建状态合并为同一列（两行主副文本），地址列不再溢出盖住状态 */
  .line { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(64px, 112px) max-content;
          gap: 12px; align-items: center; padding: 7px 14px; cursor: pointer; }
  .line > * { min-width: 0; }
  .line:focus-visible { outline: 2px solid var(--btn); outline-offset: -2px; }
  .statecell { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .name { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; min-width: 0;
          display: flex; flex-direction: column; gap: 1px; }
  .name small { display: block; font-weight: 400; color: var(--mute); font-size: 11.5px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
  .state { font-weight: 500; font-size: 12.5px; color: var(--mute); }
  .state::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                   margin-right: 6px; background: var(--mute); vertical-align: 1px; }
  .s-available { color: var(--fg); } .s-partial { color: var(--warn); }
  .s-failed, .s-conflict { color: var(--bad); }
  .s-available::before { background: var(--ok); } .s-partial::before { background: var(--warn); }
  .s-failed::before, .s-conflict::before { background: var(--bad); }
  .s-starting::before, .s-stopping::before, .s-preparing::before { background: var(--btn); }
  .s-external::before { background: var(--ok); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ok); }
  .code { color: var(--mute); font-size: 11.5px; overflow-wrap: anywhere; line-height: 1.3; }
  .code.pending, .code.failed { font-weight: 600; }
  .code.pending { color: var(--warn); } .code.failed { color: var(--bad); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .acts button { padding: 3px 10px; font-size: 12.5px; }
  /* V3：无端口域名是服务行的主要信息（紧凑主副文本 + 可复制） */
  .domain { display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent;
    color: var(--fg); font: inherit; text-align: left; min-width: 0; cursor: copy; }
  .domain:hover { border-color: var(--btn); }
  .domain b { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .domain small { color: var(--mute); font-size: 10.5px; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .domain.down { border-color: var(--warn); }
  .domain.down small { color: var(--warn); }
  /* —— 域名健康条：一行摘要 + 去设置；完整诊断/安装指引在设置视图（R6） —— */
  .health { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px;
    padding: 5px 12px; border: 1px solid var(--warn); border-radius: 8px; margin: 0 0 10px;
    background: var(--card); }
  .health b { font-weight: 600; }
  .health .fix { color: var(--mute); }
  .health .goto { margin-left: auto; font-size: 12px; padding: 2px 10px; }
  button.link { background: none; border: none; padding: 0; color: var(--btn); text-decoration: underline;
    font: inherit; cursor: copy; min-height: 0; }
  button, .btn { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px;
                 border: 1px solid var(--line); background: var(--soft); color: var(--fg); cursor: pointer; }
  button.primary, .btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .line:focus-visible {
      outline: 2px solid var(--btn); outline-offset: 2px; }
  .reason { margin: 6px 0 0; color: var(--bad); font-size: 13px; white-space: pre-wrap; }
  .reason.warn { color: var(--warn); }
  .reason.info { color: var(--mute); }
  /* —— 详情面板（选中行下方；概览/入口/组件/依赖/日志分层） —— */
  .detail { border-top: 1px solid var(--hair); padding: 10px 16px 12px; }
  .detail h4 { font-size: 11px; margin: 10px 0 4px; color: var(--mute);
               text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .detail h4:first-child { margin-top: 2px; }
  details { margin: 6px 0 0; font-size: 13px; }
  summary { cursor: pointer; color: var(--mute); }
  table { border-collapse: collapse; margin: 6px 0; }
  td { padding: 2px 14px 2px 0; vertical-align: top; font-size: 12.5px; }
  td.k { color: var(--mute); white-space: nowrap; }
  pre { background: var(--soft); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto;
        font-size: 12px; white-space: pre-wrap; }
  .table-scroll { overflow-x: auto; }
  .msg { color: var(--mute); font-size: 12px; margin: 4px 0 0; }
  .diffbox { margin: 6px 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .diffbox summary { cursor: pointer; color: var(--warn); font-size: 13px; }
  .diffbox table { margin-top: 4px; }
  .msg.bad { color: var(--bad); }
  .field { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .field label { min-width: 110px; color: var(--mute); font-size: 13px; }
  .field input, .field select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px;
        border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 220px; flex: 1; }
  .inline-note { color: var(--mute); font-size: 12px; }
  .cand { border-top: 1px solid var(--line); padding: 10px 0; }
  .cand:first-child { border-top: 0; }
  .cand-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cand-head .name { flex: 1; }
  .comp-edit { background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .result-box { border-radius: 8px; padding: 8px 12px; margin: 8px 0; background: var(--soft); }
  .result-box.ok { color: var(--ok); } .result-box.bad { color: var(--bad); }
  .warnlist { color: var(--warn); font-size: 12px; white-space: pre-wrap; }
  .dot-sep { color: var(--line); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .muted { color: var(--mute); }
  .empty { color: var(--mute); padding: 22px 4px; text-align: center; }
  /* 设置视图（R6：设置与草稿分离；域名诊断完整内容归设置上下文） */
  .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
  .seg button.on { background: var(--btn); color: #fff; }
  .seg button + button { border-left: 1px solid var(--line); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  /* V2.11 溢出菜单（⋯）与自绘模态 */
  .kebab { border: 0; background: none; color: var(--mute); font-size: 15px; line-height: 1;
           padding: 2px 7px; border-radius: 6px; cursor: pointer; }
  .kebab:hover { background: var(--soft); color: var(--fg); }
  .menu-backdrop { position: fixed; inset: 0; z-index: 60; }
  .menu { position: absolute; z-index: 61; min-width: 168px; background: var(--card);
          border: 1px solid var(--line); border-radius: 9px; padding: 4px;
          box-shadow: 0 8px 26px rgba(0,0,0,.18); }
  .menu-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
               padding: 6px 10px; border: 0; border-radius: 6px; background: none;
               color: var(--fg); cursor: pointer; }
  .menu-item:hover, .menu-item:focus-visible { background: var(--soft); }
  .menu-item.danger { color: var(--bad); }
  .menu-sep { border-top: 1px solid var(--line); margin: 4px 2px; }
  .modal-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.34);
                   display: flex; align-items: flex-start; justify-content: center;
                   padding: 9vh 16px 16px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           box-shadow: 0 18px 48px rgba(0,0,0,.28); width: min(560px, 100%);
           max-height: 82vh; display: flex; flex-direction: column; }
  .modal h3 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-body { padding: 12px 16px; overflow-y: auto; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px 14px;
                border-top: 1px solid var(--line); }
  .modal-line { margin: 6px 0; }
  .modal-line.muted { color: var(--mute); font-size: 12px; }
  .radio { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 13px; }
  @media (max-width: 920px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
  /* W1：设置双栏按内容区宽度（容器查询）收缩——960 原生窗（视口不触发旧 920 断点）也能单列读长诊断 */
  @container mainc (max-width: 780px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; border-right: 0;
          border-bottom: 1px solid var(--line); }
    .navlabel, .navspacer { display: none; }
    .navitem { width: auto; }
    main, .topbar { padding-left: 14px; padding-right: 14px; }
    .line { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .domain, .statecell, .acts { grid-column: 1 / -1; }
    .acts { justify-content: flex-start; }
    button { min-height: 36px; }
  }
</style>
</head>
<body>
<div id="banner" class="banner" hidden>控制层不可用，服务状态未知——不代表项目已停止。恢复后自动消失。</div>
<div class="shell">
<nav aria-label="工作台导航">
  <div class="brand">
    <div class="brand-heading">
      <img src="/locove-logo.png" width="36" height="36" alt="">
      <div><h1>Locove／洛湾</h1><div class="brand-sub">本地服务工作台</div></div>
    </div>
    <div id="conn" role="status">连接中…</div>
  </div>
  <button class="navitem" id="nav-all" onclick="setView('all')">服务</button>
  <div class="navlabel" id="navProjectsLabel">项目</div>
  <div id="navProjects"></div>
  <div class="navlabel">管理</div>
  <button class="navitem" id="nav-attention" onclick="setView('attention')">需要处理<span id="attentionBadge" class="badge" hidden></span></button>
  <button class="navitem" id="nav-resources" onclick="setView('resources')">共享资源</button>
  <button class="navitem" id="nav-agents" onclick="setView('agents')">Agent 连接</button>
  <button class="navitem" id="nav-removed" onclick="setView('removed')">已移除登记</button>
  <div class="navspacer"></div>
  <button class="navitem add" id="nav-new-project" onclick="setView('new-project')">＋ 添加服务<span id="draftBadge" class="badge mut" hidden></span></button>
</nav>
<section class="content">
  <header class="topbar">
    <h2 id="viewTitle">服务</h2>
    <div class="subtitle" id="viewSubtitle"></div>
    <div class="tools">
      <input id="globalSearch" type="search" placeholder="搜索项目 / 服务" aria-label="全局搜索">
      <button id="refreshBtn" onclick="refresh(true)">刷新</button>
      <button id="nav-settings" aria-pressed="false" onclick="setView('settings')">设置</button>
    </div>
  </header>
  <div id="locoveHealth" role="status"></div>
  <main id="main" aria-live="polite"></main>
</section>
</div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const H = {"X-LocalServices-Token": TOKEN, "Content-Type": "application/json"};
const pending = {};   // key -> in-flight action label（防重复点击）
const msgs = {};
const open = {};      // service id -> details open
const logs = {};      // service id -> log text
let snap = null;      // /api/status
let registry = null;  // /api/registry
let agentCandidates = null;  // /api/agents/candidates（连接页候选，按需加载）
let agentsData = null, resourcesData = null, draftsData = null, removedData = null;
let locoveData = null;   // /api/locove：dns / 入口 / 代理三层健康 + 路由事实
let view = "all";     // all | project:<id> | attention | removed | resources | agents | drafts | new-project
let connOk = null;
let draftEdit = {};         // draft id -> 编辑中的 service 字段
let wiz = newWizard();
// V2.11 自绘交互状态
let modalState = null;      // 打开中的模态（{overlay, dialog, okBtn}）；轮询刷新期间不重建内容区
let menuState = null;       // 打开中的 ⋯ 菜单
let __rmDisp = "keep-external";   // 移除对话框的处置选择（radio 回写）
let __modalInput = "";            // 模态内单行输入（重命名等）
let editState = null;             // 编辑对话框状态（两步：dry_run diff → 确认注册）
const removedIntents = {};        // 恢复目标 -> "stopped" | "running"（缺省 stopped）

function newWizard() {
  return {step: "dir", dir: "", name: "", agent: "", project: null,
          jobId: null, job: null, pollTimer: null, error: "",
          candidates: [], unresolved: [], results: {}, registering: false, manual: false,
          diffs: {},        // 候选下标 → dry_run 差异（与已登记服务的对比预览）
          dirs: [],         // 多目录联合识别：待分析目录队列
          presetDirs: []};  // 已有项目预置的目录选择
}

// ------------------------------------------------------------ 基础设施

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: H, body: body ? JSON.stringify(body) : undefined});
  let data = null;
  try { data = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
  return [r.status, data];
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function t(ts) { return ts ? new Date(ts*1000).toLocaleString("zh-CN", {hour12:false}) : "—"; }
function busy(key) { return !!pending[key]; }

function setConn(ok) {
  if (connOk === ok) return;
  connOk = ok;
  document.getElementById("banner").hidden = ok !== false;
  const c = document.getElementById("conn");
  if (ok === false) { c.textContent = "控制层不可用"; c.className = "bad"; }
}

function nativeBridge() {
  try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lsbridge) || null; }
  catch (e) { return null; }
}
// 原生目录选择回调（WKWebView 注入；浏览器环境走 chooseDirectory 的输入框退化）
window.lsPickDirectory = function(path) {
  const cb = window.__lsPickCb;
  window.__lsPickCb = null;
  if (cb) cb(typeof path === "string" ? path : null);
};

// ------------------------------------------------------------ 数据视图

function servicesById() {
  const m = {};
  for (const p of (snap?.projects || [])) m[p.id] = p;
  return m;
}

function projectGroups() {
  const byId = servicesById();
  const out = [];
  const claimed = new Set();
  const projects = (registry?.registry?.projects || []).slice()
    .sort((a, b) => (b.favorite - a.favorite) || a.name.localeCompare(b.name, "zh-CN"));
  for (const pj of projects) {
    const members = (pj.services || []).map(s => byId[s]).filter(Boolean);
    if (!members.length) { out.push({pj, members: []}); continue; }
    members.forEach(m => claimed.add(m.id));
    out.push({pj, members});
  }
  const orphans = (snap?.projects || []).filter(p => !claimed.has(p.id));
  if (orphans.length) out.push({pj: {id: "", name: "未分组服务", favorite: false, agent: "none",
                                     directories: [], services: orphans.map(o => o.id), revision: 0},
                                members: orphans, orphan: true});
  return out;
}

function matchesSearch(s) {
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  if (!q) return true;

function projectMatchesSearch(pj, members) {

  // V2.11：模态/菜单打开时轮询刷新只更新内部状态，绝不重建内容区 DOM
  if (uiLocked()) return;
  // UX2（review 2026-11-05）：用户正阅读/选择日志区（悬停或持有选区）时，
  // 后台触发的整树重建一律延后——选择、焦点与滚动位置不允许被打断。

  // W1：与上次写入内容一致且期间无外部改写时跳过重建——同轮询周期内状态不变则
  // 焦点/选区/滚动/悬停节点身份天然保持；变化（或 #main 被外部改写）时按锚点与
  // DOM 路径恢复滚动和焦点（见 replaceMain）
  if (html !== __lastWritten || __mainDirty) replaceMain(main, html, a);

    const el = document.getElementById(location.hash.slice(1));
    if (el && el.scrollIntoView) el.scrollIntoView({block: "center"});

// —— W1 轮询稳定性：整树重建不可避免时，焦点/滚动/日志滚动位置按锚点恢复 ——
let __lastWritten = null;   // 上次 replaceMain 写入的 html
let __mainDirty = false;    // #main 被 replaceMain 之外改写（如测试/注入）→ 下次 render 强制重建
let __replacing = false;
try {
  if (typeof MutationObserver === "function") {
    new MutationObserver(() => { if (!__replacing) __mainDirty = true; })
      .observe(document.getElementById("main"), {childList: true});
  }
} catch (e) { /* 无头桩环境无 MutationObserver */ }
// DOM 路径 = main 内子元素下标链；重建后同一路径且同 tagName 的元素恢复焦点
// （文本变化也接受按钮——如「启动并打开→启动中…」，焦点留在原位比丢失好）。
function domPath(root, el) {
  const path = [];
  try {
    let n = el;
    while (n && n !== root) {
      const parent = n.parentElement || n.parent;
      if (!parent) return null;
      const kids = parent.children || [];
      let idx = -1;
      for (let i = 0; i < kids.length; i++) if (kids[i] === n) { idx = i; break; }
      if (idx < 0) return null;
      path.unshift(idx);
      n = parent;
    }
  } catch (e) { return null; }
  return path.length ? path : null;
}
function findByDomPath(root, path, tag) {
  try {
    let n = root;
    for (const idx of path) {
      const kids = n.children || [];
      if (idx >= kids.length) return null;
      n = kids[idx];
    }
    return (!tag || n.tagName === tag) ? n : null;
  } catch (e) { return null; }
}
// 滚动锚点 = 视口内第一个可见的带 id 块（服务行/分组/卡片）；重建后校正 dy，抵消上方内容高度变化
function scrollAnchor() {
  try {
    for (const el of document.querySelectorAll("main section[id], main .card")) {
      const top = el.getBoundingClientRect().top;
      if (top >= -2) return {id: el.id, top};
    }
  } catch (e) { /* 无头桩 DOM 无布局 */ }
  return null;
}

function replaceMain(main, html, activeEl) {
  const focusInfo = activeEl && main.contains(activeEl) && activeEl.tagName !== "BODY"
    ? {path: domPath(main, activeEl), tag: activeEl.tagName} : null;
  const anchor = scrollAnchor();
  const preTops = [];
  try { main.querySelectorAll("pre[id]").forEach(pre => preTops.push([pre.id, pre.scrollTop])); } catch (e) {}
  __replacing = true;
  main.innerHTML = html;
  __lastWritten = html;
  __mainDirty = false;
  // 微任务序：本 observer 回调先于标志清除（替换自身的变更不算外部改写）
  Promise.resolve().then(() => { __replacing = false; });
  try {
    for (const [id, top] of preTops) { const pre = document.getElementById(id); if (pre) pre.scrollTop = top; }
    if (anchor && anchor.id && typeof window.scrollBy === "function") {
      const el = document.getElementById(anchor.id);
      if (el && el.getBoundingClientRect) {
        const dy = el.getBoundingClientRect().top - anchor.top;
        if (dy) window.scrollBy(0, dy);
      }
    }
    if (focusInfo && focusInfo.path) {
      const el = findByDomPath(main, focusInfo.path, focusInfo.tag);
      if (el && el.focus) { try { el.focus({preventScroll: true}); } catch (e) { el.focus(); } }
    }
  } catch (e) { /* 无头桩环境：恢复步骤尽力而为，不阻塞渲染 */ }
}

function copyText(text, key, label) {
  const done = ok => { msgs[key] = ok ? (label || "已复制") + "：" + text : "复制失败（浏览器未授权剪贴板）"; render();
    setTimeout(() => { delete msgs[key]; render(); }, 1800); };
  try {
    if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); return; }
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    done(document.execCommand("copy")); ta.remove();
  } catch (e) { done(false); }
}

function domainSettings() { return locoveData?.settings || {use_domains: false, domain_form: "suffix"}; }

function directUrl(p) {
  if (p.open) return p.open;
  const c = (p.components || []).find(x => x.kind === "server" && x.port);
  if (c) return `http://127.0.0.1:${c.port}/`;
  // 兜底：路由事实里的配置端口（停止服务也保留）
  const route = Object.values(locoveData?.routes || {}).find(r => r.service === p.id && r.upstream_port);
  return route ? `http://127.0.0.1:${route.upstream_port}/` : "";
}

function domainChip(p) {
  // V3.5/D3：默认本地 IP 直连；开启域名后显示带端口（:5670）的域名入口
  const st = domainSettings();
  const eps = p.endpoints || [];
  if (st.use_domains) {
    const e = st.domain_form === "custom" ? (eps.find(x => !x.derived) || null) : eps[0];
    if (!e) return "";
    const route = locoveData?.routes?.[e.host];
    const ok = locoveData?.state === "available";
    const served = route && route.state === "proxy";
    const sub = !ok ? "域名模块未就绪（仍可直连）"
      : served ? `:${locoveData?.domain_port || 5670} · 点击复制` : "未运行时显示不可用页";
    const url = e.public_url || `http://${e.host}:${locoveData?.domain_port || 5670}${e.open_path}`;
    return `<button class="domain${ok ? "" : " down"}" title="${esc(url)}（点击复制）"
      onclick="event.stopPropagation();copyText('${esc(url)}','${p.id}','地址')">
      <b>${esc(e.host)}:${locoveData?.domain_port || 5670}</b><small>${esc(sub)}</small></button>`;
  }
  const url = directUrl(p);
  if (!url) return "";
  let label = url;
  try { const u = new URL(url); label = u.host; } catch (err) {}
  return `<button class="domain" title="${esc(url)}（点击复制）"
    onclick="event.stopPropagation();copyText('${esc(url)}','${p.id}','地址')">
    <b>${esc(label)}</b><small>本地直连 · 点击复制（域名需在设置中开启）</small></button>`;
}

async function locoveSetting(key, value) {
  const [, res] = await api("POST", "/api/locove/settings", {[key]: value});
  if (res?.ok && locoveData) locoveData.settings = res.settings;
  msgs["locove-settings"] = res?.ok
    ? `域名跳转：${res.settings.use_domains ? "开" : "关"} · ${res.settings.domain_form === "custom" ? "自定义域名" : "后缀式 <id>.locove"}`
    : `保存失败：${res?.error || ""}`;
  render();
  if (res?.ok) setTimeout(() => { delete msgs["locove-settings"]; render(); }, 2000);
}

function primary(p) {
  if (p.observe_only) return "";
  if (connOk === false || p.state === "unknown") return `<button class="primary" data-act="unknown" disabled>状态未知</button>`;
  const isBusy = busy(p.id) || busy("g-" + p.group) || p.op || ["starting", "stopping", "preparing"].includes(p.state);
  if (isBusy) return `<button class="primary" data-act="busy" disabled>${p.state === "preparing" ? "准备环境…" : p.state === "stopping" || pending[p.id] === "stop" ? "停止中…" : "启动中…"}</button>`;
  if (["available", "partial", "external"].includes(p.state))
    return p.can_open ? `<button class="primary" data-act="open" onclick="act('${p.id}','open')">打开</button>` : "";
  if (["failed", "conflict"].includes(p.state))
    return `<button class="primary" data-act="reason" onclick="showServiceReason('${esc(p.id)}')">查看原因</button>`;
  return `<button class="primary" data-act="start-open" onclick="act('${p.id}','start',{open:true})">启动并打开</button>`;
}

// R6：次要操作（接管/重试/停止/重启/源码目录）按交互层级收拢进 ⋯ 菜单；
// 行内保留一个主操作 + 稳定的「日志」入口。
function lifecycleMenuItems(sid) {
  const p = servicesById()[sid] || {};
  const dis = busy(p.id) || busy("g-" + p.group) || p.op;
  const items = [];
  if (p.observe_only) {
    for (const a of (p.actions || []))
      items.push({label: a.label || a.id, disabled: !!dis, run: () => act(sid, "action", {name: a.id})});
    return items;
  }
  if (p.can_takeover) items.push({label: "接管…", disabled: !!dis, run: () => askTakeover(sid)});
  if (["failed", "conflict"].includes(p.state) && !p.can_takeover)
    items.push({label: "重试", disabled: !!dis, run: () => act(sid, "start", {open: true})});
  if (p.state !== "external" && (p.intent === "running" || p.state !== "stopped"))
    items.push({label: "停止", disabled: !!dis, run: () => act(sid, "stop")});
  if (p.intent === "running" && p.state !== "external")
    items.push({label: "重启", disabled: !!dis, run: () => act(sid, "restart")});
  return items;
}

async function askTakeover(sid) {
  await showModal({title: "接管外部实例", okText: "接管", danger: true, bodyHtml: `
    <p class="modal-line">接管会停止这个由外部启动的实例，并由本工具从最新源码启动。</p>
    <p class="modal-line">有活动任务时会等空闲再自动接管（届时可在状态行看到提示）。</p>`,
    onOk: async () => { await act(sid, "takeover"); return true; }});
}

// V2.11：折叠区只保留技术明细；移除登记动作已上移到服务行的 ⋯ 菜单（见 serviceMenuItems）
// <!-- 移除入口已移至服务 ⋯ 菜单（V2.11） -->
function detailsHtml(p) {
  // R6 详情分层：概览（诊断优先）/ 入口 / 组件 / 依赖 / 日志；技术参数不挤服务行
  const componentAction = c => p.group && c.kind === "server" && c.running && p.state !== "external"
    ? `<button ${p.op || busy(p.id) || busy("g-" + p.group) ? "disabled" : ""} onclick="act('${p.id}','restart',{components:['${c.id}']})">仅重启${c.id === "api" ? " API" : c.id === "web" ? "前端" : " " + esc(c.name)}</button>` : "";
  const rows = (p.components || []).map(c =>
    `<tr><td class="k">${esc(c.name)}</td><td>${esc(c.label)}${c.detail ? "：" + esc(c.detail) : ""}</td>
     <td class="k">${c.kind === "generator" ? (c.last_run ? "最近 " + t(c.last_run) : "") : (c.pid ? "pid " + c.pid + " · 启动于 " + t(c.started_at) : "")}</td>
     <td class="k">${c.code ? esc(c.code.label) + (c.code.detail ? "：" + esc(c.code.detail) : "") : ""}</td><td>${componentAction(c)}</td></tr>`).join("");
  const deps = (p.dependencies || []).map(d =>
    `<tr><td class="k">依赖 ${esc(d.name)}</td><td>${d.ok ? "可用" : "不可用"}${d.detail ? "：" + esc(d.detail) : ""}</td><td class="k">${d.managed ? "" : "外部管理"}</td><td class="k">${esc(d.note || "")}</td></tr>`).join("");
  const extra = p.observe_only ? `<tr><td class="k">状态</td><td colspan="3">${esc(p.detail || "")}</td></tr>` : "";
  const src = `<tr><td class="k">源码</td><td colspan="3">${esc(p.source)}${p.code && p.code.process_started ? " · 进程启动于 " + t(p.code.process_started) : ""}${p.code && p.code.newest_change ? " · 最近源码修改 " + t(p.code.newest_change) : ""}</td></tr>`;
  const intentRow = `<tr><td class="k">运行意图</td><td colspan="3">${p.intent === "running" ? "运行" : "停止"}${p.intent_by ? " · 由 " + esc(p.intent_by) + " 设置" : ""}${p.managed_by === "external" ? " · 外部管理" : ""}</td></tr>`;
  const reasonRow = p.reason ? `<tr id="reason-${esc(p.id)}" tabindex="-1"><td class="k">诊断</td><td colspan="3" class="${["failed","conflict"].includes(p.state) ? "" : "muted"}" style="white-space:pre-wrap">${esc(p.reason)}</td></tr>` : "";
  const lg = logs[p.id] !== undefined ? `<pre id="logs-${p.id}">${esc(logs[p.id] || "(无日志)")}</pre>`
    : `<p class="inline-note">日志随「日志」按钮加载到此处（最近 200 行）。</p>`;
  const eps = (p.endpoints || []).map(e => {
    const route = locoveData?.routes?.[e.host];
    const st = !route ? "未生成路由" : route.state === "proxy"
      ? `代理中 → 127.0.0.1:${route.upstream_port}` : "明确不可用页（503）";
    return `<tr><td class="k">入口 ${esc(e.id)}</td>
      <td><button class="link" onclick="copyText('${esc(e.public_url)}','${p.id}','地址')" title="点击复制">${esc(e.public_url)}</button>
        <span class="note">（组件 ${esc(e.component)} · 落点 ${esc(e.open_path)}）</span></td>
      <td class="k">${esc(st)}</td><td></td></tr>`;
  }).join("");
  const direct = p.observe_only ? "" : `<tr><td class="k">直连地址</td><td colspan="3">${esc(p.open || "—")}<span class="note">（内部端口实现细节；域名形式为 http://域名:5670，在设置中启用）</span></td></tr>`;
  return `<div class="detail" id="detail-${esc(p.id)}" tabindex="-1">
    <h4>概览</h4>
    <div class="table-scroll"><table>${reasonRow}${extra}${intentRow}${src}</table></div>
    ${eps ? `<h4>入口</h4><div class="table-scroll"><table>${eps}${direct}</table></div>` : ""}
    ${rows ? `<h4>组件</h4><div class="table-scroll"><table>${rows}</table></div>` : ""}
    ${deps ? `<h4>依赖</h4><div class="table-scroll"><table>${deps}</table></div>` : ""}
    <h4>日志</h4>${lg}
  </div>`;
}

function groupToolbar(gid, members) {
  const busyG = busy("g-" + gid) || members.some(m => m.op || busy(m.id));
  const disabled = busyG || members.some(m => ["unknown", "external", "conflict"].includes(m.state)) ? "disabled" : "";
  const count = members.reduce((n, m) => n + m.components.filter(c => c.kind === "server").length, 0);
  const msg = msgs["g-" + gid] ? `<p class="note" role="status">${esc(msgs["g-" + gid])}</p>` : "";
  return `<div class="group-tools" aria-label="${esc(gid)} 工作区">
    <span>${esc(members[0]?.group_name || gid)} 工作区</span><div class="acts">
    <button ${disabled} onclick="groupAct('${gid}','start')">启动全部</button>
    <button ${disabled} onclick="groupAct('${gid}','restart')">${busyG ? "工作区操作中…" : `重启全部（${count} 个服务）`}</button>
    <button ${disabled} onclick="if(confirm('停止工作区中的全部服务？'))groupAct('${gid}','stop')">停止全部</button>
    </div></div>${msg}`;
}

function viewAll() {
  if (!snap) return connOk === false
      ? `<div class="empty">控制层不可用，服务状态未知——不代表项目已停止。</div>`
      : `<div class="empty">加载中…</div>`;
  const sys = (snap.system_warnings || []).map(w => `<p class="reason warn">⚠︎ ${esc(w)}</p>`).join("");
  const head = sys + (snap.manifest_error ? `<p class="reason">${esc(snap.manifest_error)}</p>` : "");
  const groups = projectGroups().filter(g => projectMatchesSearch(g.pj, g.members));
  const body = groups.map(({pj, members, orphan}) => {
    const shown = members.filter(matchesSearch);
    if (!shown.length && members.length) return "";
    const groupIds = [...new Set(shown.filter(m => m.group).map(m => m.group))];
    // 单服务项目：不重复项目标题（行内名称即身份），只留收藏与项目菜单（slim header）
    const slim = !orphan && members.length === 1 && !groupIds.length;
    const ghead = slim
      ? `<div class="group-head"><button class="star${pj.favorite ? " on" : ""}" onclick="toggleFav('${pj.id}')" aria-label="收藏">${pj.favorite ? "★" : "☆"}</button>
         <span class="note" style="margin:0 auto 0 0">项目 ${esc(pj.name)}</span>
         <button class="kebab" aria-haspopup="menu" aria-label="项目菜单（添加服务 / 重新识别 / 重命名 / 移除项目）" onclick="toggleMenu(event,'proj:${esc(pj.id)}')">⋯</button></div>`
      : `<div class="group-head">
        ${orphan ? "" : `<button class="star${pj.favorite ? " on" : ""}" onclick="toggleFav('${pj.id}')" aria-label="收藏">${pj.favorite ? "★" : "☆"}</button>`}
        <h3>${esc(pj.name)}</h3>
        <span class="note">${members.length} 个服务${pj.agent && pj.agent !== "none" ? " · Agent " + esc(pj.agent) : ""}</span>
        ${orphan ? "" : `<div class="acts"><button class="ghost" onclick="setView('project:${esc(pj.id)}')">项目详情</button><button class="kebab" aria-haspopup="menu" aria-label="项目菜单（添加服务 / 重新识别 / 重命名 / 移除项目）" onclick="toggleMenu(event,'proj:${esc(pj.id)}')">⋯</button></div>`}
      </div>`;
    return `<section class="group" aria-label="项目 ${esc(pj.name)}">

  }).join("");
  return head + (body || `<div class="empty">没有匹配的项目或服务。${connOk === false ? "（控制层不可用）" : ""}</div>`);
}

const AGENT_STATUS = {
  not_installed: "未安装", config_only: "已安装，未登录", not_executable: "存在但不可执行",
  needs_login: "需要登录", call_failed: "调用失败", available: "可用（已验证）"};

function viewAgents() {
  if (!agentsData) return `<div class="empty">加载中…</div>`;
  const conns = agentsData.connections || {};
  const cards = ["codex", "claude"].map(kind => {
    const c = conns[kind];
    if (!c) return `<section class="card"><div class="card-head"><h3>${kind}</h3></div><p class="note">未扫描到</p></section>`;
    const verifying = busy("verify-" + kind);
    return `<section class="card">
      <div class="card-head"><h3>${kind}${c.is_default ? '<span class="badge mut">默认</span>' : ""}</h3>
        <div class="acts">
          <button onclick="agentsVerify('${kind}')" ${verifying ? "disabled" : ""}>${verifying ? "验证中…（最长 120 秒）" : "最小调用验证"}</button>
          <button onclick="agentsScan()" ${busy("scan") ? "disabled" : ""}>重新扫描</button>
          <button onclick="agentsDefault('${kind}')" ${c.is_default || busy("default-" + kind) ? "disabled" : ""}>${c.is_default ? "已是默认" : "设为默认"}</button>
        </div></div>
      <table>
        <tr><td class="k">状态</td><td class="${c.status === "available" ? "" : c.status === "not_installed" ? "muted" : ""}" style="font-weight:600">${AGENT_STATUS[c.status] || c.status}${c.status === "available" && c.verified_at ? "（" + t(c.verified_at) + " 验证）" : ""}</td></tr>
        <tr><td class="k">路径</td><td>${esc(c.path || "—")}</td></tr>
        <tr><td class="k">版本</td><td>${esc(c.version || "—")}</td></tr>
        <tr><td class="k">配置根</td><td>${esc(c.config_root || "—")}</td></tr>
        ${c.detail ? `<tr><td class="k">说明</td><td>${esc(c.detail)}</td></tr>` : ""}
      </table></section>`;
  }).join("");
  const manual = busy("scan");
  return cards + candidatesCard() + `<section class="card">
    <div class="card-head"><h3>手动指定路径</h3></div>
    <div class="field"><input id="agentPathInput" placeholder="/path/to/codex 或包含它的目录" aria-label="手动 agent 路径">
      <button onclick="agentsScan(document.getElementById('agentPathInput').value)" ${manual ? "disabled" : ""}>${manual ? "扫描中…" : "按此路径扫描"}</button>
      <span class="inline-note">验证为真实最小调用，最长 120 秒；超时请重试</span></div>
  </section>`;
}

// 已知工具能以受支持方式提供的项目候选（或明确不支持）；导入只建项目，不注册服务、不启动
function candidatesCard() {
  const c = agentCandidates?.candidates || {};
  let html = `<section class="card"><div class="card-head"><h3>已知工具的项目候选</h3></div>`;
  for (const kind of ["claude", "codex"]) {
    const e = c[kind];
    if (!e) { html += `<p class="note">${kind}：未知</p>`; continue; }
    if (!e.supported) { html += `<p class="note">${kind}：${esc(e.reason || "不支持")}</p>`; continue; }
    const registered = new Set((registry?.registry?.projects || []).flatMap(p => (p.directories || []).map(d => d.path)));
    const list = (e.candidates || []).map(p => ({p, known: registered.has(p)}));
    const fresh = list.filter(x => !x.known);
    html += `<p class="note">${kind}：${fresh.length} 个未登记目录（已登记 ${list.length - fresh.length} 个已去重隐藏）</p>`;
    html += `<div class="table-scroll"><table>` + fresh.slice(0, 12).map(x =>
      `<tr><td>${esc(x.p)}</td><td><button onclick="importCandidate('${esc(x.p).replace(/'/g, "&#39;")}')">导入为项目</button></td></tr>`).join("") + `</table></div>`;
  }
  html += `<p class="inline-note">导入只创建项目并关联目录，不注册服务、不启动任何进程。</p></section>`;
  return html;
}

async function loadCandidates() {
  try { const [c, d] = await api("GET", "/api/agents/candidates"); if (c === 200) agentCandidates = d; } catch (e) { /* 辅助信息，失败不阻塞 */ }
}

async function importCandidate(path) {
  const name = path.split("/").filter(Boolean).pop() || path;
  try {
    const [code, res] = await api("POST", "/api/projects", {name, directories: [{path}]});
    if (code !== 200) { alert(res?.error || "导入失败"); return; }
    await refresh();
    setView("project:" + (res.project?.id || res.id || ""));
  } catch (e) { setConn(false); }
}

// V2.6/R08：消费者（谁引用）、归属（共享/独占）、bind_mounts、已停止徽标——数据都在盘点响应里
function resourceConsumers(rid) { return (resourcesData?.consumers?.[rid]) || []; }
function consumerProject(sid) {
  return (registry?.services || []).find(s => s.id === sid)?.project || null;
}

function viewResources() {
  if (!resourcesData) return `<div class="empty">加载中…</div>`;
  if (!resourcesData.ok) return `<section class="card"><div class="card-head"><h3>Docker 不可达</h3></div>
    <p class="reason warn" style="margin:0 0 6px">${esc(resourcesData.error || "未知原因")}</p>
    <p class="note">共享资源仅做只读盘点，不影响其他功能。</p></section>`;
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  const rows = (resourcesData.resources || []).filter(r => !q ||
      r.name.toLowerCase().includes(q) || (r.image || "").toLowerCase().includes(q)).map(r => {
    const ports = Object.entries(r.ports || {}).map(([k, v]) =>
      esc(k) + " → " + v.map(b => b.host_port).join("/")).join("<br>") || "—";
    const rid = r.id || ("container:" + r.name);
    const cons = resourceConsumers(rid);
    const projects = [...new Set(cons.map(x => consumerProject(x.service)).filter(Boolean))];
    const ownership = !cons.length ? "未被引用"
      : projects.length > 1 ? "共享（多项目引用）"
      : `由 ${cons.map(x => esc(x.service)).join("、")} 使用`;
    const consCell = cons.map(x =>
      `${esc(x.service)}（via ${esc(x.via || "dependency")}）[${x.running ? "运行中" : "未运行"}]`).join("<br>") || "—";
    const binds = (r.bind_mounts || []).map(b => `${esc(b.source)}→${esc(b.target)}`).join("<br>") || "—";
    const stateCell = esc(r.state) + (r.state && r.state !== "running" ? ` <span class="badge mut">已停止</span>` : "");
    return `<tr><td style="font-weight:600">${esc(r.name)}</td><td>${esc(r.image || "—")}</td>
      <td>${stateCell}</td><td>${esc(r.health || "none")}</td>
      <td>${esc(r.compose_project || "—")}${r.compose_service ? " / " + esc(r.compose_service) : ""}</td>
      <td>${ports}</td><td>${esc((r.volumes || []).join(", ") || "—")}</td>
      <td>${binds}</td><td>${consCell}</td><td>${ownership}</td></tr>`;
  }).join("");
  return `<section class="card">
    <div class="card-head"><h3>共享资源</h3><span class="note">docker context：${esc(resourcesData.docker_context || "default")} · 只读盘点（含已停止容器）· 归属/消费者由清单推导</span></div>
    <div class="table-scroll"><table>
      <tr><td class="k">名称</td><td class="k">镜像</td><td class="k">状态</td><td class="k">健康</td><td class="k">compose 项目</td><td class="k">端口映射</td><td class="k">卷</td><td class="k">bind_mounts</td><td class="k">消费者</td><td class="k">归属</td></tr>
      ${rows || `<tr><td class="muted">（无容器）</td></tr>`}
    </table></div></section>`;
}

function draftSummary(payload) {
  const s = payload?.service || {};
  return `服务 ${s.id || "(无 id)"} · ${s.name || "(未命名)"} · 源码 ${s.source || "?"} · 组件 ${(s.components || []).map(c => c.id).join(", ") || "无"}`;

function locoveStateChip(d) {
  const map = {
    not_installed: ["未安装", "mut"], installed_off: ["已安装 · 未开启", "mut"],
    starting: ["启动中…", "warn"], available: ["可用", "ok"], failed: ["失败", "bad"],
  };
  const [label, cls] = map[d.state] || ["未知", "mut"];
  return `<span class="badge ${cls}" id="locove-state">${label}</span>`;
}

function domainPreviewUrl(d) {
  const ep = (snap?.projects || []).flatMap(p => p.endpoints || [])[0];
  const host = ep ? ep.host : `<服务名>.${d.suffix}`;
  return `http://${host}:${d.domain_port || 5670}${ep ? ep.open_path : "/"}`;
}

function locoveSettingsCard() {
  const d = locoveData;
  if (!d) return "";
  const st = d.settings || {use_domains: false, domain_form: "suffix"};
  const opt = d.optin || {};
  const port = d.domain_port || 5670;
  const running = opt.active;
  const stepLine = running || opt.error || (opt.steps || []).length
    ? `<p class="note" role="status">${running ? `进行中：${opt.step || ""}…` : ""}
       ${opt.error ? `<span class="reason bad">${esc(opt.error)}</span>` : ""}</p>` : "";
  const enableBtn = st.use_domains ? "" :
    `<button class="primary" ${running ? "disabled" : ""} onclick="askEnableDomain()">${running ? "操作进行中…" : "启用域名访问…"}</button>`;
  const offBtns = !st.use_domains ? "" :
    `<button ${running ? "disabled" : ""} onclick="locoveOp('disable')">关闭（回直连，停止 DNS/代理）</button>`;
  return `<div class="card" id="locove-settings">
    <div class="card-head"><h3>域名访问（可选）</h3>${locoveStateChip(d)}
      <span class="note">默认本地 IP 直连；域名是按需启用的高端口入口</span></div>
    <div class="field"><label>访问形式</label>
      <code class="mono">${esc(domainPreviewUrl(d))}</code>
      <span class="inline-note">Caddy 直接监听回环 :${port}（普通用户运行，不经 80）；DNS 仅把 *.${esc(d.suffix)} 指到本机</span></div>
    <div class="field"><label>端口</label>
      <input type="number" min="1024" max="65535" value="${port}" style="max-width:110px"
             aria-label="域名端口" onchange="locovePort(this.value)">
      <span class="inline-note">启用前检查占用；控制面 47800/47891/5354 不可用。修改端口需重新启用/重启代理</span></div>
    <div class="field"><label>操作</label>
      ${enableBtn}${offBtns}
      <button class="ghost" ${running ? "disabled" : ""} onclick="askUninstallDomain()">卸载域名件…</button></div>
    ${st.use_domains ? `<div class="field"><label>域名形式</label>
      <span class="seg">
        <button class="${st.domain_form === "suffix" ? "on" : ""}" onclick="locoveSetting('domain_form','suffix')">后缀式</button>
        <button class="${st.domain_form === "custom" ? "on" : ""}" onclick="locoveSetting('domain_form','custom')">自定义</button>
      </span>
      <span class="inline-note">后缀式 = 每个服务派生 <code>&lt;service-id&gt;.${esc(d.suffix)}</code>；自定义 = 仅显式登记的域名</span></div>` : ""}
    ${stepLine}
    <p class="note">启用需一次管理员授权（仅安装 .${esc(d.suffix)} 解析配置）；取消后继续直连，日常启停不再需要授权。DNS/代理仅本机回环可访问，不替换全局 DNS、不安装证书、不上云。</p>
    ${msgs["locove-settings"] ? `<p class="msg" role="status">${esc(msgs["locove-settings"])}</p>` : ""}
  </div>`;
}

async function locovePort(v) {
  const port = parseInt(v, 10);
  if (!port || port < 1024 || port > 65535) {
    msgs["locove-settings"] = `端口 ${v} 无效（需 1024–65535）`; render(); return;
  }
  const [, res] = await api("POST", "/api/locove/settings", {domain_port: port});
  msgs["locove-settings"] = res?.ok ? `域名端口已保存：${port}（生效需启用/重启域名模块）`
                                     : `保存失败：${res?.error || ""}`;
  await refresh(); render();
}

async function askEnableDomain() {
  const d = locoveData || {};
  const port = d.domain_port || 5670;
  await showModal({title: "启用域名访问", okText: "安装并启用", bodyHtml: `
    <p class="modal-line">启用后通过 <b>服务名.${esc(d.suffix || "locove")}:${port}</b> 访问。</p>
    <p class="modal-line">需要安装仅针对 .${esc(d.suffix || "locove")} 的本地解析配置，并启动仅本机可访问的 DNS 和代理（回环 :${port}）。不会替换全局 DNS、安装证书或开放局域网访问。首次安装需要管理员确认；取消后可继续直连。</p>

async function askUninstallDomain() {
  await showModal({title: "卸载域名件", okText: "卸载", danger: true, bodyHtml: `
    <p class="modal-line">将停止并移除本工具的 DNS/代理 agent 与路由配置；解析配置（resolver）默认保留——移除它需要再一次管理员确认。</p>
    <p class="modal-line">服务登记、业务进程与数据不受影响；之后全部通过本地直连地址访问。</p>`,
    onOk: async () => { await locoveOp("uninstall", {keep_resolver: true}); return true; }});
}

async function locoveOp(op, body = {}) {
  pending["locove-op"] = true; msgs["locove-op"] = null; render();
  try {
    const [code, res] = await api("POST", `/api/locove/${op}`, body);
    if (code === 200 && res?.ok) {
      msgs["locove-settings"] = op === "enable" ? "域名模块启动中…（含管理员授权与验证，见下方进度）"
        : op === "disable" ? "已关闭：直连模式，DNS/代理已停止（安装件保留）" : "卸载已启动（解析配置默认保留）";
    } else {
      msgs["locove-settings"] = `操作失败：${res?.error || code}`;
    }
  } catch (e) { msgs["locove-settings"] = "无法连接控制服务"; setConn(false); }
  pending["locove-op"] = null;
  await refresh(); render();
}

function locoveDiagnosticsCard() {
  const d = locoveData;
  if (!d) return "";
  const row = (ok, name, detail) => `<tr><td class="k">${esc(name)}</td><td>${ok === null || ok === undefined ? "—" : ok ? "✓ " + esc(detail || "正常") : "✗ " + esc(detail || "")}</td></tr>`;
  const pbRow = d.proxy_bypass ? row(d.proxy_bypass.ok, "代理绕行（浏览器路径）", d.proxy_bypass.detail) : "";
  const hosts = Object.entries(d.routes || {}).map(([h, r]) =>
    `<tr><td class="k">${esc(h)}</td><td>${r.state === "proxy" ? `代理中 → 127.0.0.1:${r.upstream_port}` : "明确不可用页（503）"}<span class="note">（${esc(r.service)}.${esc(r.component)}）</span></td></tr>`).join("");
  const legacy = d.legacy_80
    ? `<tr><td class="k">旧 80 入口</td><td>仍登记（V3.4 转发器）。退役：<code class="mono">sudo scripts/retire-locove-80.sh --apply</code>（旧无端口书签将失效，改用 :${d.domain_port} 地址）</td></tr>` : "";
  return `<section class="card"><div class="card-head"><h3>域名诊断</h3><span class="note">*.${esc(d.suffix)}:${d.domain_port} · 仅在启用域名时相关</span></div>
    <div class="table-scroll"><table>
      ${row(d.dns?.ok, `本地 DNS（:${5354}）`, d.dns?.detail)}
      ${row(d.proxy?.ok, `代理（Caddy :${d.domain_port}）`, d.proxy?.detail)}
      ${row(d.resolver?.ok, `split DNS（/etc/resolver/${esc(d.suffix)}）`, d.resolver?.detail)}
      ${d.state !== "not_installed" ? pbRow : ""}${legacy}
    </table></div>
    ${d.proxy_bypass?.ok === false && d.state !== "not_installed" ? `<p class="note">绕行立即修复：<code class="mono">sudo scripts/locove-proxy-bypass.sh ${esc(d.suffix)}</code>；永久修复需在网关客户端（如 Clash Verge → 设置 → 系统设置 → 代理绕过）加入 <code class="mono">*.${esc(d.suffix)}</code>。</p>` : ""}
    ${hosts ? `<details><summary>全部 ${Object.keys(d.routes || {}).length} 条路由</summary><div class="table-scroll"><table>${hosts}</table></div></details>` : `<p class="note">暂无登记公开入口的服务。</p>`}
    </section>`;
}

function viewNewProject() {
  const w = wiz;

  const draftsTop = draftCards();

        </select>
        <span class="inline-note">当前默认：${esc(agentsData?.default || "codex")}</span></div>
      <div class="acts" style="justify-content:flex-start">
        ${w.project
          ? `<button class="primary" onclick="wizAnalyzePresetDirs()" ${busy("wiz-create") ? "disabled" : ""}>识别所选目录</button>
             <button onclick="wizStartManual()">手动添加服务</button>
             <span class="inline-note">已选用项目 ${esc(w.project.id)}（${(w.presetDirs || []).filter(d => d.sel).length}/${(w.presetDirs || []).length} 目录）</span>`
          : `<button class="primary" onclick="wizCreateProject()" ${busy("wiz-create") ? "disabled" : ""}>${busy("wiz-create") ? "创建中…" : "创建项目"}</button>
             <button onclick="wizStartManual()">跳过识别，手动添加服务</button>`}
      </div>
      ${(w.presetDirs || []).length ? `<div class="card-head"><h3 style="font-size:14px">项目目录（多选 = 联合识别，逐目录分析后合并候选）</h3></div>
        ${(w.presetDirs || []).map((d, i) => `<label style="display:flex;align-items:center;gap:6px;margin:2px 0">
          <input type="checkbox" ${d.sel ? "checked" : ""} onchange="wizTogglePresetDir(${i})"> ${esc(d.path)}</label>`).join("")}` : ""}
      ${w.error ? `<div class="msg bad">${esc(w.error)}</div>` : ""}
    </section>`;

  if (w.step === "dir") return draftsTop + dirStep;

  const projNote = `<p class="note">项目 ${esc(w.project?.name || "")}（id ${esc(w.project?.id || "")}，修订 ${w.project?.revision ?? 0}） · 目录 ${esc(w.dir)}</p>`;

  if (w.step === "job") {
    const job = w.job || {};
    const running = ["queued", "running"].includes(job.state);
    let errBox = "";
    if (job.state === "failed") {
      const e = job.error || "";
      const hint = e.startsWith("agent_not_available")
        ? "Agent 不可用：到 Agent 连接页做一次验证调用，或换一个 agent 重试。"
        : e.startsWith("timeout") ? "调用超时（进程组已终止，无残留）：可重试。" : "";
      errBox = `<div class="result-box bad">${esc(e)}${hint ? `<br>${esc(hint)}` : ""}</div>
        <div class="acts" style="justify-content:flex-start">
          <button onclick="wizStartAnalyze()">重试</button>
          <button onclick="wizRetryOther()">换一个 agent 重试</button>
          <button onclick="setView('agents')">去 Agent 连接</button>
          <button onclick="wizStartManual()">改为手动添加服务</button>
        </div>`;
    }
    return draftsTop + dirStep.replace('1 · 目录与项目', '1 · 目录与项目 ✓') + `
      <section class="card"><div class="card-head"><h3>2 · 识别（${esc(w.agent)}，任务 ${esc(w.jobId || "")}）</h3></div>
      ${projNote}
      <p class="note">${running ? "进行中…（只读分析，默认最长 240 秒；本页每 2 秒轮询）" : job.state === "done" ? "完成" : "未完成"}</p>
      ${errBox}${(w.unresolved || []).length ? `<p class="reason warn">未解决项：${(w.unresolved || []).map(esc).join("；")}</p>` : ""}
      </section>`;
  }

  // step === review（进入时预取每候选与已登记服务的差异预览，dry_run 不落盘；R08 复用资源懒加载）
  if (!w._diffFetched && w.project) { w._diffFetched = true; w.candidates.forEach((_, i) => wizPrefetchDiff(i)); }
  if (!w._resFetched && w.project) { w._resFetched = true; wizLoadResources(); }
  const candCards = w.candidates.map((c, i) => {
    const r = w.results[i];
    const d = w.diffs[i];
    const editedNow = candidateEditedPaths(c);   // R06：本次审核中用户改过的字段（优先于旧覆盖）
    const advKeys = c.components?.flatMap(k => COMP_FWD_KEYS.filter(f => k[f] !== null && k[f] !== undefined && !(Array.isArray(k[f]) && !k[f].length))) || [];
    const diffBox = d && (d.action === "diff" || d.action === "duplicate")
      ? (d.diff?.length
          ? `<details class="diffbox"><summary>与已登记服务 ${esc(d.service_id)} 匹配：${d.diff.length} 项差异（你的修改优先生效；你的覆盖优先生效，但本次编辑优先）</summary>
             <table>${d.diff.map(x => {
               const isEdited = editedNow.includes(x.field);
               const isOvr = !!(d.overrideFields && d.overrideFields.includes(x.field));
               const cell = isOvr && !isEdited
                 ? `<button onclick="wizAcceptNew(${i}, '${esc(x.field)}')">采用新值</button>`

             }).join("")}</table>
             ${d.overrideFields?.length ? `<p class="inline-note">你的覆盖优先生效，但本次编辑优先：仅未编辑且命中覆盖的字段可用「采用新值」（注册时随 accept_new 清除该覆盖）</p>` : ""}</details>`
          : `<p class="inline-note">与已登记服务 ${esc(d.service_id)} 内容一致（将返回 unchanged/duplicate，不产生重复登记）</p>`)
      : "";
    const res = r
      ? (r.code === 200
          ? `<div class="result-box ok">已注册（${esc(r.res.action)}，服务 ${esc(r.res.service_id)}）${(r.res.validation?.warnings || []).length ? `<div class="warnlist">警告：${r.res.validation.warnings.map(esc).join("；")}</div>` : ""}
             <button class="primary" onclick="wizStartService('${esc(r.res.service_id)}')" ${busy("wiz-start-" + r.res.service_id) ? "disabled" : ""}>${busy("wiz-start-" + r.res.service_id) ? "启动中…" : "启动并打开"}</button></div>`
          : `<div class="result-box bad">注册失败：${esc(r.res?.error || r.code)}${(r.res?.details || []).length ? `<div class="warnlist">${r.res.details.map(esc).join("；")}</div>` : ""}
             ${r.code === 409 ? "<br>版本冲突：已刷新修订号，可重试注册。" : ""}<button onclick="wizRegister()">重试注册</button></div>`)
      : "";
    const provisionWarn = isComposeCand(c) && effectiveProvision(c) === "up" && !c._confirmed_provision
      ? `<p class="reason warn">provision=up：需勾选「允许创建容器/拉镜像——由我确认」后才能注册（未确认时后台同样拒绝，注册前请确认）。</p>` : "";

      </div>
      <div class="field"><label>服务 id</label><input value="${esc(c.id)}" oninput="wizCandField(${i},'id',this.value)"></div>
      <div class="field"><label>名称</label><input value="${esc(c.name)}" oninput="wizCandField(${i},'name',this.value)"></div>
      <div class="field"><label>入口 URL</label><input value="${esc(c.open || "")}" placeholder="http://127.0.0.1:<端口>/" oninput="wizCandField(${i},'open',this.value)"></div>
      ${(c.components || []).map((k, ci) => compIsCompose(k, c) ? `<div class="comp-edit">
        <div class="field"><label>组件 ${esc(k.id)}（compose）</label>

        <div class="field"><label>provision</label>

          <input style="min-width:80px;max-width:110px" placeholder="端口" value="${k.port ?? ""}" oninput="wizCompField(${i},${ci},'port',this.value)">

      </div>` : `<div class="comp-edit">
        <div class="field"><label>组件 ${esc(k.id)}</label>
          <input placeholder="命令（空格分隔 argv）" value="${esc((k.cmd || []).join(" "))}" oninput="wizCompField(${i},${ci},'cmd',this.value)">
          <input style="min-width:80px;max-width:110px" placeholder="端口" value="${k.port ?? ""}" oninput="wizCompField(${i},${ci},'port',this.value)">
          <input placeholder="探针 URL" value="${esc(k.ready?.http || "")}" oninput="wizCompField(${i},${ci},'ready',this.value)"></div>
      </div>`).join("")}
      ${isComposeCand(c) ? `<div class="field"><label>创建/拉取确认</label>
        <label class="radio"><input type="checkbox" ${c._confirmed_provision ? "checked" : ""} onchange="wizConfirmProvision(${i}, this.checked)"> 允许创建容器/拉镜像——由我确认</label>
        <span class="inline-note">provision=up 时必勾，否则后台拒绝注册</span></div>` : ""}
      ${provisionWarn}
      ${c.dependencies?.length ? `<p class="inline-note">依赖 ${c.dependencies.length} 项（${c.dependencies.map(d => esc(d.name)).join("、")}）将随注册保留</p>` : ""}
      ${(c.dependencies || []).map((d, di) => `<div class="field"><label>依赖 ${esc(d.name)} 复用选择</label>
        <select onchange="wizBindDependency(${i},${di},this.value)" aria-label="复用已有容器">
          <option value="" ${!d._bind ? "selected" : ""}>不绑定（保持识别值）</option>

        </select>
        <span class="inline-note">选择已有容器即自动带出 container/卷，无需手填</span></div>

      ${editedNow.length ? `<p class="inline-note">本次编辑（优先于旧覆盖）：${editedNow.map(esc).join("、")}</p>` : ""}
      ${diffBox}

  const manualForm = w.manual ? `
    <section class="card"><div class="card-head"><h3>手动添加服务</h3></div>

      <div class="acts"><button class="primary" onclick="wizRegister()" ${w.registering || busy("wiz-reg") ? "disabled" : ""}>${w.registering || busy("wiz-reg") ? "注册中…" : "注册所选"}</button></div></div>

// ------------------------------------------------------------ 动作：服务操作

async function act(id, action, body) {
  const g = snap?.projects.find(p => p.id === id)?.group;
  if (busy(id) || (g && busy("g-" + g))) return;
  msgs[id] = "";
  pending[id] = action;
  render();
  try {
    const [code, res] = await api("POST", `/api/projects/${id}/${action}`, body);
    msgs[id] = res?.message || res?.error || "";
    if (code !== 200 && res?.error) msgs[id] = res.error;
  } catch (e) { msgs[id] = "无法连接控制服务"; setConn(false); }
  pending[id] = null;
  await refresh();
}

async function groupAct(gid, action) {
  const members = (snap?.projects || []).filter(p => p.group === gid);
  if (members.some(p => busy(p.id) || p.op) || busy("g-" + gid)) return;
  members.forEach(p => delete msgs[p.id]);
  msgs["g-" + gid] = "";
  pending["g-" + gid] = action;
  render();
  try {
    const [, res] = await api("POST", `/api/groups/${gid}/${action}`);
    msgs["g-" + gid] = res?.message || res?.error || "";
  } catch (e) { msgs["g-" + gid] = "无法连接控制服务"; setConn(false); }
  pending["g-" + gid] = null;
  await refresh();
}

async function loadLogs(id) {
  try {
    const [, res] = await api("GET", `/api/projects/${id}/logs?lines=200`);
    logs[id] = Object.entries(res.logs || {}).map(([c, txt]) => `===== ${c}\n${txt || "(无日志)"}`).join("\n\n");
    open[id] = true;
  } catch (e) { logs[id] = "无法连接控制服务"; setConn(false); }
  render();
  requestAnimationFrame(() => document.getElementById(`logs-${id}`)?.scrollIntoView({block: "nearest"}));
}

function askRemove(id) { askRemoveService(id); }  // 兼容旧入口名；实际逻辑见 V2.11 菜单与模态区

async function doRemove(id, disposition) {
  pending["rm-" + id] = true;
  try {
    const [code, res] = await api("DELETE", `/api/services/${id}?disposition=${disposition}`);
    if (code === 200 && res && res.ok) {
      msgs[id] = `已移除登记（处置 ${res.disposition || disposition}；文件与数据未动。恢复：lsctl restore ${id}）`;
    } else {
      msgs[id] = (res && res.error) || `移除失败（HTTP ${code}，登记未变）`;
    }
    return {code, res};
  } catch (e) { msgs[id] = "无法连接控制服务"; setConn(false); return {code: 0, res: {error: "无法连接控制服务"}}; }
  finally { pending["rm-" + id] = null; await refresh(); }
}
