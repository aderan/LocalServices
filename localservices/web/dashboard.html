function viewAttention() {
  if (!snap) return connOk === false
      ? `<div class="empty">${tr("控制层不可用，服务状态未知——不代表项目已停止。", "The control service is unavailable. Service status is unknown.")}</div>`
      : `<div class="empty">${tr("加载中…", "Loading…")}</div>`;
  const sys = (snap.system_warnings || []).map(w =>
    `<div class="card"><div class="card-head"><h3>${tr("系统警告", "System warnings")}</h3></div><p class="reason warn" style="margin:0 0 6px">${esc(w)}</p></div>`).join("");
  const rows = attentionServices().filter(matchesSearch).map(p => serviceRow(p, true)).join("");
  const grouped = new Map();
  for (const service of attentionServices().filter(matchesSearch)) {
    const error = service.error;
    if (!error?.docker_environment || service.intent !== "running" || service.op) continue;
    const target = error.docker_target || {context: error.docker_environment, endpoint: ""};
    const key = target.endpoint || target.context;
    if (!grouped.has(key)) grouped.set(key, {target, profile: error.docker_profile, names: []});
    grouped.get(key).names.push(service.name);
  }
  const environments = Array.from(grouped.values(), ({target, profile, names}) => `<section class="card">
    <div class="card-head"><h3>${esc(dockerEnvironmentName({...target, profile}))}</h3>
      <button data-context="${esc(target.context)}" data-endpoint="${esc(target.endpoint)}" onclick="showDockerEnvironment(this.dataset)">
        ${tr("查看运行环境", "View environment")}</button></div>
    <p class="reason warn">${tr("等待 Docker", "Waiting for Docker")} · ${esc(names.join("、"))}</p>
    ${profile ? dockerRecoveryAction(target, {retry: true}) : ""}</section>`).join("");
  return sys + environments + (rows || `<div class="empty">${tr("没有需要处理的服务。", "No services need attention.")}</div>`);
}

const AGENT_STATUS = {
  not_installed: ["未安装", "Not installed"], config_only: ["已安装，未登录", "Installed, not verified"],
  not_executable: ["存在但不可执行", "Cannot run executable"], needs_login: ["需要登录", "Sign-in required"],
  call_failed: ["调用失败", "Connection test failed"], available: ["可用（已验证）", "Verified"]};

function viewAgents() {
  if (!agentsData) return `<div class="empty">${tr("加载中…", "Loading…")}</div>`;
  const conns = agentsData.connections || {};
  const cards = ["codex", "claude"].map(kind => {
    const c = conns[kind];
    if (!c) return `<section class="card"><div class="card-head"><h3>${kind}</h3></div><p class="note">${tr("未扫描到", "Not detected")}</p></section>`;
    const verifying = busy("verify-" + kind);
    const details = !c.detail ? "" : language === "en"
      ? `<details><summary>Connection diagnostics</summary><pre>${esc(c.detail)}</pre></details>`
      : esc(c.detail);
    return `<section class="card">
      <div class="card-head"><h3>${kind}${c.is_default ? `<span class="badge mut">${tr("默认", "Default")}</span>` : ""}</h3>
        <div class="acts">
          <button onclick="agentsVerify('${kind}')" ${verifying ? "disabled" : ""}>${verifying ? tr("验证中…（最长 120 秒）", "Testing… (up to 120 seconds)") : tr("最小调用验证", "Test connection")}</button>
          <button onclick="agentsScan()" ${busy("scan") ? "disabled" : ""}>${tr("重新扫描", "Scan again")}</button>
          <button onclick="agentsDefault('${kind}')" ${c.is_default || busy("default-" + kind) ? "disabled" : ""}>${c.is_default ? tr("已是默认", "Current default") : tr("设为默认", "Set as default")}</button>
        </div></div>
      <table>
        <tr><td class="k">${tr("状态", "Status")}</td><td class="${c.status === "available" ? "" : c.status === "not_installed" ? "muted" : ""}" style="font-weight:600">${esc(tr(...(AGENT_STATUS[c.status] || [c.status, c.status])))}${c.status === "available" && c.verified_at ? tr(`（${t(c.verified_at)} 验证）`, ` · Verified ${t(c.verified_at)}`) : ""}</td></tr>
        <tr><td class="k">${tr("路径", "Executable")}</td><td>${esc(c.path || "—")}</td></tr>
        <tr><td class="k">${tr("版本", "Version")}</td><td>${esc(c.version || "—")}</td></tr>
        <tr><td class="k">${tr("配置根", "Configuration directory")}</td><td>${esc(c.config_root || "—")}</td></tr>
        ${details ? `<tr><td class="k">${tr("说明", "Details")}</td><td>${details}</td></tr>` : ""}
      </table></section>`;
  }).join("");
  const manual = busy("scan");
  return cards + candidatesCard() + `<section class="card">
    <div class="card-head"><h3>${tr("手动指定路径", "Find an agent by path")}</h3></div>
    <div class="field"><input id="agentPathInput" placeholder="${tr("/path/to/codex 或包含它的目录", "/path/to/codex or its directory")}" aria-label="${tr("手动 agent 路径", "Agent executable or directory")}">
      <button onclick="agentsScan(document.getElementById('agentPathInput').value)" ${manual ? "disabled" : ""}>${manual ? tr("扫描中…", "Scanning…") : tr("按此路径扫描", "Scan this path")}</button>
      <span class="inline-note">${tr("验证为真实最小调用，最长 120 秒；超时请重试", "A connection test can take up to 120 seconds. Try again if it times out.")}</span></div>
  </section>`;
}

// 已知工具能以受支持方式提供的项目候选（或明确不支持）；导入只建项目，不注册服务、不启动
function candidatesCard() {
  const c = agentCandidates?.candidates || {};
  let html = `<section class="card"><div class="card-head"><h3>${tr("已知工具的项目候选", "Project directories found by agents")}</h3></div>`;
  for (const kind of ["claude", "codex"]) {
    const e = c[kind];
    if (!e) { html += `<p class="note">${kind} · ${tr("未知", "Not checked")}</p>`; continue; }
    if (!e.supported) {
      const explanation = kind === "codex"
        ? "Use Add service to choose a Codex project directory."
        : "No project directories could be read from the local Claude configuration.";
      html += `<p class="note">${kind} · ${esc(tr(e.reason || "不支持", explanation))}</p>`;
      continue;
    }
    const registered = new Set((registry?.registry?.projects || []).flatMap(p => (p.directories || []).map(d => d.path)));
    const list = (e.candidates || []).map(p => ({p, known: registered.has(p)}));
    const fresh = list.filter(x => !x.known);
    html += `<p class="note">${kind} · ${tr(`${fresh.length} 个未登记目录（已登记 ${list.length - fresh.length} 个已去重隐藏）`,
      `New directories: ${fresh.length} · Already registered: ${list.length - fresh.length}`)}</p>`;
    html += `<div class="table-scroll"><table>` + fresh.slice(0, 12).map(x =>
      `<tr><td>${esc(x.p)}</td><td><button onclick="importCandidate('${esc(x.p).replace(/'/g, "&#39;")}')">${tr("导入为项目", "Import as project")}</button></td></tr>`).join("") + `</table></div>`;
  }
  html += `<p class="inline-note">${tr("导入只创建项目并关联目录，不注册服务、不启动任何进程。", "Importing creates a project and links its directory. Add services separately when you’re ready.")}</p></section>`;
  return html;
}

async function loadCandidates() {
  try { const [c, d] = await api("GET", "/api/agents/candidates"); if (c === 200) agentCandidates = d; } catch (e) { /* 辅助信息，失败不阻塞 */ }
}

async function importCandidate(path) {
  const name = path.split("/").filter(Boolean).pop() || path;
  try {
    const [code, res] = await api("POST", "/api/projects", {name, directories: [{path}]});
    if (code !== 200) { alert(res?.error || tr("导入失败", "Could not import the project")); return; }
    await refresh();
    setView("project:" + (res.project?.id || res.id || ""));
  } catch (e) { setConn(false); }
}

function canManageDocker(e) {
  return e.contexts?.length && (e.profile || e.provider === "orbstack");
}

function projectDockerTest(project, members) {
  const ids = new Set(members.map(p => p.id));
  const projectUses = e => Boolean(e.services?.some(s => ids.has(s.id)));
  const targets = (resourcesData?.environments || []).filter(canManageDocker)
    .sort((a, b) => Number(projectUses(b)) - Number(projectUses(a)));
  const rows = targets.map(e => {
    const bound = projectUses(e);
    const stopping = dockerStopping.has(e.endpoint) || e.test_state === "stopping";
    const busy = stopping || dockerStarting.has(e.endpoint);
    const error = dockerStopErrors.get(e.endpoint);
    return `<div class="docker-test-row"><strong>${esc(dockerEnvironmentName(e))}
      <span class="note">${bound ? tr("本项目使用", "Used by this project") : tr("其他本机环境", "Other local environment")}</span></strong>
      <span class="note">${esc(dockerEnvironmentState(e))}</span>
      ${e.state === "ready" || stopping ? `<button class="ghost danger" data-project="${esc(project.id)}" data-endpoint="${esc(e.endpoint)}"
        onclick="confirmDockerTestStop(this.dataset)" ${busy ? "disabled" : ""}>${stopping ? tr("正在停止…", "Stopping…") : tr("停止环境", "Stop environment")}</button>`
        : dockerRecoveryAction(e)}
      ${error ? `<p class="reason warn docker-recovery-error" role="status">${esc(error)}</p>` : ""}</div>`;
  }).join("");
  return `<details class="card docker-test-panel" data-project="${esc(project.id)}" ${openDockerTests.has(project.id) ? "open" : ""}
      ontoggle="toggleDockerTests(this)">
    <summary>${tr("开发测试", "Development testing")}</summary>
    <p class="note">${tr("暂停本机 Docker 环境，测试服务恢复。此操作会影响共用该环境的项目。", "Stop a local Docker environment to test service recovery. This affects projects that share it.")}</p>
    ${rows || `<p class="note">${resourcesLoading || !resourcesData ? tr("正在读取环境…", "Loading environments…")
      : tr("暂无可测试的 Colima 或 OrbStack 环境", "No Colima or OrbStack environment available for testing")}</p>`}
  </details>`;
}

function toggleDockerTests(panel) {
  if (panel.open) {
    if (openDockerTests.has(panel.dataset.project)) return;
    openDockerTests.add(panel.dataset.project);
    loadResources();
  } else {
    openDockerTests.delete(panel.dataset.project);
  }
}

async function confirmDockerTestStop({project, endpoint}) {
  const environment = resourcesData?.environments?.find(e => e.endpoint === endpoint);
  if (!environment || !canManageDocker(environment) || environment.state !== "ready" || dockerStopping.has(endpoint)) return;
  const name = dockerEnvironmentName(environment);
  const services = (environment.services || []).map(s => esc(s.name));
  const running = (environment.containers || []).filter(c => c.state === "running").map(c => esc(c.name));
  const ok = await showModal({
    title: tr(`停止 ${name} 进行测试`, `Stop ${name} for testing`),
    okText: tr("停止环境", "Stop environment"),
    cancelText: tr("取消", "Cancel"),
    danger: true,
    bodyHtml: `<p>${tr("停止整个运行环境会中断其中的所有容器及使用它的服务。", "Stopping the environment interrupts all containers and services that use it.")}</p>
      ${environment.provider === "orbstack" ? `<p>${tr("OrbStack 中运行的 Linux 虚拟机也会停止。", "Any Linux machines running in OrbStack will also stop.")}</p>` : ""}
      ${services.length ? `<p>${tr("已绑定服务", "Bound services")} · ${services.join("、")}</p>` : ""}
      ${running.length ? `<p>${tr("运行中容器", "Running containers")} · ${running.slice(0, 8).join("、")}
        ${running.length > 8 ? ` +${running.length - 8}` : ""}</p>` : ""}
      <p class="note">${tr("手动启动环境即可结束测试。", "Start the environment manually to end the test.")}</p>`,
  });
  if (!ok || dockerStopping.has(endpoint)) return;
  dockerStopping.add(endpoint);
  dockerStopErrors.delete(endpoint);
  render();
  try {
    const [code, result] = await api("POST", `/api/projects/${encodeURIComponent(project)}/docker-test/stop`,
      {context: environment.context, endpoint});
    if (code !== 200) dockerStopErrors.set(endpoint, result?.error || tr("停止环境失败", "Could not stop environment"));
  } catch {
    dockerStopErrors.set(endpoint, tr("无法连接控制服务", "Could not reach Locove"));
  } finally {
    dockerStopping.delete(endpoint);
    await loadResources();
    await refresh();
    render();
  }
}

function dockerEnvironmentName(e) {
  if (e.profile) return "Colima " + e.profile;
  if (e.provider === "docker-desktop") return "Docker Desktop";
  if (e.provider === "podman") return "Podman";
  if (e.provider === "orbstack") return "OrbStack";
  return e.context;
}

function dockerEnvironmentState(e) {
  if (dockerStopping.has(e.endpoint) || e.test_state === "stopping") return tr("停止中", "Stopping");
  if (dockerStarting.has(e.endpoint)) return tr("启动中", "Starting");
  if (e.test_state === "stopped" && e.state !== "ready") return tr("测试已停止", "Stopped for testing");
  switch (e.state) {
    case "ready": return tr("Docker 可用", "Docker ready");
    case "stopped": return tr("已停止", "Stopped");
    case "unreachable": return tr("Docker 不可达", "Docker unavailable");
    case "remote": return tr("远程连接", "Remote connection");
    default: return tr("无法验证", "Unverified");
  }
}

function dockerResourcesVisible() {
  if (view === "resources" || (view.startsWith("project:") && openDockerTests.has(view.slice(8)))) return true;
  if (view !== "all" && view !== "attention" && !view.startsWith("project:")) return false;
  return snap?.projects?.some(p => open[p.id] && p.docker_context);
}

function showDockerEnvironment({context, endpoint}) {
  focusedDocker = {context, endpoint};
  document.getElementById("globalSearch").value = "";
  setView("resources");
  scrollToDockerEnvironment();
}

function scrollToDockerEnvironment() {
  if (view !== "resources" || !focusedDocker) return;
  const target = Array.from(document.querySelectorAll("[data-docker-context]"))
    .find(row => focusedDocker.endpoint ? row.dataset.endpoint === focusedDocker.endpoint
      : row.dataset.dockerContext.split(" ").includes(focusedDocker.context));
  if (target) {
    target.scrollIntoView({block: "nearest"});
    focusedDocker = null;
  }
}

function viewResources() {
  if (!resourcesData) return `<div class="empty">${tr("加载中…", "Loading…")}</div>`;
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  const environments = [...(resourcesData.environments || [])].sort((a, b) =>
    Number(Boolean(b.services?.length)) - Number(Boolean(a.services?.length)));
  const active = [], other = [];
  for (const e of environments) {
    const title = dockerEnvironmentName(e);
    const aliases = [...new Set([e.context, ...(e.contexts || [])])];
    const services = (e.services || []).map(s => `<li>${esc(s.name)} · ${esc(s.binding_changed
      ? tr("绑定已变化", "Binding changed")
      : stateLabel(s) || tr("状态未知", "Unknown state"))}</li>`).join("");
    const allContainers = e.containers || [];
    const matchEnvironment = [title, ...aliases, ...(e.services || []).map(s => s.name)]
      .some(value => value.toLowerCase().includes(q));
    const rows = allContainers.filter(r => matchEnvironment || [r.name, r.image || ""]
      .some(value => value.toLowerCase().includes(q))).map(r => {
        const ports = Object.entries(r.ports || {}).map(([k, v]) =>
          esc(k) + " → " + v.map(b => b.host_port).join("/")).join("<br>") || "—";
        const compose = [r.compose_project, r.compose_service].filter(Boolean).join(" / ");
        const consumers = (r.consumers || []).map(s => esc(s.name) + " · " + esc(stateLabel(s) || s.state)
          + " · " + (s.via === "compose" ? "Compose" : tr("依赖", "Dependency")));
        const shared = new Set((r.consumers || []).map(s => s.project)).size > 1;
        const binds = (r.bind_mounts || []).map(b => esc(b.source) + " → " + esc(b.target));
        const state = r.state === "exited" ? tr("已停止", "Stopped") : r.state;
        return `<tr><td>${esc(r.name)}<div class="note">${esc(r.image || "")}</div></td>
          <td>${esc(state)} · ${esc(r.health || "—")}</td>
          <td>${esc(compose || "—")}</td><td>${ports}</td>
          <td>${[...(r.volumes || []).map(esc), ...binds].join("<br>") || "—"}</td>
          <td>${consumers.join("<br>") || "—"}${shared ? `<p class="note">${tr("跨项目共享", "Shared across projects")}</p>` : ""}</td></tr>`;
      }).join("");
    if (!matchEnvironment && !rows) continue;
    const error = e.error;
    const blocked = (e.services || []).some(s => s.docker_blocked);
    const canStart = canManageDocker(e) && (e.state !== "ready" || blocked);
    const actionError = dockerErrors.get(e.endpoint);
    const diagnosisTarget = {endpoint: e.endpoint, action_error: actionError};
    const card = `<section class="card" data-docker-context="${esc(aliases.join(" "))}" data-endpoint="${esc(e.endpoint || "")}">
      <div class="card-head"><h3>${esc(title)}</h3><div class="runtime-card-actions">
        <span class="badge ${e.state === "ready" && !dockerStopping.has(e.endpoint) ? "ok" : "mut"}">${esc(dockerEnvironmentState(e))}</span>
        ${canStart ? dockerRecoveryAction(e, {retry: blocked, showError: false}) : ""}</div></div>
      <p class="note">${tr("Docker 连接", "Docker connections")} · ${esc(aliases.join(", "))}</p>
      ${services ? `<p>${tr("已绑定服务", "Bound services")}</p><ul>${services}</ul>` : ""}
      ${actionError ? `<p class="reason warn docker-recovery-error" role="status">${esc(actionError)}</p>` : ""}
      ${blocked && !canManageDocker(e) ? `<p class="note">${tr("请在对应的工具中启动该环境，Locove 会重新检查。", "Start the environment in its own tool. Locove will check again.")}</p>` : ""}
      ${error ? `<details><summary>${tr("连接诊断", "Connection diagnostics")}</summary>
        <p class="reason warn docker-recovery-error">${esc(error)}</p></details>` : ""}
      ${e.endpoint && (actionError || error || blocked) ? `<div class="acts">${diagnosisAction(diagnosisTarget, dockerStarting.has(e.endpoint))}</div>
        ${diagnosisResult(diagnoses.get(diagnosisKey(diagnosisTarget)))}` : ""}
      ${rows ? `<details><summary>${tr("容器", "Containers")} · ${allContainers.length}</summary><div class="table-scroll"><table>
        <tr><td class="k">${tr("名称", "Name")}</td><td class="k">${tr("状态", "Status")}</td>
          <td class="k">Compose</td><td class="k">${tr("端口", "Ports")}</td><td class="k">${tr("数据卷与挂载", "Volumes and mounts")}</td>
          <td class="k">${tr("引用服务", "Used by")}</td></tr>
        ${rows}</table></div></details>` : `<p class="note">${e.state === "ready" && !e.error
          ? tr("无容器", "No containers") : tr("容器状态无法验证", "Container status unavailable")}</p>`}
    </section>`;
    const important = e.services?.length || e.state === "ready";
    (important ? active : other).push(card);
  }
  const expandOther = q || otherDockerOpen || focusedDocker;
  return `${resourcesData.error ? `<p class="reason warn">${esc(resourcesData.error)}</p>` : ""}
    ${active.join("")}
    ${other.length ? `<details class="docker-other" ${expandOther ? "open" : ""}
      ontoggle="otherDockerOpen = this.open"><summary>${tr("其他 Docker 连接", "Other Docker connections")} · ${other.length}</summary>
      ${other.join("")}</details>` : ""}
    ${active.length || other.length ? "" : `<div class="empty">${tr("没有匹配的运行环境", "No matching environments")}</div>`}`;
}

function serviceDiagnosisTarget(service) {
  const endpoint = service.error?.docker_target?.endpoint;
  return endpoint ? {endpoint, action_error: dockerErrors.get(endpoint)} : {service: service.id};
}

function diagnosisKey(target) {
  return target.endpoint ? "environment:" + target.endpoint : "service:" + target.service;
}

function diagnosisAction(target, disabled) {
  const key = diagnosisKey(target);
  const job = diagnoses.get(key);
  const working = diagnosisPending.has(key) || ["queued", "running"].includes(job?.state);
  const agent = job?.agent;
  const choices = agent ? `<select aria-label="${tr("诊断 Agent", "Diagnostic agent")}">
    <option value="">${tr("默认 Agent", "Default agent")}</option>
    <option value="codex" ${agent === "codex" ? "selected" : ""}>Codex</option>
    <option value="claude" ${agent === "claude" ? "selected" : ""}>Claude</option>
  </select>` : "";
  return `<span class="docker-recovery agent-diagnosis-actions">${choices}<button data-act="diagnose" data-target="${esc(JSON.stringify(target))}"
      onclick="startDiagnosis(this)" ${disabled || working ? "disabled" : ""}>
      ${working ? tr("Agent 正在诊断…", "Agent is diagnosing…") : job ? tr("重新诊断", "Diagnose again") : tr("用 Agent 诊断", "Diagnose with an agent")}
    </button></span>`;
}

function diagnosisResult(job) {
  if (!job || !["done", "failed"].includes(job.state)) return "";
  if (job.state === "failed") return `<p role="status">${esc(job.error || tr("诊断失败", "Diagnosis failed"))}
    <button class="link" onclick="setView('agents')">${tr("验证 Agent 连接", "Test agent connection")}</button></p>`;
  return `<div class="agent-diagnosis-result" role="status"><h4>${tr("Agent 诊断", "Agent diagnosis")}</h4><p>${esc(job.result.summary)}</p>
    ${job.result.steps.length ? `<ol>${job.result.steps.map(step => `<li>${esc(step)}</li>`).join("")}</ol>` : ""}</div>`;
}

async function loadDiagnoses() {
  try {
    const [code, data] = await api("GET", "/api/diagnoses");
    if (code !== 200) return;
    for (const job of data.jobs || []) {
      const key = diagnosisKey(job.target);
      if (diagnosisPending.has(key)) continue;
      const previous = diagnoses.get(key);
      if (previous?.id === job.id || previous?.created_at > job.created_at) continue;
      diagnoses.set(key, job);
      if (["queued", "running"].includes(job.state)) pollDiagnosis(key, job.id);
    }
    render();
  } catch { /* Diagnostic history is optional for rendering the workbench. */ }
}

async function startDiagnosis(button) {
  const target = JSON.parse(button.dataset.target);
  const agent = button.parentElement.querySelector("select")?.value || undefined;
  const key = diagnosisKey(target);
  if (diagnosisPending.has(key)) return;
  diagnosisPending.add(key);
  render();
  try {
    const [code, data] = await api("POST", "/api/diagnoses", {...target, agent, language});
    if (code !== 202) throw new Error(data?.error || tr("无法发起诊断", "Could not start diagnosis"));
    diagnoses.set(key, {id: data.job_id, target, state: "queued", created_at: Date.now() / 1000});
    pollDiagnosis(key, data.job_id);
  } catch (error) {
    diagnoses.set(key, {target, state: "failed", error: error.message});
  } finally {
    diagnosisPending.delete(key);
    render();
  }
}

async function pollDiagnosis(key, id) {
  if (diagnoses.get(key)?.id !== id) return;
  try {
    const [code, job] = await api("GET", `/api/jobs/${id}`);
    if (diagnoses.get(key)?.id !== id) return;
    if (code !== 200) throw new Error(job?.error || tr("无法读取诊断", "Could not load diagnosis"));
    diagnoses.set(key, job);
    if (["queued", "running"].includes(job.state)) {
      setTimeout(() => pollDiagnosis(key, id), 1200);
      return;
    }
  } catch (error) {
    if (diagnoses.get(key)?.id !== id) return;
    diagnoses.set(key, {...diagnoses.get(key), state: "failed", error: error.message});
  }
  render();
}

function dockerRecoveryAction(target, {retry = false, service = "", remember = false, label, showError = true} = {}) {
  const busy = dockerStarting.has(target.endpoint);
  const disabled = busy || dockerStopping.has(target.endpoint) || target.test_state === "stopping";
  const error = showError && dockerErrors.get(target.endpoint);
  label ||= retry ? tr("启动环境并重试", "Start environment and retry") : tr("启动环境", "Start environment");
  return `<span class="docker-recovery">
    <button data-context="${esc(target.context)}" data-endpoint="${esc(target.endpoint)}"
      data-service="${esc(service)}" data-retry="${retry}" onclick="recoverDocker(this)"
      ${disabled ? "disabled" : ""}>${busy ? tr("正在启动环境…", "Starting environment…") : label}</button>
    ${remember ? `<label><input type="checkbox" ${busy ? "disabled" : ""}> ${tr("以后按需自动启动", "Start automatically when needed")}</label>` : ""}
  </span>${error ? `<p class="reason warn docker-recovery-error" role="status">${esc(error)}</p>` : ""}`;
}

async function recoverDocker(button) {
  const {context, endpoint, service, retry} = button.dataset;
  if (dockerStarting.has(endpoint)) return;
  const remember = Boolean(button.closest(".docker-recovery").querySelector("input")?.checked);
  dockerStarting.add(endpoint);
  dockerErrors.delete(endpoint);
  render();
  try {
    const [code, result] = await api("POST", "/api/resources/environments/start",
      {context, endpoint, retry: retry === "true", service_id: service || undefined, remember});
    if (code !== 200) dockerErrors.set(endpoint, result?.error || tr("环境启动失败", "Could not start environment"));
  } catch {
    dockerErrors.set(endpoint, tr("无法连接控制服务", "Could not reach Locove"));
  } finally {
    dockerStarting.delete(endpoint);
    if (dockerResourcesVisible()) await loadResources();
    await refresh();
    render();
  }
}

async function locovePort(v) {
  const port = parseInt(v, 10);
  if (!port || port < 1024 || port > 65535) {
    msgs["locove-settings"] = tr(`端口 ${v} 无效（需 1024–65535）`, `Invalid port ${v}. Enter a number from 1024 to 65535.`); render(); return;
  }
  const [, res] = await api("POST", "/api/locove/settings", {domain_port: port});
  msgs["locove-settings"] = res?.ok
    ? tr(`域名端口已保存：${port}（生效需启用/重启域名模块）`, `Port ${port} saved. Enable or restart domain support to apply it.`)
    : tr("保存失败", "Could not save") + (res?.error ? " · " + res.error : "");
  await refresh(); render();
}

  await showModal({title: tr("卸载域名访问组件", "Uninstall domain support"), okText: tr("卸载", "Uninstall"), danger: true, bodyHtml: `
    <p class="modal-line">${tr("卸载会停止并移除 DNS、代理和路由配置，保留本机域名解析配置。", "Uninstalling stops and removes DNS, the proxy and routing configuration. The local resolver configuration is kept.")}</p>
    <p class="modal-line">${tr("卸载后继续通过本地直连地址访问服务。", "After uninstalling, services remain available through their direct local addresses.")}</p>`,
    onOk: async () => { await locoveOp("uninstall", {keep_resolver: true}); return true; }});

async function locoveOp(op, body = {}) {
  if (busy("locove-op")) return;
  pending["locove-op"] = true; delete msgs["locove-settings"]; render();
  try {
    const [code, res] = await api("POST", `/api/locove/${op}`, body);
    if (code !== 200 || !res?.ok) {
      msgs["locove-settings"] = `${tr("无法更新域名访问。", "Could not update domain access.")} ${res?.error || code}`;
    }
  } catch (e) {
    msgs["locove-settings"] = tr("无法连接控制服务。", "Could not connect to the daemon.");
    setConn(false);
  } finally {
    await refresh();
    pending["locove-op"] = null;
    render();
  }
}

function locoveDiagnosticsCard() {
  const d = locoveData;
  if (!d) return "";
  const row = (ok, name, detail) => `<tr><td class="k">${esc(name)}</td><td>${ok == null ? "" : ok ? "✓ " : "✗ "}${esc(detail)}</td></tr>`;
  const off = d.state === "installed_off";
  const notInstalled = tr("未安装", "Not installed");
  const stopped = tr("已停止", "Stopped");
  const listening = tr("监听中", "Listening");
  const resolverDetail = {
    ours: tr(`已配置将 .${d.suffix} 域名交给本地 DNS。`, `Configured to send .${d.suffix} queries to local DNS.`),
    foreign: tr("配置由其他程序管理，无法启用。", "Another program manages this resolver. Domain access cannot be enabled."),
    unreadable: tr("无法读取解析配置。", "Could not read the resolver configuration."),
    absent: notInstalled,
  };
  const pb = d.proxy_bypass;
  const pbRow = pb && d.state !== "not_installed" ? row(
    pb.enabled == null ? null : pb.ok, tr("浏览器代理绕过", "Browser proxy bypass"),
    pb.enabled == null ? tr("无法读取系统代理设置。", "Could not read system proxy settings.")
      : !pb.enabled ? tr("系统代理未启用。", "System proxy is off.")
      : pb.ok ? tr(`系统代理已绕过 *.${d.suffix}。`, `The system proxy bypasses *.${d.suffix}.`)
      : tr(`代理绕过列表缺少 *.${d.suffix}。`, `*.${d.suffix} is missing from the proxy bypass list.`)) : "";
  const hosts = Object.entries(d.routes || {}).map(([h, r]) =>
    `<tr><td class="k">${esc(h)}</td><td>${r.state === "proxy" ? tr(`转发到 127.0.0.1:${r.upstream_port}`, `Forwards to 127.0.0.1:${r.upstream_port}`) : tr("不可用（503）", "Unavailable (503)")} <span class="note">(${esc(r.service)}.${esc(r.component)})</span></td></tr>`).join("");
  const legacy = d.legacy_80
    ? `<tr><td class="k">${tr("旧 80 入口", "Legacy port 80")}</td><td>${tr("旧版转发器仍在登记中。移除后，更新书签到新的域名端口。", "The legacy forwarder is still registered. After removing it, update bookmarks to use the new domain port.")} <code class="mono">sudo scripts/retire-locove-80.sh --apply</code></td></tr>` : "";
  return `<section class="card"><div class="card-head"><h3>${tr("域名诊断", "Domain diagnostics")}</h3></div>
    <div class="table-scroll"><table>
      ${row(off && d.dns?.ok === false ? null : d.dns?.ok, tr("本地 DNS", "Local DNS"),
        d.dns?.ok == null ? notInstalled : d.dns.ok ? listening : off ? stopped : tr("未监听本机端口。", "Not listening on the local port."))}
      ${row(off && d.proxy?.ok === false ? null : d.proxy?.ok, tr("代理", "Proxy"),
        d.proxy?.ok == null ? notInstalled : d.proxy.ok ? `${listening} · 127.0.0.1:${d.domain_port}`
          : off ? stopped : tr(`Caddy 未监听 127.0.0.1:${d.domain_port}。`, `Caddy is not listening on 127.0.0.1:${d.domain_port}.`))}
      ${row(d.resolver?.ok, tr("域名解析配置", "Local resolver"), resolverDetail[d.resolver_state] || (d.resolver?.ok ? tr("已配置", "Configured") : notInstalled))}
      ${pbRow}${legacy}
    </table></div>
    ${pb?.ok === false && d.state !== "not_installed" ? `<p class="note">${tr(`在代理客户端的绕过列表中添加 *.${esc(d.suffix)}（例如 Clash Verge 的「系统设置 → 代理绕过」）。`, `Add *.${esc(d.suffix)} to the bypass list in your proxy client. In Clash Verge, look under System Settings → Proxy Bypass.`)}</p>
      <p class="note">${tr("也可更新当前系统代理设置", "To update the current system proxy settings")}
        <code class="mono">sudo scripts/locove-proxy-bypass.sh ${esc(d.suffix)}</code></p>` : ""}
    ${hosts ? `<details><summary>${tr(`全部 ${Object.keys(d.routes || {}).length} 条路由`, `Routes: ${Object.keys(d.routes || {}).length}`)}</summary><div class="table-scroll"><table>${hosts}</table></div></details>` : `<p class="note">${tr("暂无登记公开入口的服务。", "No registered domain endpoints.")}</p>`}
    </section>`;
}

async function saveLanguage(value) {
  if (pending.language || value === language) return;
  pending.language = true;
  delete msgs.language;
  render();
  try {
    const [code, res] = await api("POST", "/api/settings/language", {language: value});
    if (code === 200 && res?.ok) {
      languageVersion++;
      applyLanguage(res.language);
      nativeBridge()?.postMessage({action: "languageChanged"});
    } else {
      msgs.language = true;
    }
  } catch (e) {
    msgs.language = true;
  } finally {
    pending.language = false;
    render();
  }
}

    scan_directory: ["扫描目录，收集识别线索", "Scanning the directory for evidence"],
    launch_cli: ["已请求启动 CLI，等待事件", "Starting the CLI and waiting for activity"],
    cli_ready: ["CLI 已就绪，等待模型响应", "CLI is ready and waiting for the model"],
    tool_command: ["Codex 正在检查工程", "Codex is inspecting the project"],
    model_response: ["开始收到模型响应", "Receiving a model response"],
    tool_read: ["Claude 发起文件读取", "Claude requested a file read"],
    tool_glob: ["Claude 发起文件查找", "Claude requested a file search"],
    tool_grep: ["Claude 发起内容搜索", "Claude requested a content search"],
    cli_result: ["收到 CLI 结果", "Received the CLI result"],
    validate_result: ["校验候选服务", "Validating candidate services"],
  };
  const events = (job.activity || []).filter(entry => Object.hasOwn(labels, entry.event));
  const latest = events.at(-1);
  const now = Date.now() / 1000;
  const elapsed = Math.max(0, Math.floor(now - (job.started_at || job.created_at || now)));
  const output = job.output || [];
  const lastEventAt = Math.max(latest?.at || 0, output.at(-1)?.at || 0);
  const quietFor = lastEventAt ? Math.floor(now - lastEventAt) : 0;
  const status = job.state === "queued" ? tr("等待识别任务开始", "Waiting for the analysis job to start")
    : job.state === "failed" ? tr("识别未完成", "Analysis failed")
    : job.state === "done" ? tr("识别完成", "Analysis complete")
    : latest ? tr(...labels[latest.event]) : tr("等待识别进度", "Waiting for analysis progress");
  return `<p class="note" role="status">${esc(status)}</p>
    ${job.state === "running" ? `<p class="note">${tr(`已运行 ${elapsed} 秒 · CLI 超时限制 ${job.timeout || 240} 秒`, `${elapsed}s elapsed · CLI timeout ${job.timeout || 240}s`)}
      ${quietFor >= 10 ? tr(` · 已有 ${quietFor} 秒没有新活动`, ` · No new activity for ${quietFor}s`) : ""}</p>` : ""}
    ${events.length ? `<details id="analysis-activity" ${wiz.activityOpen ? "open" : ""} ontoggle="if (this.isConnected) wiz.activityOpen = this.open">
      <summary>${tr("识别活动", "Analysis activity")}</summary>
      <ul>${events.map(entry => `<li><span class="note">${esc(new Date(entry.at * 1000).toLocaleTimeString(language, {hour12: false}))}</span> ${esc(tr(...labels[entry.event]))}</li>`).join("")}</ul>
    </details>` : ""}
    <details id="analysis-output" ${wiz.outputOpen ? "open" : ""} ontoggle="if (this.isConnected) wiz.outputOpen = this.open">
      <summary>CLI 输出</summary>
      <pre id="analysis-output-lines">${output.length ? output.map(entry =>
        esc(new Date(entry.at * 1000).toLocaleTimeString(language, {hour12: false}) + "  " + entry.text)).join("\n")
        : "尚未收到可展示的 CLI 输出。"}</pre>
    </details>`;
}

function recognitionTaskList() {

    ${recognitionTasks.map(task => {
      const status = task.verifying ? "试启动中" : task.registering || task.manualRegistering ? "登记中" : task.registered ? "已登记"
        : ({queued: "排队中", running: "识别中", done: task.candidates.length ? "待核对" : "无可用候选",
            failed: "识别失败"})[task.job?.state] || (task.step === "job" ? "提交中" : "待选择目录");
      return `<button class="recognition-task" onclick="wizSelectTask(${task.taskId})" aria-pressed="${task === wiz}">

function externalAgentPrompt() {
  const directory = (wiz.dir || "").trim() || "当前项目目录";
  const prompt = `请在 ${directory} 中为洛湾（LocalServices）登记一个可启动的本地服务。
阅读 README 和运行配置，找出主服务的启动命令、工作目录、监听端口、健康探针及打开地址。排除采集、迁移、测试等一次性任务。
先用 lsctl projects --json 检查目录是否已登记，复用项目 ID 和 revision。构造 schemaVersion: 1 的 JSON，包含 project、revision 和 service。service 至少包含 id、name、source（绝对路径）、components。组件命令使用 argv 数组，启动参数、监听端口、探针和打开地址保持一致。
用 lsctl register --stdin --json 提交 JSON，并在顶层设置 verify_start: true。洛湾会试启动，验证通过后自动登记。报告 service_id、验证结果和 trial.log 路径。如果 lsctl 不可用，或试启动失败，请返回候选 JSON 和具体原因。`;
  showModal({title: "外部 Agent 提示词", okText: "复制提示词", bodyHtml: `
    <p class="note">在 WorkBuddy 或其他 Agent 中打开项目目录，再粘贴执行。</p>
    <textarea aria-label="外部 Agent 提示词" readonly rows="12" style="width:100%">${esc(prompt)}</textarea>`,
    onOk: async () => {
      if (navigator.clipboard?.writeText) {
        try { await navigator.clipboard.writeText(prompt); return true; } catch (e) { /* use selection */ }
      }
      const field = document.querySelector('.modal textarea');
      field?.select();
      return document.execCommand("copy") ? true : "keep";
    }});
}

function trialDetails(result) {
  const record = result?.trial;
  if (!record) return "";
  const label = record.state === "passed" ? "试启动通过" : "试启动未通过";
  const checks = (record.checks || []).map(check => `${check.component} · ${check.port}`).join("、");
  return `<p class="note">${label}${checks ? " · " + esc(checks) : ""}
    ${record.skipped?.length ? " · 未执行生成任务 " + esc(record.skipped.join("、")) : ""}
    ${record.log ? `<br>本机验证记录 <code>${esc(record.log)}</code>` : ""}</p>`;
}

          <select oninput="wizCompField(${i},${ci},'provision',this.value)" aria-label="compose provision">
            <option value="existing" ${(k.provision || c.provision) !== "up" ? "selected" : ""}>existing（只启动已有容器）</option>
            <option value="up" ${(k.provision || c.provision) === "up" ? "selected" : ""}>up（允许 compose up 创建/拉取）</option>
          </select></div>
        <div class="field"><label></label>
          <input style="min-width:80px;max-width:110px" placeholder="${tr("端口", "Port")}" value="${k.port ?? ""}" oninput="wizCompField(${i},${ci},'port',this.value)">

        </select>

// ------------------------------------------------------------ 动作：服务操作

async function act(id, action, body) {
  const g = snap?.projects.find(p => p.id === id)?.group;
  if (busy(id) || (g && busy("g-" + g))) return;
  msgs[id] = "";
  pending[id] = action;
  render();
  try {
    const [code, res] = await api("POST", `/api/projects/${id}/${action}`, body);
    const lifecycleStarted = res?.accepted === true && ["start", "stop", "restart"].includes(action);
    const detail = res?.error || res?.message;
    msgs[id] = detail && !lifecycleStarted ? {text: detail, bad: code !== 200 || res?.ok === false} : "";
  } catch (e) {
    msgs[id] = {text: tr("无法连接控制服务", "Daemon unavailable"), bad: true};
    setConn(false);
  }
  pending[id] = null;
  await refresh();
}

async function groupAct(gid, action) {
  const members = (snap?.projects || []).filter(p => p.group === gid);
  if (members.some(p => busy(p.id) || p.op) || busy("g-" + gid)) return;
  members.forEach(p => delete msgs[p.id]);
  msgs["g-" + gid] = "";
  pending["g-" + gid] = action;
  render();
  try {
    const [, res] = await api("POST", `/api/groups/${gid}/${action}`);
    msgs["g-" + gid] = res?.message || res?.error || "";
  } catch (e) { msgs["g-" + gid] = "无法连接控制服务"; setConn(false); }
  pending["g-" + gid] = null;
  await refresh();
}

async function loadLogs(id) {
  try {
    const [, res] = await api("GET", `/api/projects/${id}/logs?lines=200`);
    logs[id] = Object.entries(res.logs || {}).map(([c, txt]) => `===== ${c}\n${txt || tr("(无日志)", "(No logs)")}`).join("\n\n");
    open[id] = true;
  } catch (e) { logs[id] = tr("无法连接控制服务", "Could not connect to the control service"); setConn(false); }
  render();
  requestAnimationFrame(() => document.getElementById(`logs-${id}`)?.scrollIntoView({block: "nearest"}));
}

function askRemove(id) { askRemoveService(id); }  // 兼容旧入口名；实际逻辑见 V2.11 菜单与模态区

async function doRemove(id, disposition) {
  pending["rm-" + id] = true;
  try {
    const [code, res] = await api("DELETE", `/api/services/${id}?disposition=${disposition}`);
    if (code === 200 && res && res.ok) {
      msgs[id] = `已移除登记（处置 ${res.disposition || disposition}；文件与数据未动。恢复：lsctl restore ${id}）`;
    } else {
      msgs[id] = (res && res.error) || `移除失败（HTTP ${code}，登记未变）`;
    }
    return {code, res};
  } catch (e) { msgs[id] = "无法连接控制服务"; setConn(false); return {code: 0, res: {error: "无法连接控制服务"}}; }
  finally { pending["rm-" + id] = null; await refresh(); }
}

      bodyHtml: diagnosisResult(jobs[0]), onOk: () => true}),

function menuItems(key) {
  if (typeof key === "string" && key.startsWith("single:")) {
    const [, project, service] = key.split(":");
    return [...serviceMenuItems(service), {sep: true}, ...projectMenuItems(project)];
  }
  if (typeof key === "string" && key.startsWith("proj:")) return projectMenuItems(key.slice(5));
  if (typeof key === "string" && key.startsWith("svc:")) return serviceMenuItems(key.slice(4));
  return [];
}

function openMenu(anchor, items) {
  closeMenu();
  const backdrop = document.createElement("div");
  backdrop.className = "menu-backdrop";
  const el = document.createElement("div");
  el.className = "menu";
  el.setAttribute("role", "menu");
  el.style.position = "absolute";
  (items || []).forEach(it => {
    if (it.sep) { const s = document.createElement("div"); s.className = "menu-sep"; el.appendChild(s); return; }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "menu-item" + (it.danger ? " danger" : "");
    b.setAttribute("role", "menuitem");
    b.textContent = it.label;
    if (it.disabled) b.disabled = true;
    b.onclick = () => { if (it.disabled) return; closeMenu(); if (it.run) it.run(); };
    el.appendChild(b);
  });
  backdrop.onclick = () => closeMenu();
  document.body.appendChild(backdrop);
  document.body.appendChild(el);
  try {  // 锚点旁定位；无布局信息的无头环境退化为固定左上
    const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
    const x = r ? Math.max(8, Math.min(r.left, (window.innerWidth || 1024) - 190)) : 16;
    const y = r ? r.bottom + 6 : 16;
    el.style.left = x + "px";
    el.style.top = y + "px";
  } catch (e) { el.style.left = "16px"; el.style.top = "16px"; }
  menuState = {backdrop, el, anchor};
  try {
    const btns = el.querySelectorAll("button");
    if (btns && btns[0] && btns[0].focus) btns[0].focus();
  } catch (e) { /* 无头环境无焦点 */ }
}

function closeMenu() {
  if (!menuState) return;
  try { menuState.backdrop.remove(); menuState.el.remove(); } catch (e) { /* 已不在树上 */ }
  menuState = null;
}

function toggleMenu(ev, key) {
  const anchor = ev && ev.target;
  if (menuState && anchor && menuState.anchor === anchor) { closeMenu(); return; }
  openMenu(anchor, menuItems(key));
}

async function editEndpointCompatibility({service, host, component}) {
  const owner = locoveData?.settings?.loopback_endpoints?.[host];
  const enabled = owner?.service === service && owner?.component === component;
  let saving = false;
  await showModal({
    title: tr("入口设置", "Endpoint settings"),
    okText: tr("保存", "Save"),
    bodyHtml: `
      <p class="modal-line"><code>${esc(host)}</code></p>
      <label class="radio"><input type="checkbox" name="loopback" ${enabled ? "checked" : ""}>
        ${tr("兼容仅接受本机地址的应用", "Support apps that only accept loopback addresses")}</label>
      <p class="modal-line muted">${tr(
        "直连可用、域名因 Host 或 Origin 检查返回 403 时，可以开启。Locove 仍会拦截跨站写请求。",
        "Enable this if the direct URL works but the domain returns 403 due to a Host or Origin check. Locove continues to block cross-origin writes.")}</p>
      <p class="reason warn" data-endpoint-error role="alert" hidden></p>`,
    onOk: async body => {
      if (saving) return "keep";
      const mode = body.querySelector('[name="loopback"]').checked ? "loopback" : "auto";
      if ((mode === "loopback") === enabled) return true;
      saving = true;
      try {
        const [code, result] = await api("POST", "/api/locove/endpoint-compatibility",
          {service, host, component, mode});
        if (code !== 200 || !result?.ok) throw new Error(result?.error);
        await refresh();
        return true;
      } catch (e) {
        const error = body.querySelector("[data-endpoint-error]");
        error.textContent = e.message || tr("保存失败", "Could not save the endpoint setting");
        error.hidden = false;
        return "keep";
      } finally {
        saving = false;
      }
    },
  });
}

// showModal：自绘模态（替代 confirm/prompt）。Esc=取消、Enter=主操作（textarea 除外）、
// Tab 焦点陷阱、aria-modal；onOk 返回 "keep" 时留在同一模态（两步流程复用）。
function showModal(opts) {
  closeMenu();
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const dialog = document.createElement("div");
    dialog.className = "modal";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-modal", "true");
    dialog.setAttribute("aria-label", opts.title || "");
    const head = document.createElement("h3");
    head.textContent = opts.title || "";
    const body = document.createElement("div");
    body.className = "modal-body";
    body.innerHTML = opts.bodyHtml || "";
    const foot = document.createElement("div");
    foot.className = "modal-foot";
    const finish = v => {
      document.removeEventListener("keydown", onKey, true);
      try { overlay.remove(); } catch (e) { /* 已移除 */ }
      if (modalState && modalState.overlay === overlay) modalState = null;
      resolve(v);
      render();
    };
    const okBtn = document.createElement("button");
    const handle = {
      setBody(html) { body.innerHTML = html; try { focusFirst(); } catch (e) { /* 无头 */ } },
      setOkText(t) { okBtn.textContent = t; },
      setOkDanger(d) { okBtn.className = d ? "danger" : "primary"; },
    };
    okBtn.type = "button";
    okBtn.className = opts.danger ? "danger" : "primary";
    okBtn.textContent = opts.okText || "确定";
    okBtn.onclick = async () => {
      try {
        const r = opts.onOk ? await opts.onOk(body, handle) : true;
        if (r === "keep") return;
        finish(true);
      } catch (e) { finish(true); }
    };
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.textContent = opts.cancelText || "取消";
    cancelBtn.onclick = () => finish(false);
    if (!opts.noCancel) foot.appendChild(cancelBtn);
    foot.appendChild(okBtn);
    dialog.appendChild(head); dialog.appendChild(body); dialog.appendChild(foot);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    modalState = {overlay, dialog, okBtn, cancelBtn};

    function focusables() {
      try {
        return Array.from(dialog.querySelectorAll("button, input, select, textarea"))
          .filter(x => !x.disabled);
      } catch (e) { return []; }
    }
    function focusFirst() {
      const f = focusables();
      const t = f.find(x => x.tagName === "INPUT" || x.tagName === "TEXTAREA") || f[0];
      if (t && t.focus) t.focus();
    }
    function onKey(e) {
      if (!modalState || modalState.overlay !== overlay) return;
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
      else if (e.key === "Enter") {
        const t = e.target;
        if (t && (t.tagName === "TEXTAREA" || t.tagName === "BUTTON")) return;  // 多行输入/按钮默认行为
        e.preventDefault(); e.stopPropagation(); okBtn.click();
      } else if (e.key === "Tab") {  // 焦点陷阱：Tab 在模态内循环
        const f = focusables();
        if (!f.length) return;
        e.preventDefault();
        const i = f.indexOf(document.activeElement);
        const next = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
        if (f[next] && f[next].focus) f[next].focus();
      }
    }
    document.addEventListener("keydown", onKey, true);
    try { focusFirst(); } catch (e) { /* 无头环境无焦点 */ }
  });
}

// ---------- 移除对话框（先 remove-preview，取消零副作用） ----------

// 观察项移除（V2 §3.1）：观察项没有受管进程，只解除登记，绝不停止其外部引擎；
// 因此不提供处置选择，固定 keep-external 语义。
async function askRemoveObserve(sid, p) {
  const ok = await showModal({title: "移除观察登记…", danger: true, okText: "移除",
    bodyHtml: `
      <p class="modal-line">对象：<b>${esc(p.name)}</b>（${esc(sid)}，观察项）</p>
      <p class="modal-line">只解除本工具的观察登记；被观察的外部引擎/进程照常运行，不受影响。</p>
      <p class="modal-line muted">恢复方式：lsctl restore ${esc(sid)}，或本页「已移除登记」视图恢复。</p>`,
    onOk: async () => { await doRemove(sid, "keep-external"); return true; }});
  return ok;
}

async function askRemoveService(sid) {
  const p = servicesById()[sid];
  if (!p) return;
  if (p.observe_only) return askRemoveObserve(sid, p);
  let prev = null;
  try {  // 预览端点未就绪（501）时静默降级为已知状态展示
    const [code, res] = await api("GET", `/api/services/${sid}/remove-preview`);
    if (code === 200 && res && res.ok) prev = res;
  } catch (e) { /* 网络异常走降级 */ }
  const pjEntry = (registry?.services || []).find(s => s.id === sid);
  const pjName = pjEntry && pjEntry.project ? projectName(pjEntry.project) : "";
  const running = prev && prev.running_components && prev.running_components.length
      ? prev.running_components
      : (p.intent === "running" && p.state !== "external"
         ? (p.components || []).filter(c => c.kind !== "generator").map(c => c.id) : []);
  const ext = (prev && prev.external_instances) || [];
  const keepDisp = prev && prev.dispositions ? prev.dispositions["keep-external"] : null;
  const keepOff = !!(keepDisp && keepDisp.enabled === false);
  __rmDisp = keepOff ? "stop" : "keep-external";
  const bodyHtml = `
    <p class="modal-line">对象：<b>${esc(p.name)}</b>（${esc(sid)}）</p>
    ${pjName ? `<p class="modal-line">受影响项目：${esc(pjName)}</p>` : ""}
    <p class="modal-line">将停止的实例：${running.length ? esc(running.join("、")) : "（无）"}</p>
    ${ext.length ? `<p class="modal-line">外部实例（照常保留运行）：${esc(ext.join("、"))}</p>` : ""}
    <p class="modal-line">保留内容：${prev && prev.keep && prev.keep.length ? esc(prev.keep.join("、")) : "源码目录、数据库、容器与卷（一律不删除）"}</p>
    <p class="modal-line muted">恢复方式：${esc((prev && prev.restore_hint) || `lsctl restore ${sid}，或本页「已移除登记」视图恢复`)}</p>
    ${prev ? "" : `<p class="modal-line muted">（移除预览暂不可用，以上按已知状态展示）</p>`}
    <div class="field"><label>处置方式</label>
      <label class="radio"><input type="radio" name="rmDisp" value="stop" ${__rmDisp === "stop" ? "checked" : ""} onchange="__rmDisp='stop'"> 停止后移除</label>
      <label class="radio"><input type="radio" name="rmDisp" value="keep-external" ${keepOff ? "disabled" : ""} ${__rmDisp === "keep-external" ? "checked" : ""} onchange="__rmDisp='keep-external'"> 保留为外部实例</label>
    </div>
    ${keepOff ? `<p class="reason warn">无法保留为外部实例：${esc(keepDisp.reason || "仍由本工具 launchd 保活，请选择停止后移除")}</p>` : ""}`;
  let outcome = null;
  const ok = await showModal({title: "移除登记…", bodyHtml, okText: "移除", danger: true,
    onOk: async () => { outcome = await doRemove(sid, __rmDisp); return true; }});
  if (ok && outcome && !(outcome.res && outcome.res.ok)) {
    await showModal({title: "移除失败", okText: "关闭", noCancel: true,
      bodyHtml: `<p class="modal-line">${esc(msgs[sid] || "移除失败")}</p>
                 <p class="modal-line muted">登记保持不变，可重试或改用 lsctl service-remove。</p>`});
  }
}

async function askProjectRemove(pid) {
  const g = projectGroups().find(x => x.pj.id === pid);
  const pj = (g && g.pj) || {id: pid, name: pid};
  let prev = null;
  try {  // 预览端点未就绪（501）时降级为本地已知信息
    const [code, res] = await api("GET", `/api/projects/${pid}/remove-preview`);
    if (code === 200 && res && res.ok) prev = res;
  } catch (e) { /* 网络异常走降级 */ }
  const members = prev && prev.services ? prev.services
      : (g ? g.members : []).map(m => ({id: m.id, name: m.name, state: m.state, external_instances: []}));
  let keepOff = false, keepReason = "";
  if (prev) {
    for (const s of prev.services || []) {
      const d = s.dispositions ? s.dispositions["keep-external"] : null;
      if (d && d.enabled === false) { keepOff = true; keepReason = d.reason || `成员 ${s.id} 仍由本工具 launchd 保活`; }
    }
  }
  __rmDisp = keepOff ? "stop" : "keep-external";
  const memberRows = members.map(s =>
    `<tr><td>${esc(s.id)}</td><td>${esc(s.name || "")}</td><td>${esc(s.state || "—")}</td>
     <td>${(s.external_instances || []).length ? esc(s.external_instances.join("、")) : "—"}</td></tr>`).join("");
  const resRows = ((prev && prev.resources_referenced) || []).map(r =>
    `<tr><td>${esc(r.name)}</td><td>${esc(r.state || "—")}</td><td>${r.shared ? "共享（不动）" : "独占"}</td>
     <td>${esc((r.consumers || []).join("、") || "—")}</td></tr>`).join("");
  const warns = ((prev && prev.warnings) || []).map(w => `<p class="reason warn">⚠︎ ${esc(w)}</p>`).join("");
  const bodyHtml = `
    <p class="modal-line">对象：项目 <b>${esc(pj.name)}</b>（${esc(pid)}，${members.length} 个服务成员）</p>
    ${members.length ? `<p class="modal-line">将按所选处置逐成员移除登记：</p>
      <div class="table-scroll"><table><tr><td class="k">服务</td><td class="k">名称</td><td class="k">状态</td><td class="k">外部实例</td></tr>${memberRows}</table></div>` : `<p class="modal-line">（空项目，直接移除登记）</p>`}
    ${resRows ? `<p class="modal-line">引用的共享资源（一律不动）：</p>
      <div class="table-scroll"><table><tr><td class="k">资源</td><td class="k">状态</td><td class="k">共享</td><td class="k">其他使用方</td></tr>${resRows}</table></div>` : ""}
    <p class="modal-line">保留内容：${prev && prev.kept && prev.kept.length ? esc(prev.kept.join("、")) : "源码目录、数据库、容器与卷（一律不删除）"}</p>
    ${warns}
    <p class="modal-line muted">恢复方式：lsctl project-restore ${esc(pid)}，或本页「已移除登记」视图恢复</p>
    ${prev ? "" : `<p class="modal-line muted">（项目移除预览暂不可用，以上按已知状态展示）</p>`}
    <div class="field"><label>处置方式</label>
      <label class="radio"><input type="radio" name="rmDisp" value="stop" ${__rmDisp === "stop" ? "checked" : ""} onchange="__rmDisp='stop'"> 停止全部后移除</label>
      <label class="radio"><input type="radio" name="rmDisp" value="keep-external" ${keepOff ? "disabled" : ""} ${__rmDisp === "keep-external" ? "checked" : ""} onchange="__rmDisp='keep-external'"> 保留为外部实例</label>
    </div>
    ${keepOff ? `<p class="reason warn">无法保留为外部实例：${esc(keepReason)}</p>` : ""}`;
  let outcome = null;
  const ok = await showModal({title: "移除项目…", bodyHtml, okText: "移除项目", danger: true,
    onOk: async () => { outcome = await execProjectRemove(pid, __rmDisp); return true; }});
  if (!ok) return;
  const res = outcome.res || {};
  if (outcome.code === 200 && res.ok) {
    await showModal({title: "项目已移除", okText: "关闭", noCancel: true,
      bodyHtml: `<p class="modal-line">已移除项目 ${esc(pj.name)}（处置 ${esc(res.disposition || __rmDisp)}）。</p>
        <p class="modal-line muted">成员已归档；源码/数据/共享容器未动。恢复：lsctl project-restore ${esc(pid)}。</p>`});
    return;
  }
  const stopped = (res.stopped || []).join("、") || "—";
  const remaining = (res.remaining || []).map(m => `${m.id}：${m.reason || "未知原因"}`).join("；") || "—";
  await showModal({title: "移除中止", okText: "关闭", noCancel: true,
    bodyHtml: `<p class="modal-line">${esc(res.error || `移除失败（HTTP ${outcome.code}）`)}</p>
      <p class="modal-line">已停止：${esc(stopped)}</p>
      <p class="modal-line">未处理（登记保留）：${esc(remaining)}</p>
      <p class="modal-line muted">已停止的进程不会自动拉起；可重试移除。</p>`});
}

async function execProjectRemove(pid, disposition) {
  try {
    const [code, res] = await api("DELETE", `/api/projects/${pid}?disposition=${disposition}`, undefined);
    return {code, res: res || {}};
  } catch (e) { setConn(false); return {code: 0, res: {error: "无法连接控制服务"}}; }
}

// ---------- 编辑对话框（R05：完整定义保真编辑；dry_run diff → 确认注册，edited 路径入覆盖层） ----------

function editBodyHtml(extra) {
  const e = editState;
  return `
    <p class="modal-line muted">保存流程：先 dry_run 预览与已登记定义的差异，确认后才真正注册；改过的字段将记入覆盖层（edited）。${e.degraded ? "完整定义接口不可用，以下为降级编辑：GUI 看不到当前命令/端口，请按实际定义填写。" : "命令/端口/探针已按当前定义预填；未列出的字段（env、build、worker、compose 等）随注册原样保留，零变化。"}</p>
    <div class="field"><label>名称</label><input value="${esc(e.fields.name)}" oninput="editField('name', this.value)"></div>
    <div class="field"><label>描述</label><input value="${esc(e.fields.description)}" oninput="editField('description', this.value)"></div>
    <div class="field"><label>入口 URL</label><input value="${esc(e.fields.open)}" placeholder="http://127.0.0.1:<端口>/" oninput="editField('open', this.value)"></div>
    ${e.environments && (e.comps.some(c => c.run === "compose") || e.definition.dependencies?.some(d => d.container))
      ? dockerBindingField(e.environments, e.docker, "editSelectDocker(this)", "editSetDockerAutostart(this.checked)") : ""}
    ${e.definition.components?.some(c => c.run === "compose" && c.provision === "up")
      ? `<div class="field" id="edit-docker-provision" ${editDockerChangesTarget(e) ? "" : "hidden"}>
        <label class="radio"><input type="checkbox" ${e.confirmDockerProvision ? "checked" : ""}
          onchange="editState.confirmDockerProvision = this.checked">
          ${tr("允许在新环境创建容器和拉取镜像", "Allow creating containers and pulling images in the new environment")}</label></div>` : ""}
    ${e.comps.map((c, i) => `<div class="comp-edit">
      <div class="field"><label>组件 ${esc(c.id)}${(c.run || "local") === "compose" ? "（compose）" : ""}</label>
        ${(c.run || "local") === "compose"
          ? `<span class="inline-note">compose 组件（${esc(c.composeService || "?")}）：service/文件/provision 等字段随注册原样保留，无需命令</span>`
          : `<textarea rows="2" placeholder="命令 argv（每行一个参数，如 make↵serve-api）" oninput="editComp(${i}, 'cmd', this.value)">${esc(c.cmd.join("\n"))}</textarea>`}</div>
      <div class="field"><label></label>
        <input style="min-width:80px;max-width:110px" placeholder="端口" value="${c.port ?? ""}" oninput="editComp(${i}, 'port', this.value)">
        <input placeholder="探针 http 路径" value="${esc(c.probe)}" oninput="editComp(${i}, 'probe', this.value)"></div>
    </div>`).join("")}
    ${extra || ""}`;
}

function editSelectDocker(select) {
  const binding = selectedDockerBinding(select);
  if (!binding) return;
  if (binding.endpoint !== editState.docker?.endpoint) editState.confirmDockerProvision = false;
  editState.docker = binding;
  editState.dockerChanged = true;
  const checkbox = select.closest(".field").nextElementSibling?.querySelector("input");
  if (checkbox) { checkbox.checked = false; checkbox.disabled = !select.selectedOptions[0]?.dataset.profile; }
  const provision = document.getElementById("edit-docker-provision");
  if (provision) {
    provision.hidden = !editDockerChangesTarget(editState);
    provision.querySelector("input").checked = Boolean(editState.confirmDockerProvision);
  }
}

function editDockerChangesTarget(e) {
  return e.dockerChanged && e.docker?.endpoint !== e.definition.docker?.endpoint;
}

function editSetDockerAutostart(checked) {
  if (!editState.docker) return;
  editState.docker = {...editState.docker, autostart: checked};
  editState.dockerChanged = true;
}

function editField(key, value) { if (editState) editState.fields[key] = value; }
function editComp(i, key, value) {
  if (!editState || !editState.comps[i]) return;
  const c = editState.comps[i];
  if (key === "cmd") c.cmd = String(value).split("\n").map(s => s.trim()).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "probe") c.probe = value;
}

// ---- V2.3/R06 嵌套 dotted path 契约（GUI 与后台同一文法）----
// 组件字段按字段逐个产出：components[<id>].cmd / .port / .ready.http / .env.<KEY>；
// 顶层仅 name / description / open（id/source 等身份字段绝不可覆盖）。
function serviceEditedPaths(cur, orig) {
  const out = [];
  const eq = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  for (const k of ["name", "description", "open"])
    if ((cur[k] ?? "") !== (orig[k] ?? "")) out.push(k);
  const ocomps = (orig && orig.components) || [];
  ((cur && cur.components) || []).forEach((c, i) => {
    const o = ocomps[i] || {};
    const prefix = "components[" + (c.id || o.id) + "]";
    if ((c.cmd || []).join("\n") !== (o.cmd || []).join("\n")) out.push(prefix + ".cmd");
    if ((c.port ?? null) !== (o.port ?? null)) out.push(prefix + ".port");
    if (((c.ready || {}).http || "") !== ((o.ready || {}).http || "")) out.push(prefix + ".ready.http");
    const env = c.env || {}, oenv = o.env || {};
    for (const k of new Set([...Object.keys(env), ...Object.keys(oenv)]))
      if (!eq(env[k], oenv[k])) out.push(prefix + ".env." + k);
  });
  return out;
}

// 编辑对话框当前态 → 与定义快照同构（供 serviceEditedPaths 比较）
function editSnapshot(e) {
  return {name: e.fields.name, description: e.fields.description, open: e.fields.open,
          components: (e.comps || []).map(c => ({id: c.id, cmd: c.cmd || [], port: c.port ?? null,
                                                 ready: c.probe ? {http: c.probe} : null, env: c.env || {}}))};
}

function editedPaths(e) {
  // 与初始值对比生成 dotted paths（V2.3 service.edited：name / components[api].port / components[api].ready.http …）
  return serviceEditedPaths(editSnapshot(e), e.initial || {});
}

// 候选审核卡：用户在审核阶段的编辑（相对识别原始值 _orig）——注册同样携带 edited，
// 使「本次编辑」优先于旧覆盖（R06）。
function candidateEditedPaths(c) {
  return serviceEditedPaths(c, c && c._orig ? c._orig : c);
}

// R05：从完整定义构建注册 service——只有用户在对话框里改掉的值被替换，
// 其余字段（worker/compose/env/build/install/after/依赖…）逐字节保真 ride through。
function editFullService(e) {
  const svc = JSON.parse(JSON.stringify(e.definition || {}));
  svc.id = e.sid;
  svc.name = e.fields.name;
  svc.description = e.fields.description || "";
  svc.open = e.fields.open || null;
  if (e.dockerChanged && e.docker) svc.docker = e.docker;
  else delete svc.docker;
  if ((svc.components || []).some(c => c.run === "compose" && c.provision === "up"))
    svc.confirmed_provision = !editDockerChangesTarget(e) || Boolean(e.confirmDockerProvision);
  svc.components = (svc.components || []).map(c => {
    const ec = (e.comps || []).find(x => x.id === c.id);
    if (!ec || c.kind === "generator") return c;   // 未在对话框展示：原样保留
    const out = JSON.parse(JSON.stringify(c));
    if ((out.run || "local") === "local") out.cmd = (ec.cmd || []).slice();
    if (ec.port === null || ec.port === undefined || ec.port === "") { if ("port" in out) delete out.port; }
    else out.port = ec.port;
    const rd = Object.assign({}, out.ready || {});
    if (ec.probe) rd.http = ec.probe; else delete rd.http;
    if (Object.keys(rd).length) out.ready = rd; else delete out.ready;
    return out;
  });
  return svc;
}

function editPayload(dryRun) {
  const e = editState;
  const regsvc = (registry?.services || []).find(s => s.id === e.sid);
  const pid = e.projectId || (regsvc && regsvc.project) || "";
  const proj = (registry?.registry?.projects || []).find(x => x.id === pid)
               || {id: pid || e.sid, name: pid || e.sid, revision: 0};
  const svc = editFullService(e);   // R05：完整保真提交（未编辑字段零变化）
  const source = svc.source || (regsvc && regsvc.source) || (servicesById()[e.sid] || {}).source || "";
  const payload = {schemaVersion: 1, revision: proj.revision ?? 0,
                   project: {id: proj.id, name: proj.name, agent: proj.agent || "none"},
                   directories: [{path: source, role: "source"}],
                   by: "gui", service: svc};
  if (!dryRun) payload.service.edited = editedPaths(e);
  if (e._accept_new?.length) payload.service.accept_new = [...new Set(e._accept_new)];
  return payload;
}

// dry_run 预览（含覆盖层命中标注；R06：本次已编辑的字段不再算“覆盖保护”，未编辑的才可「采用新值」）
async function editPreviewStep(handle) {
  const e = editState;
  let code = 0, res = null;
  try { [code, res] = await api("POST", "/api/register", Object.assign(editPayload(true), {dry_run: true})); }
  catch (err) { setConn(false); }
  if (code !== 200 || !res || !res.ok) {
    handle.setBody(editBodyHtml(`<p class="reason warn">dry_run 失败：${esc((res && res.error) || code || "无法连接控制服务")}</p>`));
    return "keep";
  }
  let extra = "";
  if (res.action === "incomplete") {
    extra = `<p class="reason warn">payload 不完整：${esc((res.missing || []).join("、"))}（dry_run 不写草稿）</p>`;
  } else if (res.action === "diff") {
    let overrideFields = [];
    try {  // 覆盖层端点未就绪（404/501）→ 静默降级为普通 diff
      const [oc, o] = await api("GET", `/api/services/${res.service_id}/overrides`);
      if (oc === 200 && o && o.ok) overrideFields = Object.keys(o.fields || {});
    } catch (e2) { /* 不阻塞 diff */ }
    const editedNow = editedPaths(e);
    const rows = (res.diff || []).map(x => {
      const isEdited = editedNow.includes(x.field);
      const isOvr = overrideFields.includes(x.field);
      const cell = isOvr && !isEdited
        ? `<button onclick="editAcceptNew('${esc(x.field)}')">采用新值</button>`
        : isOvr && isEdited
          ? `<span class="inline-note">本次编辑优先（提交值即你的修改，注册后旧覆盖将被更新）</span>` : "";
      return `<tr><td class="k">${esc(x.field)}</td><td>${esc(JSON.stringify(x.old) ?? "")}</td><td>→</td><td>${esc(JSON.stringify(x.new) ?? "")}</td><td>${cell}</td></tr>`;
    }).join("");
    extra = `<p class="inline-note">与已登记服务 ${esc(res.service_id)} 的差异${overrideFields.length ? "（你的覆盖优先生效，但本次编辑优先：仅未编辑且命中覆盖的字段可用「采用新值」）" : ""}：</p>
      <div class="table-scroll"><table>${rows || `<tr><td class="muted">（无差异，注册将返回 unchanged）</td></tr>`}</table></div>`;
  } else {
    extra = `<p class="inline-note">dry_run 结果：${esc(res.action || "?")}</p>`;
  }
  e.confirmed = true;
  handle.setOkDanger(true);
  handle.setOkText("确认注册");
  handle.setBody(editBodyHtml(extra));
  return "keep";
}

// V2.3「采用新值」：接受新识别值、清除该字段的旧覆盖（编辑对话框侧）
function editAcceptNew(field) {
  const e = editState;
  if (!e || !field) return;
  e._accept_new = [...new Set([...(e._accept_new || []), field])];
  if (e._handle) { e.confirmed = false; handleReset(e._handle); editPreviewStep(e._handle); }
}
function handleReset(handle) { handle.setOkDanger(false); handle.setOkText("预览修改（dry_run）"); }

async function editOnOk(body, handle) {
  const e = editState;
  if (!e) return true;
  e._handle = handle;
  if (!e.confirmed) {
    if (e.comps.some(c => (c.run || "local") === "local" && !(c.cmd || []).length)) {
      handle.setBody(editBodyHtml(`<p class="reason warn">本地组件命令为必填（当前值 GUI 不可见，请按实际定义填写后再预览）。</p>`));
      return "keep";
    }
    return await editPreviewStep(handle);
  }
  // 第二步：真正注册（service.edited = 用户改过的 dotted paths → 注册成功后写入覆盖层）
  let code = 0, res = null;
  try { [code, res] = await api("POST", "/api/register", editPayload(false)); }
  catch (err) { setConn(false); res = {error: "无法连接控制服务"}; }
  if (code === 409 && res && res.current_revision != null) {
    await refresh();  // 修订号过期：取最新 revision 重试一次
    try { [code, res] = await api("POST", "/api/register", editPayload(false)); } catch (err) { /* 如实报告 */ }
  }
  msgs[e.sid] = code === 200 && res && res.ok
      ? `已更新（${res.action}；编辑字段已记入覆盖层）` : ((res && res.error) || "注册失败");
  await refresh();
  editState = null;
  return true;
}

async function editService(sid) {
  const p = servicesById()[sid];
  if (!p) return;
  // R05：先取完整当前定义（认证端点），以完整保真对象编辑——不为改名称重写整个启动配置
  let defRes = null;
  try {
    const [code, res] = await api("GET", `/api/services/${sid}/definition`);
    if (code === 200 && res && res.ok) defRes = res;
  } catch (e) { /* 网络异常 → 降级 */ }
  const def = (defRes && defRes.definition) || legacyDefinitionFromSnap(p);
  const usesDocker = def.components?.some(c => c.run === "compose") || def.dependencies?.some(d => d.container);
  const dockerResponse = usesDocker ? await api("GET", "/api/resources/environments").catch(() => []) : [];
  const environments = dockerResponse[1]?.environments;
  editState = {sid, confirmed: false, degraded: !defRes,
               definition: def, environments, docker: def.docker, projectId: defRes?.project_id || null,
               fields: {name: def.name || sid, description: def.description || "", open: def.open || ""},
               comps: (def.components || []).filter(c => c.kind !== "generator")
                 .map(c => ({id: c.id, name: c.name || c.id,
                             run: (c.run === "compose" || c.compose_service) ? "compose" : "local",
                             composeService: c.compose_service || "",
                             cmd: Array.isArray(c.cmd) ? c.cmd.slice() : [],
                             port: c.port ?? null, probe: (c.ready && c.ready.http) || "",
                             env: c.env || null}))};
  if (!editState.comps.length)
    editState.comps = [{id: "main", name: "main", run: "local", probe: "", cmd: [], port: null, env: null}];
  editState.initial = {name: editState.fields.name, description: editState.fields.description,
                       open: editState.fields.open,
                       components: (def.components || [])
                         .filter(c => c.kind !== "generator")
                         .map(c => ({id: c.id, cmd: Array.isArray(c.cmd) ? c.cmd : [],
                                     port: c.port ?? null,
                                     ready: (c.ready && c.ready.http) ? {http: c.ready.http} : null,
                                     env: c.env || {}}))};
  return showModal({title: "编辑服务 " + sid, okText: "预览修改（dry_run）",
                    bodyHtml: editBodyHtml(), onOk: editOnOk});
}

// 定义端点不可用时的降级来源（旧行为：快照只知道组件 id/name——字段需用户手填）
function legacyDefinitionFromSnap(p) {
  const comps = (p.components || []).filter(c => c.kind !== "generator")
    .map(c => ({id: c.id, kind: "server", name: c.name || c.id, cwd: ".", cmd: [], port: null}));
  return {id: p.id, name: p.name || p.id, description: p.description || "", open: "",
          source: p.source || "", components: comps, dependencies: []};
}

// ---------- 已移除登记视图（V2.2 恢复入口） ----------

async function loadRemoved() {
  try {
    const [c, d] = await api("GET", "/api/removed");
    removedData = c === 200 && d && d.ok ? d : {ok: false, error: (d && d.error) || `HTTP ${c}`};
    setConn(true);
  } catch (e) { removedData = {ok: false, error: tr("无法连接控制服务", "Could not connect to the control service")}; setConn(false); }
  render();
}

function viewRemoved() {
  if (!removedData) return `<div class="empty">${tr("加载中…", "Loading…")}</div>`;
  if (!removedData.ok) return `<section class="card"><div class="card-head"><h3>${tr("已移除登记", "Removed registrations")}</h3></div>
    <p class="reason warn" style="margin:0 0 6px">${esc(removedData.error || tr("不可用", "Unavailable"))}</p>
    <p class="note">${tr("后台可能尚未提供该端点（501）；稍后重试。", "Try loading removed registrations again.")}</p>
    <div class="acts" style="justify-content:flex-start"><button onclick="loadRemoved()">${tr("重新加载", "Reload")}</button></div></section>`;

  const projs = (removedData.projects || []).map(p => `
    <tr><td style="font-weight:600">${esc(p.pid)}</td><td>${esc((p.services || []).join(", ") || "—")}</td><td>${esc(p.removed_at || "—")}</td>
        <td><label class="radio"><input type="radio" name="ri-p-${esc(p.pid)}" checked onchange="removedIntents['p:${esc(p.pid)}']='stopped'">${tr("停止", "Stopped")}</label>
            <label class="radio"><input type="radio" name="ri-p-${esc(p.pid)}" onchange="removedIntents['p:${esc(p.pid)}']='running'">${tr("运行意图", "Keep run intent")}</label></td>

  const svcTable = svcs ? `<div class="table-scroll"><table>

function wizField(key, value) {

function trackWizard(w) {
  if (w.taskId == null) {
    w.taskId = recognitionTasks.length;
    recognitionTasks.push(w);
  }
}

function wizNewTask() {
  if (wiz.dir || wiz.name || wiz.step !== "dir") trackWizard(wiz);
  wiz = newWizard();
  trackWizard(wiz);

function wizardTarget(w, useResolvedDirectory = false) {
  if (w.project) return w.project;
  const dir = (useResolvedDirectory && w.job?.directory || w.dir).trim().replace(/\/+$/, "") || (w.dir.trim() === "/" ? "/" : "");
  const name = w.name.trim() || dir.split("/").at(-1);
  if (!dir || !name) return null;
  const projects = registry?.registry?.projects || [];
  const matches = projects.filter(p => p.directories?.some(d => d.path === dir));
  const existing = matches.find(p => p.name === name) || (matches.length === 1 ? matches[0] : null);
  if (existing) return existing;
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
  const base = slug || "project";
  let id = base;
  for (let n = 2; projects.some(p => p.id === id); n++) id = base.slice(0, 43) + "-" + n;
  return {id, name, revision: 0};
}

function wizPresetFor(pid, mode) {

  trackWizard(wiz);
  wiz.project = g;
  wiz.name = g.name;
  wiz.customName = true;

  wiz.agent = g.agent || "";
