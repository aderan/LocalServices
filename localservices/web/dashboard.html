<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locove</title>
<link rel="icon" type="image/png" href="/locove-logo.png">
<style>
  :root { color-scheme: light dark;
          --fg:#172133; --mute:#586579; --line:#dfe4eb; --bg:#f8f9fb; --soft:#eef2f7; --page:#f0f2f5; --card:#fff;
          --ok:#167546; --warn:#875600; --bad:#b42318; --btn:#1859ce; --on-btn:#fff;
          --hair:#ececf0; }
  @media (prefers-color-scheme: dark) { :root {
          --fg:#f5f5f7; --mute:#a1a1a6; --line:#38383a; --bg:#1c1c1e; --soft:#2c2c2e; --page:#111113; --card:#1c1c1e;
          --ok:#5bd17a; --warn:#f2c14e; --bad:#ff6b5e; --btn:#9bbdff; --on-btn:#111827;
          --hair:#2a2a2d; } }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0;
         background: var(--page); color: var(--fg); }
  .banner { background: var(--soft); border-bottom: 1px solid var(--line); color: var(--bad);
            font-weight: 600; padding: 8px 20px; text-align: center; }
  .banner:not([hidden]) { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
  .banner.stale { color: var(--warn); }
  .banner.update { color: var(--fg); }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  nav { background: var(--bg); border-right: 1px solid var(--line); padding: 14px 10px;
        display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start;
        max-height: 100vh; overflow-y: auto; }
  .brand { padding: 2px 10px 12px; }
  .brand-heading { display: flex; align-items: center; gap: 6px; }
  .brand-heading img { flex: none; }
  .brand h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .01em; }
  .brand .brand-sub { color: var(--mute); font-size: 11px; }
  .navitem { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
             padding: 6px 10px; border-radius: 7px; border: 0; background: none; color: var(--fg);
             cursor: pointer; }
  .navitem:hover { background: var(--soft); }
  .navitem.active { background: var(--soft); color: var(--btn); font-weight: 600; }
  .navitem.add { color: var(--btn); }
  .project-navitem { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .project-alert { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .project-alert.partial { background: var(--warn); }
  .navlabel { color: var(--mute); font-size: 11px; padding: 12px 10px 3px; text-transform: uppercase; letter-spacing: .05em; }
  .navspacer { flex: 1; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px;
           background: var(--bad); color: #fff; text-align: center; margin-left: 4px; }
  .badge.mut { background: var(--mute); }
  .badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--card)); }
  .docker-recovery { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .docker-recovery-error { overflow-wrap: anywhere; }
  .runtime-card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .docker-test-panel > summary { cursor: pointer; font-weight: 600; }
  .docker-test-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .docker-test-row > strong { margin-right: auto; }
  .docker-test-row > .reason { flex-basis: 100%; }
  .docker-other > summary { cursor: pointer; padding: 8px 0; }
  .docker-other > section { margin-top: 10px; }
  .content { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 19px 26px 17px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .topbar h2 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .topbar .subtitle { color: var(--mute); font-size: 12.5px; flex: 1 1 160px; }
  .topbar .subtitle:empty { display: none; }
  #refreshBtn { white-space: nowrap; min-width: 104px; }
  #refreshBtn[aria-disabled="true"] { opacity: .55; cursor: default; }
  #globalSearch { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px;
                  border: 1px solid var(--line); background: var(--card); color: var(--fg);
                  width: min(100%, 240px); min-width: 0; margin-left: auto; }
  main { padding: 18px 26px 56px; max-width: 1340px; width: 100%; container-type: inline-size;
         container-name: mainc; }
  /* —— 分组：一个项目一组紧凑行（Magpie 语法：细分隔、整组一体） —— */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           margin: 0 0 12px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px 8px;
                background: var(--card); border-bottom: 1px solid var(--hair); }
  .group-head h3 { font-size: 13.5px; margin: 0 auto 0 0; font-weight: 600; }
  .group-head .note { margin: 0; }
  .group-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 6px 14px;
                 border-bottom: 1px solid var(--hair); font-size: 12.5px; color: var(--mute); }
  .project-config > h3 { margin: 0; font-size: 15px; }
  .project-config { padding: 16px; }
  .project-config > h3 { margin-bottom: 12px; }
  .project-settings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 20px; }
  .project-settings h4 { margin: 0 0 8px; font-size: 13px; }
  .project-settings .note { overflow-wrap: anywhere; }
  .directory-list { list-style: none; padding: 0; margin: 0 0 10px; }
  .directory-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
                       gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--hair); }
  .directory-list code { display: block; overflow-wrap: anywhere; }
  .field.directory-form input { min-width: 0; flex: 1 1 160px; }
  @container mainc (max-width: 660px) {
    .project-settings { grid-template-columns: 1fr; gap: 14px; }
  }
  .svc > .service-message { margin: 0 14px 10px 15px; padding: 6px 10px;
                            border-radius: 6px; background: var(--soft); overflow-wrap: anywhere; }
  .service-message.bad { background: color-mix(in srgb, var(--bad) 7%, var(--card)); }
  .group-tools .acts { gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px 8px; margin: 0 0 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .card-head h3 { font-size: 15px; margin: 0 auto 0 0; }
  .card-head .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .star { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px;
          color: var(--mute); }
  .star.on { color: var(--warn); }
  .recognition-task { display: grid; grid-template-columns: minmax(0, 1fr) auto; text-align: left;
                      gap: 2px 10px; width: 100%; margin: 4px 0; background: var(--card); }
  .recognition-task[aria-pressed="true"] { border-color: var(--btn); background: var(--soft); }
  .recognition-task small { grid-column: 1 / -1; color: var(--mute); overflow-wrap: anywhere; }
  .note { color: var(--mute); font-size: 12px; margin: 2px 0 8px; }
  /* —— 服务行（Magpie：主副文本 + 行尾对齐 + 细分隔；整行可点开详情） —— */
  .svc { border-top: 1px solid var(--hair); }
  .svc:first-of-type { border-top: 0; }
  .svc.expanded { background: color-mix(in srgb, var(--soft) 45%, var(--card)); }
  .line { display: grid; grid-template-columns: minmax(0, 1fr) min(44%, 20rem) 16rem;
          gap: 12px; align-items: center; min-height: 64px; padding: 10px 13px 10px 15px; cursor: pointer; }
  .line > * { min-width: 0; }
  .line:hover { background: color-mix(in srgb, var(--soft) 45%, transparent); }
  .line:focus-visible { outline: 2px solid var(--btn); outline-offset: -4px; border-radius: 8px; }
  .service-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .service-mark { display: grid; place-items: center; flex: 0 0 32px; height: 32px; border-radius: 8px;
                  color: var(--btn); background: color-mix(in srgb, var(--btn) 10%, var(--card));
                  font-size: 14px; font-weight: 650; }
  .service-failed .service-mark, .service-conflict .service-mark {
    color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--card)); }
  .service-stopped .service-mark { color: var(--mute); background: var(--soft); }
  .group.single:has(.service-failed), .group.single:has(.service-conflict) {
    border-color: color-mix(in srgb, var(--bad) 36%, var(--line)); }
  .service-failed.expanded, .service-conflict.expanded {
    background: color-mix(in srgb, var(--bad) 3%, var(--card)); }
  .statecell { display: grid; grid-template-columns: min(9.5rem, 53%) minmax(0, 1fr);
               align-items: center; gap: 3px 6px; }
  .statecell .state { justify-self: end; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; padding: 3px 7px; border-radius: 6px; background: var(--soft); }
  .statecell .s-available, .statecell .s-external {
    color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--card)); }
  .statecell .s-failed, .statecell .s-conflict {
    background: color-mix(in srgb, var(--bad) 8%, var(--card)); }
  .name { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; min-width: 0;
          display: flex; flex-direction: column; gap: 3px; }
  .name small { display: block; font-weight: 400; color: var(--mute); font-size: 11.5px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { font-weight: 500; font-size: 12.5px; color: var(--mute); }
  .state::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                   margin-right: 6px; background: var(--mute); vertical-align: 1px; }
  .s-available { color: var(--fg); } .s-partial { color: var(--warn); }
  .s-failed, .s-conflict { color: var(--bad); }
  .s-available::before { background: var(--ok); } .s-partial::before { background: var(--warn); }
  .s-failed::before, .s-conflict::before { background: var(--bad); }
  .s-starting::before, .s-stopping::before, .s-preparing::before { background: var(--btn); }
  .s-external::before { background: var(--ok); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ok); }
  .code { color: var(--mute); font-size: 11.5px; overflow-wrap: anywhere; line-height: 1.3; }
  .statecell .code { grid-column: 2; grid-row: 2; }
  .code.pending, .code.failed { font-weight: 600; }
  .code.pending { color: var(--warn); } .code.failed { color: var(--bad); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .acts button { padding: 3px 10px; font-size: 12.5px; }
  /* V3：无端口域名是服务行的主要信息（紧凑主副文本 + 可复制） */
  .domain { display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent;
    color: var(--fg); font: inherit; text-align: left; min-width: 0; cursor: copy; }
  .statecell .domain { justify-self: start; max-width: 100%; padding: 3px 7px; }
  .statecell .domain b { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .statecell .domain small { display: none; }
  .statecell .domain.down small { display: block; }
  .domain:hover { border-color: var(--btn); }
  .domain b { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .domain small { color: var(--mute); font-size: 10.5px; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .domain.down { border-color: var(--warn); }
  .domain.down small { color: var(--warn); }
  /* —— 域名健康条：一行摘要 + 去设置；完整诊断/安装指引在设置视图（R6） —— */
  .health { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px;
    padding: 5px 12px; border: 1px solid var(--warn); border-radius: 8px; margin: 0 0 10px;
    background: var(--card); }
  .health b { font-weight: 600; }
  .health .fix { color: var(--mute); }
  .health .goto { margin-left: auto; font-size: 12px; padding: 2px 10px; }
  button.link { background: none; border: none; padding: 0; color: var(--btn); text-decoration: underline;
    font: inherit; cursor: copy; min-height: 0; }
  button, .btn { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px;
                 border: 1px solid var(--line); background: var(--soft); color: var(--fg); cursor: pointer; }
  button.primary, .btn.primary { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--btn); outline-offset: 2px; }
  .reason { margin: 6px 0 0; color: var(--bad); font-size: 13px; white-space: pre-wrap; }
  .reason.warn { color: var(--warn); }
  .reason.info { color: var(--mute); }
  /* —— 详情面板（选中行下方；概览/入口/组件/依赖/日志分层） —— */
  .detail { border-top: 1px solid var(--hair); padding: 10px 16px 12px; }
  .diagnosis { display: grid; gap: 8px; margin: 2px 0 14px; padding: 14px 16px;
               border: 1px solid color-mix(in srgb, var(--diagnosis-color) 30%, var(--line));
               border-radius: 10px; background: color-mix(in srgb, var(--diagnosis-color) 6%, var(--card));
               color: var(--diagnosis-color); --diagnosis-color: var(--bad); }
  .diagnosis.warning { --diagnosis-color: var(--warn); }
  .diagnosis strong { font-size: 14px; }
  .diagnosis p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
  .diagnosis .acts { justify-content: flex-start; }
  .agent-diagnosis-result { margin-top: 4px; color: var(--fg); overflow-wrap: anywhere; }
  .agent-diagnosis-result h4 { margin: 0 0 4px; font-size: 13px; }
  .diagnosis .agent-diagnosis-result p { max-height: none; }
  .agent-diagnosis-result ol { margin: 7px 0 0; padding-inline-start: 1.6em; }
  .agent-diagnosis-result li + li { margin-top: 3px; }
  .agent-diagnosis-actions select { font: inherit; padding: 3px 6px; color: var(--fg);
                                    background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .diagnostic-toggle { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--line));
                       background: color-mix(in srgb, var(--bad) 7%, var(--card)); }
  .diagnosis:focus { outline: 2px solid var(--btn); outline-offset: 2px; }
  .log-window { border-radius: 8px; overflow: hidden; background: #20242d; color: #e0e7f1; }
  .log-window header { padding: 7px 12px; background: #161b23; color: #b8c5d8; font-size: 11px; }
  .log-window pre { margin: 0; background: transparent; border-radius: 0; padding: 10px 12px; }
  .detail h4 { font-size: 11px; margin: 10px 0 4px; color: var(--mute);
               text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .detail h4:first-child { margin-top: 2px; }
  details { margin: 6px 0 0; font-size: 13px; }
  summary { cursor: pointer; color: var(--mute); }
  table { border-collapse: collapse; margin: 6px 0; }
  td { padding: 2px 14px 2px 0; vertical-align: top; font-size: 12.5px; }
  td.k { color: var(--mute); white-space: nowrap; }
  pre { background: var(--soft); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto;
        font-size: 12px; white-space: pre-wrap; }
  .table-scroll { overflow-x: auto; }
  .msg { color: var(--mute); font-size: 12px; margin: 4px 0 0; }
  .diffbox { margin: 6px 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .diffbox summary { cursor: pointer; color: var(--warn); font-size: 13px; }
  .diffbox table { margin-top: 4px; }
  .msg.bad { color: var(--bad); }
  .field { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .field label { min-width: 110px; color: var(--mute); font-size: 13px; }
  .field input, .field select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px;
        border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 220px; flex: 1; }
  .inline-note { color: var(--mute); font-size: 12px; }
  .cand { border-top: 1px solid var(--line); padding: 10px 0; }
  .cand:first-child { border-top: 0; }
  .cand-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cand-head .name { flex: 1; }
  .comp-edit { background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .result-box { border-radius: 8px; padding: 8px 12px; margin: 8px 0; background: var(--soft); }
  .result-box.ok { color: var(--ok); } .result-box.bad { color: var(--bad); }
  .warnlist { color: var(--warn); font-size: 12px; white-space: pre-wrap; }
  .dot-sep { color: var(--line); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .muted { color: var(--mute); }
  .empty { color: var(--mute); padding: 22px 4px; text-align: center; }
  /* 设置视图（R6：设置与草稿分离；域名诊断完整内容归设置上下文） */
  .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .language-card { padding-bottom: 14px; }
  .language-card .card-head { margin-bottom: 0; }
  .language-card .seg { margin-left: auto; flex-shrink: 0; }
  .language-card .seg button { width: 66px; }
  .domain-field { display: grid; grid-template-columns: min(110px, 30%) minmax(0, 1fr); }
  .domain-field > :first-child { min-width: 0; color: var(--mute); font-size: 13px; }
  .domain-field .inline-note { grid-column: 1 / -1; }
  .domain-field .seg { justify-self: end; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                      width: min(100%, 162px); }
  .domain-field input { min-width: 0; width: min(100%, 110px); }
  .domain-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;
                    justify-self: end; width: min(100%, 162px); }
  .language-card .seg button, .domain-field .seg button, .domain-actions button {
    font-size: 12px; padding: 3px 5px; white-space: nowrap;
  }
  .settings-grid td, .settings-grid td.k, .settings-grid .mono { white-space: normal; overflow-wrap: anywhere; }
  .settings-grid td.k { width: 36%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 4px 12px; }
  .seg button.on { background: var(--btn); color: var(--on-btn); }
  .seg button + button { border-left: 1px solid var(--line); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  /* V2.11 溢出菜单（⋯）与自绘模态 */
  .kebab { border: 0; background: none; color: var(--mute); font-size: 15px; line-height: 1;
           padding: 2px 7px; border-radius: 6px; cursor: pointer; }
  .kebab:hover { background: var(--soft); color: var(--fg); }
  .menu-backdrop { position: fixed; inset: 0; z-index: 60; }
  .menu { position: absolute; z-index: 61; min-width: 168px; background: var(--card);
          border: 1px solid var(--line); border-radius: 9px; padding: 4px;
          box-shadow: 0 8px 26px rgba(0,0,0,.18); }
  .menu-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px;
               padding: 6px 10px; border: 0; border-radius: 6px; background: none;
               color: var(--fg); cursor: pointer; }
  .menu-item:hover, .menu-item:focus-visible { background: var(--soft); }
  .menu-item.danger { color: var(--bad); }
  .menu-sep { border-top: 1px solid var(--line); margin: 4px 2px; }
  .modal-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.34);
                   display: flex; align-items: flex-start; justify-content: center;
                   padding: 9vh 16px 16px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           box-shadow: 0 18px 48px rgba(0,0,0,.28); width: min(560px, 100%);
           max-height: 82vh; display: flex; flex-direction: column; }
  .modal h3 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal-body { padding: 12px 16px; overflow-y: auto; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px 14px;
                border-top: 1px solid var(--line); }
  .modal-line { margin: 6px 0; }
  .modal-line.muted { color: var(--mute); font-size: 12px; }
  .radio { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: 13px; }
  @media (max-width: 920px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
  /* W1：设置双栏按内容区宽度（容器查询）收缩——960 原生窗（视口不触发旧 920 断点）也能单列读长诊断 */
  @container mainc (max-width: 780px) {
    .settings-grid { grid-template-columns: 1fr; }
  }
  @container mainc (max-width: 720px) {
    .line { grid-template-columns: minmax(0, 1fr) minmax(0, 56%); }
    .line > .acts { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }

<script>
"use strict";
const TOKEN = "__TOKEN__";
const DASHBOARD_REVISION = "__DASHBOARD_REVISION__";
const H = {"X-LocalServices-Token": TOKEN, "Content-Type": "application/json"};
const pending = {};   // key -> in-flight action label（防重复点击）
const msgs = {};
const open = {};      // service id -> details open
const logs = {};      // service id -> log text
let snap = null;      // /api/status
let registry = null;  // /api/registry
let agentCandidates = null;  // /api/agents/candidates（连接页候选，按需加载）
let agentsData = null, resourcesData = null, draftsData = null, removedData = null;
let resourcesLoading = false, resourcesFetchedAt = 0, focusedDocker = null;
const dockerStarting = new Set(), dockerErrors = new Map();
const diagnoses = new Map(), diagnosisPending = new Set();
let diagnosesLoaded = false;
const dockerStopping = new Set(), dockerStopErrors = new Map(), openDockerTests = new Set();
let otherDockerOpen = false;
let locoveData = null;   // /api/locove：dns / 入口 / 代理三层健康 + 路由事实
let pendingEndpointSettings = location.pathname === "/endpoint-settings";
let view = "all";     // all | project:<id> | attention | removed | resources | agents | drafts | new-project
let connOk = null;
let manualRefresh = false;
let refreshFailed = false;
let reloadingDashboard = false;
let pendingWrites = 0;
const STALE_SNAPSHOT_MS = 30_000;
let pendingDiagnosis = null;
let draftEdit = {};         // draft id -> 编辑中的 service 字段
const recognitionTasks = [];
let wiz = newWizard();
// V2.11 自绘交互状态
let modalState = null;      // 打开中的模态（{overlay, dialog, okBtn}）；轮询刷新期间不重建内容区
let menuState = null;       // 打开中的 ⋯ 菜单
let __rmDisp = "keep-external";   // 移除对话框的处置选择（radio 回写）
let __modalInput = "";            // 模态内单行输入（重命名等）
let editState = null;             // 编辑对话框状态（两步：dry_run diff → 确认注册）
const removedIntents = {};        // 恢复目标 -> "stopped" | "running"（缺省 stopped）

function newWizard() {
  return {step: "dir", dir: "", name: "", agent: "", project: null,
          jobId: null, job: null, error: "",
          candidates: [], unresolved: [], results: {}, registering: false, manual: false,
          diffs: {},        // 候选下标 → dry_run 差异（与已登记服务的对比预览）
          dirs: [],         // 多目录联合识别：待分析目录队列
          presetDirs: []};  // 已有项目预置的目录选择
}

// ------------------------------------------------------------ 基础设施

async function api(method, path, body) {
  if (method !== "GET") pendingWrites++;
  try {
    const r = await fetch(path, {method, headers: H, body: body ? JSON.stringify(body) : undefined});
    let data = null;
    try { data = await r.json(); } catch (e) { /* 非 JSON 响应 */ }
    return [r.status, data];
  } finally {
    if (method !== "GET") pendingWrites--;
  }
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function t(ts) { return ts ? new Date(ts*1000).toLocaleString(language, {hour12:false}) : "—"; }
function busy(key) { return !!pending[key]; }

function setConn(ok) {
  connOk = ok;
  renderStatusBanner();
}

function renderStatusBanner() {
  const banner = document.getElementById("banner");
  const stale = connOk === true && snap?.generated_at > 0 && Date.now() - snap.generated_at * 1000 >= STALE_SNAPSHOT_MS;
  const message = connOk === false
    ? tr("无法连接控制服务，服务状态未知。恢复连接后将自动更新。", "Daemon unavailable. Service status will update when the connection returns.")
    : stale ? tr(`服务状态长时间未更新。上次采集于 ${t(snap.generated_at)}。`, `Service status is out of date. Last checked ${t(snap.generated_at)}.`) : "";
  const failure = refreshFailed ? tr("刷新失败，请重试。", "Refresh failed. Try again.") : "";
  const status = [message, failure].filter(Boolean).join(" ");
  banner.classList.toggle("stale", stale && !refreshFailed);
  banner.hidden = !(status || manualRefresh);
  const label = document.getElementById("bannerMessage");
  if (label.textContent !== status) label.textContent = status;
  const button = document.getElementById("refreshBtn");
  const action = manualRefresh ? tr("刷新中…", "Refreshing…") : tr("立即刷新", "Refresh now");
  if (button.textContent !== action) button.textContent = action;
  button.setAttribute("aria-disabled", String(manualRefresh));
}

function nativeBridge() {
  try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lsbridge) || null; }
  catch (e) { return null; }
}
// 原生目录选择回调（WKWebView 注入；浏览器环境走 chooseDirectory 的输入框退化）
window.lsPickDirectory = function(path) {
  const cb = window.__lsPickCb;
  window.__lsPickCb = null;
  if (cb) cb(typeof path === "string" ? path : null);
};

// ------------------------------------------------------------ 数据视图

function servicesById() {
  const m = {};
  for (const p of (snap?.projects || [])) m[p.id] = p;
  return m;
}

function projectGroups() {
  const byId = servicesById();
  const out = [];
  const claimed = new Set();
  const projects = (registry?.registry?.projects || []).slice()
    .sort((a, b) => (b.favorite - a.favorite) || a.name.localeCompare(b.name, "zh-CN"));
  for (const pj of projects) {
    if (!(pj.services || []).length) continue;
    const members = pj.services.map(s => byId[s]).filter(Boolean);
    if (!members.length) { out.push({pj, members: []}); continue; }
    members.forEach(m => claimed.add(m.id));
    out.push({pj, members});
  }
  const orphans = (snap?.projects || []).filter(p => !claimed.has(p.id));
  if (orphans.length) out.push({pj: {id: "", name: "未分组服务", favorite: false, agent: "none",
                                     directories: [], services: orphans.map(o => o.id), revision: 0},
                                members: orphans, orphan: true});
  return out;
}

function matchesQuery(value) {
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  return (value || "").toLowerCase().includes(q);
}

function matchesSearch(s) {
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  if (!q) return true;
  return (s.name || "").toLowerCase().includes(q) || (s.id || "").toLowerCase().includes(q)
      || ((s.description || "") + "").toLowerCase().includes(q);
}
function projectMatchesSearch(pj, members) {
  const q = document.getElementById("globalSearch").value.trim().toLowerCase();
  if (!q) return true;
  return (pj.name || "").toLowerCase().includes(q) || (pj.id || "").toLowerCase().includes(q)
      || members.some(matchesSearch);
}

function needsAttention(p) {
  return ["failed", "conflict", "partial"].includes(p.state);
}

function attentionServices() {
  return (snap?.projects || []).filter(needsAttention);
}

// ------------------------------------------------------------ 渲染

let language;
let languageVersion = 0;
const originalLabels = new WeakMap();
const tr = (zh, en) => language === "en" ? en : zh;
const productName = () => tr("洛湾", "Locove");
const VIEW_TITLES = {all: ["服务", "Services"], attention: ["需要处理", "Needs attention"],
  removed: ["已移除登记", "Removed projects & services"], resources: ["资源", "Resources"],
  agents: ["Agent 连接", "Agent connections"], settings: ["设置", "Settings"], "new-project": ["添加服务", "Add service"]};

function applyLanguage(value) {
  const next = value === "zh-CN" ? "zh-CN" : "en";
  if (language === next) return;
  language = next;
  if (document.documentElement) document.documentElement.lang = language;
  document.title = productName();
  const title = document.querySelector(".brand h1");
  if (title) title.textContent = productName();
  document.querySelectorAll("[data-en]").forEach(el => {
    if (!originalLabels.has(el)) originalLabels.set(el, el.textContent);
    const label = tr(originalLabels.get(el), el.dataset.en);
    if (el.textContent !== label) el.textContent = label;
  });
  renderStatusBanner();
  const search = document.getElementById("globalSearch");
  search.placeholder = tr("搜索项目 / 服务", "Search projects or services");
  search.setAttribute("aria-label", tr("全局搜索", "Search"));
}

const EN_STATE = {stopped: "Stopped", starting: "Starting", preparing: "Preparing",
  available: "Available", partial: "Degraded", failed: "Failed", stopping: "Stopping",
  unknown: "Unknown", conflict: "Conflict", external: "Running externally"};
function stateLabel(service) {
  if (language !== "en") return service.label;
  if (service.label === "引擎无响应") return "Engine unavailable";
  return EN_STATE[service.state] || service.label;
}

function viewSubtitle(main) {
  if (view === "all") {
    if (!snap) return "";
    const projects = main.querySelectorAll(".group").length;
    const services = main.querySelectorAll(".svc").length;
    const ready = main.querySelectorAll('[data-act="open"]:enabled').length;
    return tr(`${projects} 个项目 · ${services} 个服务 · ${ready} 个可打开`, `Projects: ${projects} · Services: ${services} · Ready to open: ${ready}`);
  }
  if (view === "attention") return tr("失败 / 冲突 / 部分可用的服务集中在此处理", "Services that failed, have conflicts, or are degraded");
  if (view === "removed") return tr("恢复不会自动启动；「运行意图」仅恢复意图", "Restore an entry to the workbench and start it separately when needed");
  if (view === "resources") return tr("Docker 运行环境及其服务依赖", "Docker environments and the services that use them");
  if (view === "agents") return tr("识别用 CLI 连接的检测与验证", "Check the Codex and Claude connections used to discover services");
  if (view === "new-project") return tr("选目录 → 识别 / 手动登记 → 核对 → 注册 → 启动", "Choose a directory, review the service definition, then register and start");
  if (view.startsWith("project:")) {
    const g = projectGroups().find(x => x.pj.id === view.slice(8));
    return g ? tr(`${g.members.length} 个服务`, `Services: ${g.members.length}`) : "";
  }
  return "";
}

function renderHealth() {
  const el = document.getElementById("locoveHealth");
  if (!el) return;
  const d = locoveData;
  // D2：域名是可选能力——未安装/已关闭不产生任何告警；只在用户开启域名后才提示故障。
  if (!d || !domainSettings().use_domains || d.state === "available") { el.innerHTML = ""; el.hidden = true; return; }
  const pb = d.proxy_bypass;
  const bad = [];
  if (d.dns?.ok === false) bad.push("DNS");
  if (d.proxy?.ok === false) bad.push("代理");
  if (d.resolver?.ok === false) bad.push("解析配置");
  if (pb?.ok === false) bad.push("代理绕行");
  if (!bad.length && d.state === "starting") {
    el.hidden = false;
    el.innerHTML = `<b>域名模块启动中…</b><span class="fix">正在安装/验证（可能等待管理员授权）；打开动作暂时回退直连</span>`;
    return;
  }
  el.hidden = false;
  el.innerHTML = `<b>域名模块异常：${esc(bad.join(" · "))}</b>`
    + `<span class="fix">已开启域名跳转，打开动作将回退直连</span>`
    + `<button class="goto" onclick="setView('settings')">查看诊断与修复指引</button>`;
}

function render({preserveLogReading = true} = {}) {
  renderNav();
  renderHealth();
  const main = document.getElementById("main");
  // 用户正在输入时不整刷内容区（导航/徽标照常更新），避免打断
  const a = document.activeElement;
  if (a && main.contains(a) && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName)) return;
  // V2.11：模态/菜单打开时轮询刷新只更新内部状态，绝不重建内容区 DOM
  if (uiLocked()) return;
  // UX2（review 2026-11-05）：用户正阅读/选择日志区（悬停或持有选区）时，
  // 后台触发的整树重建一律延后——选择、焦点与滚动位置不允许被打断。
  if (preserveLogReading && logReading()) return;
  renderStatusBanner();
  document.getElementById("viewTitle").textContent =
    view.startsWith("project:") ? (projectGroups().find(g => g.pj.id === view.slice(8))?.pj.name || "项目")
                                : tr(...(VIEW_TITLES[view] || VIEW_TITLES.all));
  let html = "";
  if (view === "all") html = viewAll();
  else if (view.startsWith("project:")) html = viewProject(view.slice(8));
  else if (view === "attention") html = viewAttention();
  else if (view === "removed") html = viewRemoved();
  else if (view === "resources") html = viewResources();
  else if (view === "agents") html = viewAgents();
  else if (view === "settings") html = viewSettings();
  else if (view === "new-project") html = viewNewProject();
  // W1：与上次写入内容一致且期间无外部改写时跳过重建——同轮询周期内状态不变则
  // 焦点/选区/滚动/悬停节点身份天然保持；变化（或 #main 被外部改写）时按锚点与
  // DOM 路径恢复滚动和焦点（见 replaceMain）
  if (html !== __lastWritten || __mainDirty) replaceMain(main, html, a);
  const subtitle = document.getElementById("viewSubtitle");
  const summary = viewSubtitle(main);
  if (subtitle.textContent !== summary) subtitle.textContent = summary;
  if (location.hash.startsWith("#p-")) {
    const el = document.getElementById(location.hash.slice(1));
    if (el && el.scrollIntoView) el.scrollIntoView({block: "center"});
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* 无头环境无 history */ }
  }
}

// —— W1 轮询稳定性：整树重建不可避免时，焦点/滚动/日志滚动位置按锚点恢复 ——
let __lastWritten = null;   // 上次 replaceMain 写入的 html
let __mainDirty = false;    // #main 被 replaceMain 之外改写（如测试/注入）→ 下次 render 强制重建
let __replacing = false;
try {
  if (typeof MutationObserver === "function") {
    new MutationObserver(() => { if (!__replacing) __mainDirty = true; })
      .observe(document.getElementById("main"), {childList: true});
  }
} catch (e) { /* 无头桩环境无 MutationObserver */ }
// DOM 路径 = main 内子元素下标链；重建后同一路径且同 tagName 的元素恢复焦点
// （文本变化也接受按钮——如「启动并打开→启动中…」，焦点留在原位比丢失好）。
function domPath(root, el) {
  const path = [];
  try {
    let n = el;
    while (n && n !== root) {
      const parent = n.parentElement || n.parent;
      if (!parent) return null;
      const kids = parent.children || [];
      let idx = -1;
      for (let i = 0; i < kids.length; i++) if (kids[i] === n) { idx = i; break; }
      if (idx < 0) return null;
      path.unshift(idx);
      n = parent;
    }
  } catch (e) { return null; }
  return path.length ? path : null;
}
function findByDomPath(root, path, tag) {
  try {
    let n = root;
    for (const idx of path) {
      const kids = n.children || [];
      if (idx >= kids.length) return null;
      n = kids[idx];
    }
    return (!tag || n.tagName === tag) ? n : null;
  } catch (e) { return null; }
}
// 滚动锚点 = 视口内第一个可见的带 id 块（服务行/分组/卡片）；重建后校正 dy，抵消上方内容高度变化
function scrollAnchor() {
  try {
    for (const el of document.querySelectorAll("main section[id], main .card")) {
      const top = el.getBoundingClientRect().top;
      if (top >= -2) return {id: el.id, top};
    }
  } catch (e) { /* 无头桩 DOM 无布局 */ }
  return null;
}

function replaceMain(main, html, activeEl) {
  const focusService = activeEl?.closest?.(".svc");
  const focusInfo = activeEl && main.contains(activeEl) && activeEl.tagName !== "BODY"
    ? {path: domPath(focusService || main, activeEl), tag: activeEl.tagName,
       service: focusService?.id, action: activeEl.dataset?.act, id: activeEl.id} : null;
  const anchor = scrollAnchor();
  const preTops = [];
  try { main.querySelectorAll("pre[id]").forEach(pre => preTops.push([pre.id, pre.scrollTop])); } catch (e) {}
  __replacing = true;
  main.innerHTML = html;
  __lastWritten = html;
  __mainDirty = false;
  // 微任务序：本 observer 回调先于标志清除（替换自身的变更不算外部改写）
  Promise.resolve().then(() => { __replacing = false; });
  try {
    for (const [id, top] of preTops) { const pre = document.getElementById(id); if (pre) pre.scrollTop = top; }
    if (anchor && anchor.id && typeof window.scrollBy === "function") {
      const el = document.getElementById(anchor.id);
      if (el && el.getBoundingClientRect) {
        const dy = el.getBoundingClientRect().top - anchor.top;
        if (dy) window.scrollBy(0, dy);
      }
    }
    if (focusInfo) {
      const scope = focusInfo.service ? document.getElementById(focusInfo.service) : main;
      const el = focusInfo.id ? document.getElementById(focusInfo.id)
        : focusInfo.action ? scope?.querySelector(`[data-act="${focusInfo.action}"]`)
        : focusInfo.path && scope ? findByDomPath(scope, focusInfo.path, focusInfo.tag) : null;
      if (el?.focus) el.focus({preventScroll: true});
    }
  } catch (e) { /* 无头桩环境：恢复步骤尽力而为，不阻塞渲染 */ }
}

function renderNav() {
  document.querySelectorAll("nav .navitem").forEach(b => b.classList.remove("active"));
  const map = {"all": "nav-all", "attention": "nav-attention", "removed": "nav-removed",
               "resources": "nav-resources", "agents": "nav-agents", "settings": "nav-settings",
               "new-project": "nav-new-project"};
  (map[view] ? [map[view]] : []).forEach(id => document.getElementById(id)?.classList.add("active"));
  document.getElementById("nav-settings").setAttribute("aria-current", view === "settings" ? "page" : "false");
  const projNav = document.getElementById("navProjects");
  const groups = projectGroups().filter(g => !g.orphan && projectMatchesSearch(g.pj, g.members));
  projNav.innerHTML = groups.map(({pj, members}) => {
    const issues = members.filter(needsAttention);
    const blocked = issues.some(s => s.state !== "partial");
    const alert = issues.length ? (blocked ? tr("需要处理", "Needs attention") : tr("部分可用", "Degraded")) : "";
    return `<button class="navitem project-navitem${view === "project:" + pj.id ? " active" : ""}"
      ${alert ? `aria-label="${esc(pj.name)}，${alert}" title="${alert}"` : ""}
      onclick="setView('project:${esc(pj.id)}')">${pj.favorite ? "★ " : ""}${esc(pj.name)}${alert ? `<span class="project-alert${blocked ? "" : " partial"}" aria-hidden="true"></span>` : ""}</button>`;
  }).join("")
    || `<div class="note" style="padding:2px 10px">${tr("（暂无项目）", "No projects")}</div>`;
  const n = attentionServices().length;
  const badge = document.getElementById("attentionBadge");
  badge.hidden = !n; badge.textContent = n || "";
  const d = draftsData?.drafts?.length || 0;
  const db = document.getElementById("draftBadge");
  db.hidden = !d; db.textContent = d || "";
}

// ------------------------------------------------------------ 服务行（沿用原列表能力）

function copyText(text, key, label) {
  const done = ok => { msgs[key] = ok ? (label || tr("已复制", "Copied")) + " · " + text
      : tr("复制失败（浏览器未授权剪贴板）", "Clipboard access was denied."); render();
    setTimeout(() => { delete msgs[key]; render(); }, 1800); };
  try {
    if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); return; }
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    done(document.execCommand("copy")); ta.remove();
  } catch (e) { done(false); }
}

function domainSettings() { return locoveData?.settings || {use_domains: false, domain_form: "suffix"}; }

function directUrl(p) {
  if (p.open) return p.open;
  const c = (p.components || []).find(x => x.kind === "server" && x.port);
  if (c) return `http://127.0.0.1:${c.port}/`;
  // 兜底：路由事实里的配置端口（停止服务也保留）
  const route = Object.values(locoveData?.routes || {}).find(r => r.service === p.id && r.upstream_port);
  return route ? `http://127.0.0.1:${route.upstream_port}/` : "";
}

function domainChip(p) {
  // V3.5/D3：默认本地 IP 直连；开启域名后显示带端口（:5670）的域名入口
  const st = domainSettings();
  const eps = p.endpoints || [];
  if (st.use_domains) {
    const e = st.domain_form === "custom" ? (eps.find(x => !x.derived) || null) : eps[0];
    if (!e) return "";
    const route = locoveData?.routes?.[e.host];
    const ok = locoveData?.state === "available";
    const served = route && route.state === "proxy";
    const sub = !ok ? tr("域名模块未就绪（仍可直连）", "Domain access unavailable. Use the direct URL.")
      : served ? `:${locoveData?.domain_port || 5670} · ${tr("点击复制", "Click to copy")}`
        : tr("未运行时显示不可用页", "Shows an unavailable page when stopped");
    const url = e.public_url || `http://${e.host}:${locoveData?.domain_port || 5670}${e.open_path}`;
    return `<button class="domain${ok ? "" : " down"}" data-act="copy-address" title="${esc(url)} · ${tr("点击复制", "Click to copy")}"
      onclick="event.stopPropagation();copyText('${esc(url)}','${p.id}')">
      <b>${esc(e.host)}:${locoveData?.domain_port || 5670}</b><small>${esc(sub)}</small></button>`;
  }
  const url = directUrl(p);
  if (!url) return "";
  let label = url;
  try { const u = new URL(url); label = u.host; } catch (err) {}
  return `<button class="domain" data-act="copy-address" title="${esc(url)} · ${tr("点击复制", "Click to copy")}"
    onclick="event.stopPropagation();copyText('${esc(url)}','${p.id}')">
    <b>${esc(label)}</b><small>${tr("本地直连 · 点击复制（域名需在设置中开启）", "Direct URL · Click to copy")}</small></button>`;
}

async function locoveSetting(key, value) {
  const [, res] = await api("POST", "/api/locove/settings", {[key]: value});
  if (res?.ok && locoveData) locoveData.settings = res.settings;
  msgs["locove-settings"] = res?.ok
    ? tr("已保存域名设置。", "Domain settings saved.")
    : tr("无法保存域名设置。", "Could not save domain settings.") + (res?.error ? ` ${res.error}` : "");
  render();
  if (res?.ok) setTimeout(() => { delete msgs["locove-settings"]; render(); }, 2000);
}

function primary(p) {
  if (p.observe_only) return "";
  if (connOk === false || p.state === "unknown") return `<button class="primary" data-act="unknown" disabled>${tr("状态未知", "Unknown")}</button>`;
  const isBusy = busy(p.id) || busy("g-" + p.group) || p.op || ["starting", "stopping", "preparing"].includes(p.state);
  if (isBusy) return `<button class="primary" data-act="busy" disabled>${p.state === "preparing" ? tr("准备环境…", "Preparing…") : p.state === "stopping" || pending[p.id] === "stop" ? tr("停止中…", "Stopping…") : tr("启动中…", "Starting…")}</button>`;
  if (["available", "partial", "external"].includes(p.state))
    return p.can_open ? `<button class="primary" data-act="open" onclick="act('${p.id}','open')">${tr("打开", "Open")}</button>` : "";
  if (["failed", "conflict"].includes(p.state))
    return `<button class="diagnostic-toggle" data-act="reason" aria-expanded="${!!open[p.id]}" onclick="toggleReason('${esc(p.id)}')">${open[p.id] ? tr("收起原因", "Hide details") : tr("查看原因", "View issue")}</button>`;
  return `<button class="primary" data-act="start-open" onclick="act('${p.id}','start',{open:true})">${tr("启动并打开", "Start and open")}</button>`;
}

// R6：次要操作（接管/重试/停止/重启/源码目录）按交互层级收拢进 ⋯ 菜单；
// 行内保留一个主操作 + 稳定的「日志」入口。
function lifecycleMenuItems(sid) {
  const p = servicesById()[sid] || {};
  const dis = busy(p.id) || busy("g-" + p.group) || p.op;
  const items = [];
  if (p.observe_only) {
    for (const a of (p.actions || []))
      items.push({label: a.label || a.id, disabled: !!dis, run: () => act(sid, "action", {name: a.id})});
    return items;
  }
  if (p.can_takeover) items.push({label: tr("接管…", "Take over…"), disabled: !!dis, run: () => askTakeover(sid)});
  if (["failed", "conflict"].includes(p.state) && !p.can_takeover)
    items.push({label: tr("重试", "Retry"), disabled: !!dis, run: () => act(sid, "start", {open: true})});
  if (p.state !== "external" && (p.intent === "running" || p.state !== "stopped"))
    items.push({label: tr("停止", "Stop"), disabled: !!dis, run: () => act(sid, "stop")});
  if (p.intent === "running" && p.state !== "external")
    items.push({label: tr("重启", "Restart"), disabled: !!dis, run: () => act(sid, "restart")});
  return items;
}

async function askTakeover(sid) {
  await showModal({title: "接管外部实例", okText: "接管", danger: true, bodyHtml: `
    <p class="modal-line">接管会停止这个由外部启动的实例，并由本工具从最新源码启动。</p>
    <p class="modal-line">有活动任务时会等空闲再自动接管（届时可在状态行看到提示）。</p>`,
    onOk: async () => { await act(sid, "takeover"); return true; }});
}

// V2.11：折叠区只保留技术明细；移除登记动作已上移到服务行的 ⋯ 菜单（见 serviceMenuItems）
// <!-- 移除入口已移至服务 ⋯ 菜单（V2.11） -->
const EN_COMPONENT_STATE = {
  ready: "Ready", starting: "Starting", unhealthy: "Not ready", stopped: "Stopped",
  backoff: "Waiting to retry", crashed: "Automatic recovery stopped", exited: "Exited",
  unknown: "Unknown", idle: "Idle", ok: "Last run succeeded", failed: "Last run failed",
  pending: "Waiting to run",
};
const EN_CODE_STATE = {
  idle: "Idle", pending: "Update pending", failed: "Update failed", synced: "Up to date",
  unknown: "Unknown", na: "Managed externally",
};

function componentLabel(component) {
  if (component.label === "外部实例运行中") return tr(component.label, "Running externally");
  return tr(component.label, EN_COMPONENT_STATE[component.state] || component.label);
}

function codeLabel(code) {
  return tr(code.label, EN_CODE_STATE[code.state] || code.label);
}

function detailsHtml(p) {
  // R6 详情分层：概览（诊断优先）/ 入口 / 组件 / 依赖 / 日志；技术参数不挤服务行
  const componentAction = c => p.group && c.kind === "server" && c.running && p.state !== "external"
    ? `<button ${p.op || busy(p.id) || busy("g-" + p.group) ? "disabled" : ""} onclick="act('${p.id}','restart',{components:['${c.id}']})">${tr(c.id === "api" ? "仅重启 API" : c.id === "web" ? "仅重启前端" : `仅重启 ${esc(c.name)}`, `Restart ${esc(c.name)}`)}</button>` : "";
  const rows = (p.components || []).map(c =>
    `<tr><td class="k">${esc(c.name)}</td><td>${esc(componentLabel(c))}${c.detail ? "：" + esc(c.detail) : ""}</td>
     <td class="k">${c.kind === "generator" ? (c.last_run ? tr(`最近 ${t(c.last_run)}`, `Last run ${t(c.last_run)}`) : "") : (c.pid ? tr(`pid ${c.pid} · 启动于 ${t(c.started_at)}`, `PID ${c.pid} · Started ${t(c.started_at)}`) : "")}</td>
     <td class="k">${c.code ? esc(codeLabel(c.code)) + (c.code.detail ? "：" + esc(c.code.detail) : "") : ""}</td><td>${componentAction(c)}</td></tr>`).join("");
  const deps = (p.dependencies || []).map(d =>
    `<tr><td class="k">${tr("依赖", "Dependency")} ${esc(d.name)}</td><td>${d.ok ? tr("可用", "Available") : tr("不可用", "Unavailable")}${d.detail ? "：" + esc(d.detail) : ""}</td><td class="k">${d.managed ? "" : tr("外部管理", "Managed externally")}</td><td class="k">${esc(d.note || "")}</td></tr>`).join("");
  const environment = resourcesData?.environments?.find(e =>
    e.contexts?.includes(p.docker_context) && (!p.docker_endpoint || p.docker_endpoint === e.endpoint));
  const canStartEnvironment = p.state === "stopped" && environment && canManageDocker(environment) && environment.state !== "ready";
  const docker = p.docker_context ? `<tr><td class="k">${tr("Docker 运行环境", "Docker environment")}</td>
    <td colspan="3"><button class="link" data-context="${esc(p.docker_context)}" data-endpoint="${esc(p.docker_endpoint || "")}"
      onclick="showDockerEnvironment(this.dataset)">${esc(environment ? dockerEnvironmentName(environment) : p.docker_context)}</button>
      ${environment ? `<span class="note">${esc(dockerEnvironmentState(environment))}</span>` : ""}
      ${canStartEnvironment ? dockerRecoveryAction(environment) : ""}</td></tr>` : "";
  const extra = p.observe_only ? `<tr><td class="k">${tr("状态", "Status")}</td><td colspan="3">${esc(p.detail || "")}</td></tr>` : "";
  const src = `<tr><td class="k">${tr("源码", "Source")}</td><td colspan="3">${esc(p.source)}${p.code && p.code.process_started ? tr(` · 进程启动于 ${t(p.code.process_started)}`, ` · Process started ${t(p.code.process_started)}`) : ""}${p.code && p.code.newest_change ? tr(` · 最近源码修改 ${t(p.code.newest_change)}`, ` · Last source change ${t(p.code.newest_change)}`) : ""}</td></tr>`;
  const intentRow = `<tr><td class="k">${tr("运行意图", "Run intent")}</td><td colspan="3">${p.intent === "running" ? tr("运行", "Running") : tr("停止", "Stopped")}${p.intent_by ? tr(` · 由 ${esc(p.intent_by)} 设置`, ` · Set by ${esc(p.intent_by)}`) : ""}${p.managed_by === "external" ? tr(" · 外部管理", " · Managed externally") : ""}</td></tr>`;
  const problem = ["failed", "conflict", "partial"].includes(p.state);
  const canRetry = ["failed", "conflict"].includes(p.state) && !p.observe_only && !p.can_takeover;
  const retryDisabled = p.op || busy(p.id) || busy("g-" + p.group) || connOk === false;
  const runtimeBlocked = p.intent === "running" && p.error?.docker_environment && !p.op;
  const target = runtimeBlocked && p.error.docker_target;
  const canRecover = target && p.error.docker_profile;
  const canRepair = canRetry && p.intent === "stopped";
  const diagnosisTarget = serviceDiagnosisTarget(p);
  const diagnosis = p.reason || problem ? `<section class="diagnosis${p.state === "partial" || !problem ? " warning" : ""}" id="reason-${esc(p.id)}" tabindex="-1">
    <strong>${esc(p.reason ? p.reason.split("\n", 1)[0] : stateLabel(p) || tr("诊断", "Diagnosis"))}</strong>
    ${p.reason?.includes("\n") ? `<p>${esc(p.reason.slice(p.reason.indexOf("\n") + 1))}</p>` : ""}
    <div class="acts">
      ${canRecover ? dockerRecoveryAction(target, {
        service: p.id, remember: p.docker_autostart === false, label: tr("启动 Colima 并继续", "Start Colima and continue")
      }) : ""}
      ${runtimeBlocked ? `<button class="ghost" ${retryDisabled ? "disabled" : ""}
        onclick="act('${p.id}','stop')">${tr("停止服务", "Stop service")}</button>` : ""}
      ${canRetry && !canRecover ? `<button class="primary" data-act="retry" ${retryDisabled ? "disabled" : ""} onclick="act('${p.id}','start',{open:true})">${tr("重试服务", "Retry service")}</button>` : ""}
      ${problem ? diagnosisAction(diagnosisTarget, retryDisabled) : ""}
      ${canRepair ? `<button data-act="agent-repair" ${retryDisabled ? "disabled" : ""} onclick="wizRepair('${p.id}')">${tr("修复端口…", "Repair port…")}</button>` : ""}
      <button data-act="diagnostic-logs" onclick="loadLogs('${p.id}')">${tr("查看日志", "View logs")}</button>
      <button class="ghost" data-act="copy-diagnosis" onclick="copyDiagnosis('${p.id}')">${tr("复制诊断", "Copy diagnosis")}</button>
    </div>
    ${problem ? diagnosisResult(diagnoses.get(diagnosisKey(diagnosisTarget))) : ""}
  </section>` : "";
  const lg = logs[p.id] !== undefined
    ? `<div class="log-window"><header>stdout / stderr · ${tr("最近 200 行", "Last 200 lines")}</header><pre id="logs-${p.id}">${esc(logs[p.id] || tr("(无日志)", "(No logs)"))}</pre></div>`
    : `<button class="ghost" onclick="loadLogs('${p.id}')">${tr("加载最近日志", "Load recent logs")}</button>`;
  const eps = (p.endpoints || []).map(e => {
    const route = locoveData?.routes?.[e.host];
    const st = !route ? tr("未生成路由", "No route configured") : route.state === "proxy"
      ? tr(`代理中 → 127.0.0.1:${route.upstream_port}`, `Forwards to 127.0.0.1:${route.upstream_port}`) : tr("明确不可用页（503）", "Unavailable (503)");
    return `<tr><td class="k">${tr("入口", "Endpoint")} ${esc(e.id)}</td>
      <td><button class="link" onclick="copyText('${esc(e.public_url)}','${p.id}')" title="${tr("点击复制", "Click to copy")}">${esc(e.public_url)}</button>
        <span class="note"> (${tr("组件", "Component")} ${esc(e.component)} · ${tr("落点", "Path")} ${esc(e.open_path)})</span></td>
      <td class="k">${esc(st)}</td><td><button data-service="${esc(p.id)}" data-host="${esc(e.host)}"
        data-component="${esc(e.component)}" onclick="editEndpointCompatibility(this.dataset)">
        ${tr("入口设置", "Endpoint settings")}</button></td></tr>`;
  }).join("");
  const direct = p.observe_only ? "" : `<tr><td class="k">${tr("直连地址", "Direct URL")}</td><td colspan="3">${esc(p.open || "—")}<span class="note">${tr("（内部端口实现细节；域名形式为 http://域名:5670，在设置中启用）", " (Enable local domain access in Settings.)")}</span></td></tr>`;
  return `<div class="detail" id="detail-${esc(p.id)}" tabindex="-1">
    ${diagnosis}
    ${eps || direct ? `<h4>${tr("入口", "Endpoints")}</h4><div class="table-scroll"><table>${eps}${direct}</table></div>` : ""}
    ${rows ? `<h4>${tr("组件", "Components")}</h4><div class="table-scroll"><table>${rows}</table></div>` : ""}
    ${deps || docker ? `<h4>${tr("依赖", "Dependencies")}</h4><div class="table-scroll"><table>${docker}${deps}</table></div>` : ""}
    <h4>${tr("概览", "Overview")}</h4>
    <div class="table-scroll"><table>${extra}${intentRow}${src}</table></div>
    <h4>${tr("日志", "Logs")}</h4>${lg}
  </div>`;
}

function toggleDetail(id) {
  open[id] = !open[id];
  if (open[id] && servicesById()[id]?.docker_context) loadResources();
  render();
}

function showServiceReason(id) {
  open[id] = true;
  if (servicesById()[id]?.docker_context) loadResources();
  render({preserveLogReading: false});
  const target = document.getElementById("reason-" + id) || document.getElementById("detail-" + id);
  target?.focus({preventScroll: true});
  target?.scrollIntoView({block: "nearest"});
}

function toggleReason(id) {
  if (!open[id]) { showServiceReason(id); return; }
  open[id] = false;
  render({preserveLogReading: false});
  document.getElementById("p-" + id)?.querySelector("[data-act='reason']")?.focus();
}

function copyDiagnosis(id) {
  const p = servicesById()[id];
  if (!p) return;
  const report = [p.name + " · " + stateLabel(p), p.reason,
    ...(p.components || []).map(c => c.name + " · " + componentLabel(c)),
    ...(p.dependencies || []).map(d => d.name + " · " + (d.ok ? tr("可用", "Available") : tr("不可用", "Unavailable")))
  ].filter(Boolean).join("\n");
  copyText(report, id, tr("已复制诊断", "Diagnosis copied"));
}

function serviceRow(p, showProject, singleProject) {
  const code = p.code || {};
  const feedback = msgs[p.id];
  const msg = feedback ? `<p class="msg service-message${feedback.bad ? " bad" : ""}" role="status">${esc(feedback.text || feedback)}</p>` : "";
  const pjName = showProject && registry?.services ? (registry.services.find(s => s.id === p.id)?.project) : null;
  const expanded = !!open[p.id];
  const sub = pjName ? `${tr("项目", "Project")} ${esc(projectName(pjName))}${p.description ? " · " + esc(p.description) : ""}`
    : esc(p.description || (singleProject?.name !== p.name ? singleProject?.name : "") || "");
  const mark = Array.from(p.name || p.id)[0]?.toUpperCase() || "·";
  const state = esc(stateLabel(p));
  const projectControl = singleProject ? `<button class="star${singleProject.favorite ? " on" : ""}" data-act="favorite"
        aria-label="${tr("收藏项目", "Favorite project")}" aria-pressed="${!!singleProject.favorite}" onclick="toggleFav('${esc(singleProject.id)}')">${singleProject.favorite ? "★" : "☆"}</button>` : "";
  return `<section class="svc service-${esc(p.state)}${expanded ? " expanded" : ""}" id="p-${p.id}">
    <div class="line" role="button" tabindex="0" aria-expanded="${expanded}" data-act="details"
         aria-label="${tr("服务", "Service")} ${esc(p.name)}"
         onclick="toggleDetail('${esc(p.id)}')"
         onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();toggleDetail('${esc(p.id)}')}">
      <div class="service-identity"><span class="service-mark" aria-hidden="true">${esc(mark)}</span>
        <div class="name">${esc(p.name)}${sub ? `<small title="${sub}">${sub}</small>` : ""}</div></div>
      <div class="statecell">
        <div class="state s-${p.state}" title="${state}">${state}</div>
        ${domainChip(p)}
        ${["pending", "failed"].includes(code.state)
          ? `<div class="code ${code.state}" title="${esc(codeLabel(code))}：${esc(code.detail || "")}">${esc(codeLabel(code))}</div>` : ""}
      </div>
      <div class="acts" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">
        ${primary(p)}<button class="ghost" data-act="logs" onclick="loadLogs('${esc(p.id)}')" aria-label="${tr("查看日志", "View logs")}">${tr("日志", "Logs")}</button>
        ${projectControl}<button class="kebab" data-act="menu" aria-haspopup="menu" aria-label="${tr("更多操作", "More actions")}" onclick="toggleMenu(event,'${singleProject ? "single:" + esc(singleProject.id) + ":" : "svc:"}${esc(p.id)}')">⋯</button>
      </div>
    </div>${msg}${expanded ? detailsHtml(p) : ""}</section>`;
}

function projectName(pid) { return registry?.registry?.projects?.find(p => p.id === pid)?.name || pid; }

// ------------------------------------------------------------ 视图：全部服务 / 项目

function groupToolbar(gid, members) {
  const busyG = busy("g-" + gid) || members.some(m => m.op || busy(m.id));
  const disabled = busyG || members.some(m => ["unknown", "external", "conflict"].includes(m.state)) ? "disabled" : "";
  const count = members.reduce((n, m) => n + m.components.filter(c => c.kind === "server").length, 0);
  const workspace = members[0]?.group_name || gid;
  const msg = msgs["g-" + gid] ? `<p class="note" role="status">${esc(msgs["g-" + gid])}</p>` : "";
  return `<div class="group-tools" aria-label="${esc(gid)} 工作区">
    <span>${esc(workspace)}</span><div class="acts">
    <button ${disabled} onclick="groupAct('${gid}','start')">启动全部</button>
    <button ${disabled} onclick="groupAct('${gid}','restart')">${busyG ? "工作区操作中…" : `重启全部（${count} 个服务）`}</button>
    <button ${disabled} onclick="if(confirm('停止工作区中的全部服务？'))groupAct('${gid}','stop')">停止全部</button>
    </div></div>${msg}`;
}

function viewAll() {
  if (!snap) return connOk === false
      ? `<div class="empty">控制层不可用，服务状态未知——不代表项目已停止。</div>`
      : `<div class="empty">${tr("加载中…", "Loading…")}</div>`;
  const sys = (snap.system_warnings || []).map(w => `<p class="reason warn">⚠︎ ${esc(w)}</p>`).join("");
  const head = sys + (snap.manifest_error ? `<p class="reason">${esc(snap.manifest_error)}</p>` : "");
  const groups = projectGroups().filter(g => projectMatchesSearch(g.pj, g.members));
  const body = groups.map(({pj, members, orphan}) => {
    const shown = matchesQuery(pj.name) ? members : members.filter(matchesSearch);
    if (!shown.length && members.length) return "";
    const groupIds = [...new Set(shown.filter(m => m.group).map(m => m.group))];
    const slim = !orphan && members.length === 1 && !groupIds.length;
    if (slim) return `<section class="group single" aria-label="项目 ${esc(pj.name)}">${serviceRow(shown[0], false, pj)}</section>`;
    const ghead = `<div class="group-head">
        ${orphan ? "" : `<button class="star${pj.favorite ? " on" : ""}" onclick="toggleFav('${pj.id}')" aria-label="收藏">${pj.favorite ? "★" : "☆"}</button>`}
        <h3>${esc(pj.name)}</h3>
        <span class="note">${tr(`${members.length} 个服务`, `Services: ${members.length}`)}${pj.agent && pj.agent !== "none" ? " · Agent " + esc(pj.agent) : ""}</span>
        ${orphan ? "" : `<div class="acts"><button class="ghost" onclick="setView('project:${esc(pj.id)}')">${tr("项目详情", "Project details")}</button><button class="kebab" aria-haspopup="menu" aria-label="项目菜单（添加服务 / 重新识别 / 重命名 / 移除项目）" onclick="toggleMenu(event,'proj:${esc(pj.id)}')">⋯</button></div>`}
      </div>`;
    return `<section class="group" aria-label="项目 ${esc(pj.name)}">
      ${ghead}
      ${groupIds.map(gid => groupToolbar(gid, shown.filter(m => m.group === gid))).join("")}
      ${shown.map(p => serviceRow(p, false)).join("") || `<div class="empty">${tr("无匹配服务", "No matching services")}</div>`}
    </section>`;
  }).join("");
  if (!groups.length && !(snap.projects || []).length && !document.getElementById("globalSearch").value.trim())
    return head + `<div class="empty"><p>${tr("还没有已登记的服务。", "No services registered yet.")}</p>
      <button class="primary" onclick="setView('new-project')">${tr("添加服务", "Add service")}</button></div>`;
  return head + (body || `<div class="empty">${tr("没有匹配的项目或服务。", "No matching projects or services.")}</div>`);
}

function viewProject(pid) {
  const g = projectGroups().find(x => x.pj.id === pid);
  if (!g) return `<div class="empty">${tr("未找到项目。", "Project not found.")} <button onclick="setView('all')">${tr("返回全部服务", "Back to all services")}</button></div>`;
  const pj = g.pj;
  const id = esc(pj.id);
  const dirs = (pj.directories || []).map(d => `<li>
    <div><span class="muted">${esc(d.role || "source")}</span><code class="mono">${esc(d.path)}</code></div>
    <button class="ghost danger" onclick="removeDir('${id}','${esc(d.id)}')">${tr("解除关联", "Unlink")}</button>
  </li>`).join("");
  const members = g.members.filter(matchesSearch);
  return `<section class="group project-services">
    <div class="group-head">
      <button class="star${pj.favorite ? " on" : ""}" onclick="toggleFav('${id}')" aria-pressed="${!!pj.favorite}" aria-label="${tr("收藏项目", "Favorite project")}">${pj.favorite ? "★" : "☆"}</button>
      <h3>${tr("服务", "Services")}</h3>
      <button class="kebab" aria-haspopup="menu" aria-label="${tr("项目操作", "Project actions")}" onclick="toggleMenu(event,'proj:${id}')">⋯</button>
    </div>
    ${members.map(p => serviceRow(p, false)).join("") || `<div class="empty">${g.members.length ? tr("没有匹配的服务", "No matching services") : tr("此项目暂无已登记服务", "No registered services in this project")}</div>`}
  </section>
  ${projectDockerTest(pj, g.members)}
  <section class="card project-config" aria-labelledby="project-config-title">
    <h3 id="project-config-title">${tr("项目配置", "Project configuration")}</h3>
    <div class="project-settings">
      <div>
        <h4>${tr("运行设置", "Startup settings")}</h4>
        <button aria-pressed="${!!pj.autostart}" onclick="toggleAutostart('${id}', ${!pj.autostart})">
          ${pj.autostart ? tr("自动启动已开启", "Autostart on") : tr("自动启动已关闭", "Autostart off")}
        </button>
        <p class="note">${tr("登录后恢复服务上次的运行意图。", "Restore each service’s previous run intent at login.")}</p>
        <p class="note">${tr("默认 Agent", "Default agent")} · ${esc(pj.agent || tr("未设置", "None"))}</p>
      </div>
      <div>
        <h4>${tr("关联目录", "Linked directories")}</h4>
        ${dirs ? `<ul class="directory-list">${dirs}</ul>` : `<p class="note">${tr("暂无关联目录", "No linked directories")}</p>`}
        <form class="field directory-form" onsubmit="event.preventDefault();addDir('${id}')">
          <input id="projDirInput" placeholder="${tr("/绝对/路径", "/absolute/path")}" aria-label="${tr("新增关联目录", "Directory to link")}">
          <button type="submit">${tr("关联目录", "Link directory")}</button>
          ${nativeBridge() ? `<button type="button" onclick="addViaPicker('${id}')">${tr("选择…", "Choose…")}</button>` : ""}
        </form>
        <p class="note">${tr("解除关联会保留目录和文件。", "Unlinking keeps the directory and its files.")}</p>
      </div>
    </div>
    <p class="note">ID · ${id} · ${tr("修订", "Revision")} ${pj.revision ?? 0}${pj.created_at ? ` · ${tr("创建于", "Created")} ${t(Date.parse(pj.created_at) / 1000)}` : ""}</p>
  </section>`;
}
