function uiLocked() { return !!(modalState || menuState); }
function modalOpen() { return !!modalState; }
function menuOpen() { return !!menuState; }

function projectMenuItems(pid) {
  return [
    {label: "添加服务…", run: () => wizPresetFor(pid, "add")},
    {label: "重新识别", run: () => wizPresetFor(pid, "reanalyze")},
    {label: "重命名", run: () => renameProject(pid)},
    {sep: true},
    {label: "移除项目…", danger: true, run: () => askProjectRemove(pid)},
  ];
}

function serviceMenuItems(sid) {
  const life = lifecycleMenuItems(sid);
  return [
    {label: "编辑", run: () => editService(sid)},
    {label: "日志", run: () => loadLogs(sid)},
    {label: "打开目录", run: () => act(sid, "open-source")},
    ...(life.length ? [{sep: true}, ...life, {sep: true}] : [{sep: true}]),
    {label: "移除登记…", danger: true, run: () => askRemoveService(sid)},
  ];
}

function menuItems(key) {
  if (typeof key === "string" && key.startsWith("proj:")) return projectMenuItems(key.slice(5));
  if (typeof key === "string" && key.startsWith("svc:")) return serviceMenuItems(key.slice(4));
  return [];
}

function openMenu(anchor, items) {
  closeMenu();
  const backdrop = document.createElement("div");
  backdrop.className = "menu-backdrop";
  const el = document.createElement("div");
  el.className = "menu";
  el.setAttribute("role", "menu");
  el.style.position = "absolute";
  (items || []).forEach(it => {
    if (it.sep) { const s = document.createElement("div"); s.className = "menu-sep"; el.appendChild(s); return; }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "menu-item" + (it.danger ? " danger" : "");
    b.setAttribute("role", "menuitem");
    b.textContent = it.label;
    if (it.disabled) b.disabled = true;
    b.onclick = () => { if (it.disabled) return; closeMenu(); if (it.run) it.run(); };
    el.appendChild(b);
  });
  backdrop.onclick = () => closeMenu();
  document.body.appendChild(backdrop);
  document.body.appendChild(el);
  try {  // 锚点旁定位；无布局信息的无头环境退化为固定左上
    const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
    const x = r ? Math.max(8, Math.min(r.left, (window.innerWidth || 1024) - 190)) : 16;
    const y = r ? r.bottom + 6 : 16;
    el.style.left = x + "px";
    el.style.top = y + "px";
  } catch (e) { el.style.left = "16px"; el.style.top = "16px"; }
  menuState = {backdrop, el, anchor};
  try {
    const btns = el.querySelectorAll("button");
    if (btns && btns[0] && btns[0].focus) btns[0].focus();
  } catch (e) { /* 无头环境无焦点 */ }
}

function closeMenu() {
  if (!menuState) return;
  try { menuState.backdrop.remove(); menuState.el.remove(); } catch (e) { /* 已不在树上 */ }
  menuState = null;
}

function toggleMenu(ev, key) {
  const anchor = ev && ev.target;
  if (menuState && anchor && menuState.anchor === anchor) { closeMenu(); return; }
  openMenu(anchor, menuItems(key));
}

// showModal：自绘模态（替代 confirm/prompt）。Esc=取消、Enter=主操作（textarea 除外）、
// Tab 焦点陷阱、aria-modal；onOk 返回 "keep" 时留在同一模态（两步流程复用）。
function showModal(opts) {
  closeMenu();
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const dialog = document.createElement("div");
    dialog.className = "modal";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-modal", "true");
    dialog.setAttribute("aria-label", opts.title || "");
    const head = document.createElement("h3");
    head.textContent = opts.title || "";
    const body = document.createElement("div");
    body.className = "modal-body";
    body.innerHTML = opts.bodyHtml || "";
    const foot = document.createElement("div");
    foot.className = "modal-foot";
    const finish = v => {
      document.removeEventListener("keydown", onKey, true);
      try { overlay.remove(); } catch (e) { /* 已移除 */ }
      if (modalState && modalState.overlay === overlay) modalState = null;
      resolve(v);
      render();
    };
    const okBtn = document.createElement("button");
    const handle = {
      setBody(html) { body.innerHTML = html; try { focusFirst(); } catch (e) { /* 无头 */ } },
      setOkText(t) { okBtn.textContent = t; },
      setOkDanger(d) { okBtn.className = d ? "danger" : "primary"; },
    };
    okBtn.type = "button";
    okBtn.className = opts.danger ? "danger" : "primary";
    okBtn.textContent = opts.okText || "确定";
    okBtn.onclick = async () => {
      try {
        const r = opts.onOk ? await opts.onOk(body, handle) : true;
        if (r === "keep") return;
        finish(true);
      } catch (e) { finish(true); }
    };
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.textContent = opts.cancelText || "取消";
    cancelBtn.onclick = () => finish(false);
    if (!opts.noCancel) foot.appendChild(cancelBtn);
    foot.appendChild(okBtn);
    dialog.appendChild(head); dialog.appendChild(body); dialog.appendChild(foot);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    modalState = {overlay, dialog, okBtn, cancelBtn};

    function focusables() {
      try {
        return Array.from(dialog.querySelectorAll("button, input, select, textarea"))
          .filter(x => !x.disabled);
      } catch (e) { return []; }
    }
    function focusFirst() {
      const f = focusables();
      const t = f.find(x => x.tagName === "INPUT" || x.tagName === "TEXTAREA") || f[0];
      if (t && t.focus) t.focus();
    }
    function onKey(e) {
      if (!modalState || modalState.overlay !== overlay) return;
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
      else if (e.key === "Enter") {
        const t = e.target;
        if (t && (t.tagName === "TEXTAREA" || t.tagName === "BUTTON")) return;  // 多行输入/按钮默认行为
        e.preventDefault(); e.stopPropagation(); okBtn.click();
      } else if (e.key === "Tab") {  // 焦点陷阱：Tab 在模态内循环
        const f = focusables();
        if (!f.length) return;
        e.preventDefault();
        const i = f.indexOf(document.activeElement);
        const next = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
        if (f[next] && f[next].focus) f[next].focus();
      }
    }
    document.addEventListener("keydown", onKey, true);
    try { focusFirst(); } catch (e) { /* 无头环境无焦点 */ }
  });
}

// ---------- 移除对话框（先 remove-preview，取消零副作用） ----------

// 观察项移除（V2 §3.1）：观察项没有受管进程，只解除登记，绝不停止其外部引擎；
// 因此不提供处置选择，固定 keep-external 语义。
async function askRemoveObserve(sid, p) {
  const ok = await showModal({title: "移除观察登记…", danger: true, okText: "移除",
    bodyHtml: `
      <p class="modal-line">对象：<b>${esc(p.name)}</b>（${esc(sid)}，观察项）</p>
      <p class="modal-line">只解除本工具的观察登记；被观察的外部引擎/进程照常运行，不受影响。</p>
      <p class="modal-line muted">恢复方式：lsctl restore ${esc(sid)}，或本页「已移除登记」视图恢复。</p>`,
    onOk: async () => { await doRemove(sid, "keep-external"); return true; }});
  return ok;
}

async function askRemoveService(sid) {
  const p = servicesById()[sid];
  if (!p) return;
  if (p.observe_only) return askRemoveObserve(sid, p);
  let prev = null;
  try {  // 预览端点未就绪（501）时静默降级为已知状态展示
    const [code, res] = await api("GET", `/api/services/${sid}/remove-preview`);
    if (code === 200 && res && res.ok) prev = res;
  } catch (e) { /* 网络异常走降级 */ }
  const pjEntry = (registry?.services || []).find(s => s.id === sid);
  const pjName = pjEntry && pjEntry.project ? projectName(pjEntry.project) : "";
  const running = prev && prev.running_components && prev.running_components.length
      ? prev.running_components
      : (p.intent === "running" && p.state !== "external"
         ? (p.components || []).filter(c => c.kind !== "generator").map(c => c.id) : []);
  const ext = (prev && prev.external_instances) || [];
  const keepDisp = prev && prev.dispositions ? prev.dispositions["keep-external"] : null;
  const keepOff = !!(keepDisp && keepDisp.enabled === false);
  __rmDisp = keepOff ? "stop" : "keep-external";
  const bodyHtml = `
    <p class="modal-line">对象：<b>${esc(p.name)}</b>（${esc(sid)}）</p>
    ${pjName ? `<p class="modal-line">受影响项目：${esc(pjName)}</p>` : ""}
    <p class="modal-line">将停止的实例：${running.length ? esc(running.join("、")) : "（无）"}</p>
    ${ext.length ? `<p class="modal-line">外部实例（照常保留运行）：${esc(ext.join("、"))}</p>` : ""}
    <p class="modal-line">保留内容：${prev && prev.keep && prev.keep.length ? esc(prev.keep.join("、")) : "源码目录、数据库、容器与卷（一律不删除）"}</p>
    <p class="modal-line muted">恢复方式：${esc((prev && prev.restore_hint) || `lsctl restore ${sid}，或本页「已移除登记」视图恢复`)}</p>
    ${prev ? "" : `<p class="modal-line muted">（移除预览暂不可用，以上按已知状态展示）</p>`}
    <div class="field"><label>处置方式</label>
      <label class="radio"><input type="radio" name="rmDisp" value="stop" ${__rmDisp === "stop" ? "checked" : ""} onchange="__rmDisp='stop'"> 停止后移除</label>
      <label class="radio"><input type="radio" name="rmDisp" value="keep-external" ${keepOff ? "disabled" : ""} ${__rmDisp === "keep-external" ? "checked" : ""} onchange="__rmDisp='keep-external'"> 保留为外部实例</label>
    </div>
    ${keepOff ? `<p class="reason warn">无法保留为外部实例：${esc(keepDisp.reason || "仍由本工具 launchd 保活，请选择停止后移除")}</p>` : ""}`;
  let outcome = null;
  const ok = await showModal({title: "移除登记…", bodyHtml, okText: "移除", danger: true,
    onOk: async () => { outcome = await doRemove(sid, __rmDisp); return true; }});
  if (ok && outcome && !(outcome.res && outcome.res.ok)) {
    await showModal({title: "移除失败", okText: "关闭", noCancel: true,
      bodyHtml: `<p class="modal-line">${esc(msgs[sid] || "移除失败")}</p>
                 <p class="modal-line muted">登记保持不变，可重试或改用 lsctl service-remove。</p>`});
  }
}

async function askProjectRemove(pid) {
  const g = projectGroups().find(x => x.pj.id === pid);
  const pj = (g && g.pj) || {id: pid, name: pid};
  let prev = null;
  try {  // 预览端点未就绪（501）时降级为本地已知信息
    const [code, res] = await api("GET", `/api/projects/${pid}/remove-preview`);
    if (code === 200 && res && res.ok) prev = res;
  } catch (e) { /* 网络异常走降级 */ }
  const members = prev && prev.services ? prev.services
      : (g ? g.members : []).map(m => ({id: m.id, name: m.name, state: m.state, external_instances: []}));
  let keepOff = false, keepReason = "";
  if (prev) {
    for (const s of prev.services || []) {
      const d = s.dispositions ? s.dispositions["keep-external"] : null;
      if (d && d.enabled === false) { keepOff = true; keepReason = d.reason || `成员 ${s.id} 仍由本工具 launchd 保活`; }
    }
  }
  __rmDisp = keepOff ? "stop" : "keep-external";
  const memberRows = members.map(s =>
    `<tr><td>${esc(s.id)}</td><td>${esc(s.name || "")}</td><td>${esc(s.state || "—")}</td>
     <td>${(s.external_instances || []).length ? esc(s.external_instances.join("、")) : "—"}</td></tr>`).join("");
  const resRows = ((prev && prev.resources_referenced) || []).map(r =>
    `<tr><td>${esc(r.name)}</td><td>${esc(r.state || "—")}</td><td>${r.shared ? "共享（不动）" : "独占"}</td>
     <td>${esc((r.consumers || []).join("、") || "—")}</td></tr>`).join("");
  const warns = ((prev && prev.warnings) || []).map(w => `<p class="reason warn">⚠︎ ${esc(w)}</p>`).join("");
  const bodyHtml = `
    <p class="modal-line">对象：项目 <b>${esc(pj.name)}</b>（${esc(pid)}，${members.length} 个服务成员）</p>
    ${members.length ? `<p class="modal-line">将按所选处置逐成员移除登记：</p>
      <div class="table-scroll"><table><tr><td class="k">服务</td><td class="k">名称</td><td class="k">状态</td><td class="k">外部实例</td></tr>${memberRows}</table></div>` : `<p class="modal-line">（空项目，直接移除登记）</p>`}
    ${resRows ? `<p class="modal-line">引用的共享资源（一律不动）：</p>
      <div class="table-scroll"><table><tr><td class="k">资源</td><td class="k">状态</td><td class="k">共享</td><td class="k">其他使用方</td></tr>${resRows}</table></div>` : ""}
    <p class="modal-line">保留内容：${prev && prev.kept && prev.kept.length ? esc(prev.kept.join("、")) : "源码目录、数据库、容器与卷（一律不删除）"}</p>
    ${warns}
    <p class="modal-line muted">恢复方式：lsctl project-restore ${esc(pid)}，或本页「已移除登记」视图恢复</p>
    ${prev ? "" : `<p class="modal-line muted">（项目移除预览暂不可用，以上按已知状态展示）</p>`}
    <div class="field"><label>处置方式</label>
      <label class="radio"><input type="radio" name="rmDisp" value="stop" ${__rmDisp === "stop" ? "checked" : ""} onchange="__rmDisp='stop'"> 停止全部后移除</label>
      <label class="radio"><input type="radio" name="rmDisp" value="keep-external" ${keepOff ? "disabled" : ""} ${__rmDisp === "keep-external" ? "checked" : ""} onchange="__rmDisp='keep-external'"> 保留为外部实例</label>
    </div>
    ${keepOff ? `<p class="reason warn">无法保留为外部实例：${esc(keepReason)}</p>` : ""}`;
  let outcome = null;
  const ok = await showModal({title: "移除项目…", bodyHtml, okText: "移除项目", danger: true,
    onOk: async () => { outcome = await execProjectRemove(pid, __rmDisp); return true; }});
  if (!ok) return;
  const res = outcome.res || {};
  if (outcome.code === 200 && res.ok) {
    await showModal({title: "项目已移除", okText: "关闭", noCancel: true,
      bodyHtml: `<p class="modal-line">已移除项目 ${esc(pj.name)}（处置 ${esc(res.disposition || __rmDisp)}）。</p>
        <p class="modal-line muted">成员已归档；源码/数据/共享容器未动。恢复：lsctl project-restore ${esc(pid)}。</p>`});
    return;
  }
  const stopped = (res.stopped || []).join("、") || "—";
  const remaining = (res.remaining || []).map(m => `${m.id}：${m.reason || "未知原因"}`).join("；") || "—";
  await showModal({title: "移除中止", okText: "关闭", noCancel: true,
    bodyHtml: `<p class="modal-line">${esc(res.error || `移除失败（HTTP ${outcome.code}）`)}</p>
      <p class="modal-line">已停止：${esc(stopped)}</p>
      <p class="modal-line">未处理（登记保留）：${esc(remaining)}</p>
      <p class="modal-line muted">已停止的进程不会自动拉起；可重试移除。</p>`});
}

async function execProjectRemove(pid, disposition) {
  try {
    const [code, res] = await api("DELETE", `/api/projects/${pid}?disposition=${disposition}`, undefined);
    return {code, res: res || {}};
  } catch (e) { setConn(false); return {code: 0, res: {error: "无法连接控制服务"}}; }
}

// ---------- 编辑对话框（R05：完整定义保真编辑；dry_run diff → 确认注册，edited 路径入覆盖层） ----------

function editBodyHtml(extra) {
  const e = editState;
  return `
    <p class="modal-line muted">保存流程：先 dry_run 预览与已登记定义的差异，确认后才真正注册；改过的字段将记入覆盖层（edited）。${e.degraded ? "完整定义接口不可用，以下为降级编辑：GUI 看不到当前命令/端口，请按实际定义填写。" : "命令/端口/探针已按当前定义预填；未列出的字段（env、build、worker、compose 等）随注册原样保留，零变化。"}</p>
    <div class="field"><label>名称</label><input value="${esc(e.fields.name)}" oninput="editField('name', this.value)"></div>
    <div class="field"><label>描述</label><input value="${esc(e.fields.description)}" oninput="editField('description', this.value)"></div>
    <div class="field"><label>入口 URL</label><input value="${esc(e.fields.open)}" placeholder="http://127.0.0.1:<端口>/" oninput="editField('open', this.value)"></div>
    ${e.comps.map((c, i) => `<div class="comp-edit">
      <div class="field"><label>组件 ${esc(c.id)}${(c.run || "local") === "compose" ? "（compose）" : ""}</label>
        ${(c.run || "local") === "compose"
          ? `<span class="inline-note">compose 组件（${esc(c.composeService || "?")}）：service/文件/provision 等字段随注册原样保留，无需命令</span>`
          : `<textarea rows="2" placeholder="命令 argv（每行一个参数，如 make↵serve-api）" oninput="editComp(${i}, 'cmd', this.value)">${esc(c.cmd.join("\n"))}</textarea>`}</div>
      <div class="field"><label></label>
        <input style="min-width:80px;max-width:110px" placeholder="端口" value="${c.port ?? ""}" oninput="editComp(${i}, 'port', this.value)">
        <input placeholder="探针 http 路径" value="${esc(c.probe)}" oninput="editComp(${i}, 'probe', this.value)"></div>
    </div>`).join("")}
    ${extra || ""}`;
}

function editField(key, value) { if (editState) editState.fields[key] = value; }
function editComp(i, key, value) {
  if (!editState || !editState.comps[i]) return;
  const c = editState.comps[i];
  if (key === "cmd") c.cmd = String(value).split("\n").map(s => s.trim()).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "probe") c.probe = value;
}

// ---- V2.3/R06 嵌套 dotted path 契约（GUI 与后台同一文法）----
// 组件字段按字段逐个产出：components[<id>].cmd / .port / .ready.http / .env.<KEY>；
// 顶层仅 name / description / open（id/source 等身份字段绝不可覆盖）。
function serviceEditedPaths(cur, orig) {
  const out = [];
  const eq = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  for (const k of ["name", "description", "open"])
    if ((cur[k] ?? "") !== (orig[k] ?? "")) out.push(k);
  const ocomps = (orig && orig.components) || [];
  ((cur && cur.components) || []).forEach((c, i) => {
    const o = ocomps[i] || {};
    const prefix = "components[" + (c.id || o.id) + "]";
    if ((c.cmd || []).join("\n") !== (o.cmd || []).join("\n")) out.push(prefix + ".cmd");
    if ((c.port ?? null) !== (o.port ?? null)) out.push(prefix + ".port");
    if (((c.ready || {}).http || "") !== ((o.ready || {}).http || "")) out.push(prefix + ".ready.http");
    const env = c.env || {}, oenv = o.env || {};
    for (const k of new Set([...Object.keys(env), ...Object.keys(oenv)]))
      if (!eq(env[k], oenv[k])) out.push(prefix + ".env." + k);
  });
  return out;
}

// 编辑对话框当前态 → 与定义快照同构（供 serviceEditedPaths 比较）
function editSnapshot(e) {
  return {name: e.fields.name, description: e.fields.description, open: e.fields.open,
          components: (e.comps || []).map(c => ({id: c.id, cmd: c.cmd || [], port: c.port ?? null,
                                                 ready: c.probe ? {http: c.probe} : null, env: c.env || {}}))};
}

function editedPaths(e) {
  // 与初始值对比生成 dotted paths（V2.3 service.edited：name / components[api].port / components[api].ready.http …）
  return serviceEditedPaths(editSnapshot(e), e.initial || {});
}

// 候选审核卡：用户在审核阶段的编辑（相对识别原始值 _orig）——注册同样携带 edited，
// 使「本次编辑」优先于旧覆盖（R06）。
function candidateEditedPaths(c) {
  return serviceEditedPaths(c, c && c._orig ? c._orig : c);
}

// R05：从完整定义构建注册 service——只有用户在对话框里改掉的值被替换，
// 其余字段（worker/compose/env/build/install/after/依赖…）逐字节保真 ride through。
function editFullService(e) {
  const svc = JSON.parse(JSON.stringify(e.definition || {}));
  svc.id = e.sid;
  svc.name = e.fields.name;
  svc.description = e.fields.description || "";
  svc.open = e.fields.open || null;
  svc.components = (svc.components || []).map(c => {
    const ec = (e.comps || []).find(x => x.id === c.id);
    if (!ec || c.kind === "generator") return c;   // 未在对话框展示：原样保留
    const out = JSON.parse(JSON.stringify(c));
    if ((out.run || "local") === "local") out.cmd = (ec.cmd || []).slice();
    if (ec.port === null || ec.port === undefined || ec.port === "") { if ("port" in out) delete out.port; }
    else out.port = ec.port;
    const rd = Object.assign({}, out.ready || {});
    if (ec.probe) rd.http = ec.probe; else delete rd.http;
    if (Object.keys(rd).length) out.ready = rd; else delete out.ready;
    return out;
  });
  return svc;
}

function editPayload(dryRun) {
  const e = editState;
  const regsvc = (registry?.services || []).find(s => s.id === e.sid);
  const pid = e.projectId || (regsvc && regsvc.project) || "";
  const proj = (registry?.registry?.projects || []).find(x => x.id === pid)
               || {id: pid || e.sid, name: pid || e.sid, revision: 0};
  const svc = editFullService(e);   // R05：完整保真提交（未编辑字段零变化）
  const source = svc.source || (regsvc && regsvc.source) || (servicesById()[e.sid] || {}).source || "";
  const payload = {schemaVersion: 1, revision: proj.revision ?? 0,
                   project: {id: proj.id, name: proj.name, agent: proj.agent || "none"},
                   directories: [{path: source, role: "source"}],
                   by: "gui", service: svc};
  if (!dryRun) payload.service.edited = editedPaths(e);
  if (e._accept_new?.length) payload.service.accept_new = [...new Set(e._accept_new)];
  return payload;
}

// dry_run 预览（含覆盖层命中标注；R06：本次已编辑的字段不再算“覆盖保护”，未编辑的才可「采用新值」）
async function editPreviewStep(handle) {
  const e = editState;
  let code = 0, res = null;
  try { [code, res] = await api("POST", "/api/register", Object.assign(editPayload(true), {dry_run: true})); }
  catch (err) { setConn(false); }
  if (code !== 200 || !res || !res.ok) {
    handle.setBody(editBodyHtml(`<p class="reason warn">dry_run 失败：${esc((res && res.error) || code || "无法连接控制服务")}</p>`));
    return "keep";
  }
  let extra = "";
  if (res.action === "incomplete") {
    extra = `<p class="reason warn">payload 不完整：${esc((res.missing || []).join("、"))}（dry_run 不写草稿）</p>`;
  } else if (res.action === "diff") {
    let overrideFields = [];
    try {  // 覆盖层端点未就绪（404/501）→ 静默降级为普通 diff
      const [oc, o] = await api("GET", `/api/services/${res.service_id}/overrides`);
      if (oc === 200 && o && o.ok) overrideFields = Object.keys(o.fields || {});
    } catch (e2) { /* 不阻塞 diff */ }
    const editedNow = editedPaths(e);
    const rows = (res.diff || []).map(x => {
      const isEdited = editedNow.includes(x.field);
      const isOvr = overrideFields.includes(x.field);
      const cell = isOvr && !isEdited
        ? `<button onclick="editAcceptNew('${esc(x.field)}')">采用新值</button>`
        : isOvr && isEdited
          ? `<span class="inline-note">本次编辑优先（提交值即你的修改，注册后旧覆盖将被更新）</span>` : "";
      return `<tr><td class="k">${esc(x.field)}</td><td>${esc(JSON.stringify(x.old) ?? "")}</td><td>→</td><td>${esc(JSON.stringify(x.new) ?? "")}</td><td>${cell}</td></tr>`;
    }).join("");
    extra = `<p class="inline-note">与已登记服务 ${esc(res.service_id)} 的差异${overrideFields.length ? "（你的覆盖优先生效，但本次编辑优先：仅未编辑且命中覆盖的字段可用「采用新值」）" : ""}：</p>
      <div class="table-scroll"><table>${rows || `<tr><td class="muted">（无差异，注册将返回 unchanged）</td></tr>`}</table></div>`;
  } else {
    extra = `<p class="inline-note">dry_run 结果：${esc(res.action || "?")}</p>`;
  }
  e.confirmed = true;
  handle.setOkDanger(true);
  handle.setOkText("确认注册");
  handle.setBody(editBodyHtml(extra));
  return "keep";
}

// V2.3「采用新值」：接受新识别值、清除该字段的旧覆盖（编辑对话框侧）
function editAcceptNew(field) {
  const e = editState;
  if (!e || !field) return;
  e._accept_new = [...new Set([...(e._accept_new || []), field])];
  if (e._handle) { e.confirmed = false; handleReset(e._handle); editPreviewStep(e._handle); }
}
function handleReset(handle) { handle.setOkDanger(false); handle.setOkText("预览修改（dry_run）"); }

async function editOnOk(body, handle) {
  const e = editState;
  if (!e) return true;
  e._handle = handle;
  if (!e.confirmed) {
    if (e.comps.some(c => (c.run || "local") === "local" && !(c.cmd || []).length)) {
      handle.setBody(editBodyHtml(`<p class="reason warn">本地组件命令为必填（当前值 GUI 不可见，请按实际定义填写后再预览）。</p>`));
      return "keep";
    }
    return await editPreviewStep(handle);
  }
  // 第二步：真正注册（service.edited = 用户改过的 dotted paths → 注册成功后写入覆盖层）
  let code = 0, res = null;
  try { [code, res] = await api("POST", "/api/register", editPayload(false)); }
  catch (err) { setConn(false); res = {error: "无法连接控制服务"}; }
  if (code === 409 && res && res.current_revision != null) {
    await refresh();  // 修订号过期：取最新 revision 重试一次
    try { [code, res] = await api("POST", "/api/register", editPayload(false)); } catch (err) { /* 如实报告 */ }
  }
  msgs[e.sid] = code === 200 && res && res.ok
      ? `已更新（${res.action}；编辑字段已记入覆盖层）` : ((res && res.error) || "注册失败");
  await refresh();
  editState = null;
  return true;
}

async function editService(sid) {
  const p = servicesById()[sid];
  if (!p) return;
  // R05：先取完整当前定义（认证端点），以完整保真对象编辑——不为改名称重写整个启动配置
  let defRes = null;
  try {
    const [code, res] = await api("GET", `/api/services/${sid}/definition`);
    if (code === 200 && res && res.ok) defRes = res;
  } catch (e) { /* 网络异常 → 降级 */ }
  const def = (defRes && defRes.definition) || legacyDefinitionFromSnap(p);
  editState = {sid, confirmed: false, degraded: !defRes,
               definition: def, projectId: defRes?.project_id || null,
               fields: {name: def.name || sid, description: def.description || "", open: def.open || ""},
               comps: (def.components || []).filter(c => c.kind !== "generator")
                 .map(c => ({id: c.id, name: c.name || c.id,
                             run: (c.run === "compose" || c.compose_service) ? "compose" : "local",
                             composeService: c.compose_service || "",
                             cmd: Array.isArray(c.cmd) ? c.cmd.slice() : [],
                             port: c.port ?? null, probe: (c.ready && c.ready.http) || "",
                             env: c.env || null}))};
  if (!editState.comps.length)
    editState.comps = [{id: "main", name: "main", run: "local", probe: "", cmd: [], port: null, env: null}];
  editState.initial = {name: editState.fields.name, description: editState.fields.description,
                       open: editState.fields.open,
                       components: (def.components || [])
                         .filter(c => c.kind !== "generator")
                         .map(c => ({id: c.id, cmd: Array.isArray(c.cmd) ? c.cmd : [],
                                     port: c.port ?? null,
                                     ready: (c.ready && c.ready.http) ? {http: c.ready.http} : null,
                                     env: c.env || {}}))};
  return showModal({title: "编辑服务 " + sid, okText: "预览修改（dry_run）",
                    bodyHtml: editBodyHtml(), onOk: editOnOk});
}

// 定义端点不可用时的降级来源（旧行为：快照只知道组件 id/name——字段需用户手填）
function legacyDefinitionFromSnap(p) {
  const comps = (p.components || []).filter(c => c.kind !== "generator")
    .map(c => ({id: c.id, kind: "server", name: c.name || c.id, cwd: ".", cmd: [], port: null}));
  return {id: p.id, name: p.name || p.id, description: p.description || "", open: "",
          source: p.source || "", components: comps, dependencies: []};
}

// ---------- 已移除登记视图（V2.2 恢复入口） ----------

async function loadRemoved() {
  try {
    const [c, d] = await api("GET", "/api/removed");
    removedData = c === 200 && d && d.ok ? d : {ok: false, error: (d && d.error) || `HTTP ${c}`};
    setConn(true);
  } catch (e) { removedData = {ok: false, error: "无法连接控制服务"}; setConn(false); }
  render();
}

function viewRemoved() {
  if (!removedData) return `<div class="empty">加载中…</div>`;
  if (!removedData.ok) return `<section class="card"><div class="card-head"><h3>已移除登记</h3></div>
    <p class="reason warn" style="margin:0 0 6px">${esc(removedData.error || "不可用")}</p>
    <p class="note">后台可能尚未提供该端点（501）；稍后重试。</p>
    <div class="acts" style="justify-content:flex-start"><button onclick="loadRemoved()">重新加载</button></div></section>`;
  const svcs = (removedData.services || []).map(s => `
    <tr><td style="font-weight:600">${esc(s.sid)}</td><td>${esc(s.project_id || "—")}</td>
        <td>${esc(s.disposition || "")}</td><td>${esc(s.removed_at || "—")}</td>
        <td><label class="radio"><input type="radio" name="ri-${esc(s.sid)}" checked onchange="removedIntents['${esc(s.sid)}']='stopped'">停止</label>
            <label class="radio"><input type="radio" name="ri-${esc(s.sid)}" onchange="removedIntents['${esc(s.sid)}']='running'">运行意图</label></td>
        <td><button class="primary" onclick="restoreService('${esc(s.sid)}')" ${busy("rst-" + s.sid) ? "disabled" : ""}>${busy("rst-" + s.sid) ? "恢复中…" : "恢复"}</button></td></tr>`).join("");
  const projs = (removedData.projects || []).map(p => `
    <tr><td style="font-weight:600">${esc(p.pid)}</td><td>${esc((p.services || []).join(", ") || "—")}</td><td>${esc(p.removed_at || "—")}</td>
        <td><label class="radio"><input type="radio" name="ri-p-${esc(p.pid)}" checked onchange="removedIntents['p:${esc(p.pid)}']='stopped'">停止</label>
            <label class="radio"><input type="radio" name="ri-p-${esc(p.pid)}" onchange="removedIntents['p:${esc(p.pid)}']='running'">运行意图</label></td>
        <td><button class="primary" onclick="restoreProject('${esc(p.pid)}')" ${busy("rst-p-" + p.pid) ? "disabled" : ""}>${busy("rst-p-" + p.pid) ? "恢复中…" : "恢复项目"}</button></td></tr>`).join("");
  const svcTable = svcs ? `<div class="table-scroll"><table>
    <tr><td class="k">服务</td><td class="k">原项目</td><td class="k">处置</td><td class="k">移除时间</td><td class="k">恢复后意图</td><td class="k"></td></tr>${svcs}</table></div>` : "";
  const projTable = projs ? `<div class="table-scroll"><table>
    <tr><td class="k">项目</td><td class="k">成员</td><td class="k">移除时间</td><td class="k">恢复后意图</td><td class="k"></td></tr>${projs}</table></div>` : "";
  return `<section class="card">
    <div class="card-head"><h3>已移除登记</h3><span class="note">恢复绝不自动启动；「运行意图」仅恢复意图，不立即拉起</span></div>
    ${svcTable || projTable ? svcTable + projTable : `<div class="empty">当前没有已移除的登记。</div>`}
  </section>`;
}

async function restoreService(sid) {
  const intent = removedIntents[sid] || "stopped";
  pending["rst-" + sid] = true; render();
  try {
    const [code, res] = await api("POST", `/api/removed/services/${sid}/restore`, {intent});
    msgs[sid] = code === 200 && res && res.ok
        ? `已恢复 ${sid}（意图 ${intent}，未自动启动）` : ((res && res.error) || `恢复失败（HTTP ${code}）`);
  } catch (e) { msgs[sid] = "无法连接控制服务"; setConn(false); }
  pending["rst-" + sid] = null;
  await refresh();
  await loadRemoved();
}

async function restoreProject(pid) {
  const intent = removedIntents["p:" + pid] || "stopped";
  pending["rst-p-" + pid] = true; render();
  try {
    const [code, res] = await api("POST", `/api/removed/projects/${pid}/restore`, {intent});
    msgs["p:" + pid] = code === 200 && res && res.ok
        ? `已恢复项目 ${pid}（意图 ${intent}，未自动启动）` : ((res && res.error) || `恢复失败（HTTP ${code}）`);
  } catch (e) { msgs["p:" + pid] = "无法连接控制服务"; setConn(false); }
  pending["rst-p-" + pid] = null;
  await refresh();
  await loadRemoved();
}

async function wizStartAnalyze(agentOverride, dirOverride) {

async function wizPoll() {
  if (!wiz.jobId) return;
  try {
    const [code, job] = await api("GET", `/api/jobs/${wiz.jobId}`);
    if (code !== 200) return;
    wiz.job = job;
    setConn(true);
    if (job.state === "done") {
      if (wiz.pollTimer) clearInterval(wiz.pollTimer);
      const r = job.result || {};
      const fresh = (r.services || r.candidates || []).map(c => ({...c, _root: wiz.jobDir || wiz.dir,
        _orig: JSON.parse(JSON.stringify(c))}));   // R06：审核期编辑 diff 的原始值基准
      wiz.candidates = wiz.candidates.concat(fresh);   // 多目录：合并候选（同身份注册时去重）
      wiz.unresolved = (wiz.unresolved || []).concat(r.unresolved || []);
      if (wiz.dirs && wiz.dirs.length) {               // 联合识别：继续下一个目录
        const next = wiz.dirs.shift();
        wizStartAnalyze(null, next);

      if (disambiguateIds(wiz.candidates)) wiz.dupIds = true;
      wiz.step = "review";
      await refresh();  // 刷新 registry 拿到最新 revision
      const g = registry?.registry?.projects?.find(p => p.id === wiz.project?.id);
      if (g) wiz.project = g;
      render();
    } else if (job.state === "failed") {
      if (wiz.pollTimer) clearInterval(wiz.pollTimer);
      render();
    } else {
      const stale = document.activeElement?.tagName;
      if (stale !== "INPUT") render();
    }
  } catch (e) { setConn(false); }
}

function wizToggleCand(i) { wiz.candidates[i]._sel = wiz.candidates[i]._sel === false; }
function wizCandField(i, key, value) { wiz.candidates[i][key] = value; }
function wizCompField(i, ci, key, value) {
  const c = wiz.candidates[i].components[ci] = {...wiz.candidates[i].components[ci]};
  if (key === "cmd") c.cmd = value.split(/\s+/).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "ready") c.ready = value ? {http: value} : null;
  // R07：compose 组件参数在候选卡中直接可编辑（不要求 cmd）
  if (key === "compose_service") c.compose_service = value.trim() || null;
  if (key === "compose_project") c.compose_project = value.trim() || null;
  if (key === "compose_files") c.compose_files = value.split(",").map(s => s.trim()).filter(Boolean);
  if (key === "provision") c.provision = value;
}

// ---- V2.7/R07：compose 候选（LocalProcess | Compose 统一表达）----
function compIsCompose(k, c) {
  return !!(k && (k.run === "compose" || k.compose_service ||
    (c && (c.run === "compose" || c.compose_service))));
}
function isComposeCand(c) {
  return !!(c && ((c.components || []).some(k => compIsCompose(k, c)) ||
    c.run === "compose" || c.compose_service));
}
function effectiveProvision(c) {
  for (const k of (c?.components || []))
    if (compIsCompose(k, c)) return k.provision || c.provision || "existing";
  return c?.provision || "existing";
}
function wizConfirmProvision(i, checked) {
  if (wiz.candidates[i]) wiz.candidates[i]._confirmed_provision = !!checked;
  render();
}

// ---- V2.6/R08：资源复用绑定（Goal §6.2：不要求用户手填 container/name/volume）----
async function wizLoadResources() {

  } catch (e) { wiz.resources = []; }

function wizResourceOptions(dep) {
  const scored = (wiz.resources || []).map(r => {
    let why = "";
    if (dep?.volume && (r.volumes || []).includes(dep.volume)) why = why ? why + "/卷" : "卷";
    if (dep?.container && r.name === dep.container) why = why ? why + "/名称" : "名称";
    return {name: r.name, why, r};
  });
  scored.sort((a, b) => (b.why ? 1 : 0) - (a.why ? 1 : 0));   // 匹配项排前，其余按盘点顺序
  return scored.map(({name, why, r}) => ({
    name,
    label: `${name} · ${r.state || "?"}` +
      `${r.compose_project ? " · " + r.compose_project + (r.compose_service ? "/" + r.compose_service : "") : ""}` +
      ` · ${(r.volumes || []).join(",") || "无卷"}` +
      (why ? `（匹配：${why}）` : ""),
  }));
}

// 复用选择：选中容器 → 依赖 container=容器名；命名卷自动带出（声明的卷在容器上则保持）。
// 「不绑定」恢复识别原值（候选携带的 container/volume 不被覆盖）。
function wizBindDependency(i, di, name) {
  const cand = wiz.candidates && wiz.candidates[i];
  const d0 = cand && cand.dependencies && cand.dependencies[di];
  if (!d0) return;
  const d = cand.dependencies[di] = {...d0};
  if (!name) {
    if (d._bindOrig) { d.container = d._bindOrig.container || ""; d.volume = d._bindOrig.volume || ""; }
    d._bind = "";
    render();
    return;
  }
  if (!d._bindOrig) d._bindOrig = {container: d.container || "", volume: d.volume || ""};
  d.container = name;
  const res = (wiz.resources || []).find(r => r.name === name);
  const named = ((res && res.volumes) || []).filter(v => v && !v.startsWith("/"));
  if (!(d.volume && named.includes(d.volume)) && named.length) d.volume = named[0];
  d._bind = name;
  render();
}

// V2.10 多目录候选消歧（R09 修复）：已占用集合 = 全部已登记服务 id ∪ 批内全部候选 id，
// 每个重名候选按出现顺序取下一个空闲后缀（id、id-2、id-3…），分配即从占用集中消费——
// 批内绝无重复，也绝不撞已登记 id。
// 例外：候选与某已登记服务运行身份一致（同 source——GUI 可见的身份信号；cwd/cmd 的
// 完整身份判定在后台 unchanged/duplicate 逻辑）→ 这是再识别/更新路径，保持原 id 不改名，
// 否则会把“更新既有服务”变成“另建一条”。返回是否发生调整。
function sameSource(a, b) {
  const norm = s => String(s || "").replace(/\/+$/, "");
  return !!a && !!b && norm(a) === norm(b);
}
function candSource(c) { return joinDir(c._root || wiz.dir || "", c.source_dir || "."); }

function disambiguateIds(cands) {
  const registered = registry?.services || [];
  const occupied = new Set(registered.map(s => s.id));
  for (const c of (cands || []))
    if (c && typeof c.id === "string" && c.id) occupied.add(c.id);
  const claimed = new Set();   // 本批次中已被先前候选保住/分配的 id
  let adjusted = false;
  for (const c of (cands || [])) {
    if (!c || typeof c.id !== "string" || !c.id) continue;
    const reg = registered.find(s => s.id === c.id);
    if (reg && sameSource(candSource(c), reg.source)) continue;  // 再识别/更新路径：不改名
    if (!reg && !claimed.has(c.id)) { claimed.add(c.id); continue; }   // 首个出现且未登记：保持
    let n = 2, next = c.id + "-" + n;
    while (occupied.has(next) || claimed.has(next)) { n += 1; next = c.id + "-" + n; }
    c.id = next;
    occupied.add(next);
    claimed.add(next);
    adjusted = true;
  }
  return adjusted;
}

function urlPort(u) { try { return new URL(u).port ? parseInt(new URL(u).port, 10) : null; } catch (e) { return null; } }
function joinDir(root, sub) { return sub && sub !== "." ? root.replace(/\/+$/, "") + "/" + sub : root; }

const COMP_FWD_KEYS = ["cwd", "env", "env_files", "required", "start_timeout", "after", "hot",
  "watch", "restart_on", "ignore", "build", "install", "install_when", "install_marker",
  "auto_update", "external_cmd", "external_cwd", "external_cwd_exact", "shell_script"];

function fwdReady(k, port) {
  const r = k.ready;
  if (!r) return port ? {http: `http://127.0.0.1:${port}/`} : null;
  const out = {};
  for (const f of ["http", "tcp", "json_ok", "timeout", "interval"])
    if (r[f] !== null && r[f] !== undefined && r[f] !== "") out[f] = r[f];
  if (port && out.http && urlPort(out.http) && urlPort(out.http) !== port)
    out.http = out.http.replace(`:${urlPort(out.http)}`, `:${port}`);  // 端口改动同步探针
  return Object.keys(out).length ? out : (port ? {http: `http://127.0.0.1:${port}/`} : null);
}

function candPayload(c, proj) {
  const root = c._root || wiz.dir;
  const source = joinDir(root, c.source_dir || ".");
  const compNotes = [];
  const comps = (c.components || []).map(k => {
    const out = {id: k.id, kind: k.kind || "server", name: k.name || k.id};
    if (compIsCompose(k, c)) {
      // V2.7/R07：compose 参数必须转发（run/compose_service/compose_project/compose_files/provision），
      // 组件级值优先、候选级值兜底；run=compose 无本地 cmd（不校验 cmd）。
      out.run = "compose";
      out.cwd = k.cwd || c.cwd || ".";
      out.compose_service = k.compose_service || c.compose_service || null;
      if (!out.compose_service) {
        compNotes.push(`组件 ${k.id} 为 compose 但缺 compose_service，未随注册提交（请补填后重试）`);
        return null;
      }
      if (k.compose_project || c.compose_project) out.compose_project = k.compose_project || c.compose_project;
      if ((k.compose_files || []).length || (c.compose_files || []).length)
        out.compose_files = (k.compose_files || []).length ? k.compose_files : c.compose_files;
      out.provision = k.provision || c.provision || "existing";
    } else {
      out.cmd = k.cmd || [];
      out.cwd = k.cwd || ".";
    }
    if (k.port) out.port = k.port;
    const rd = fwdReady(k, k.port || null);
    if (rd) out.ready = rd;   // 无端口组件的探针（如固定外部端口）同样转发
    for (const f of COMP_FWD_KEYS) {
      const v = k[f];
      if (v !== null && v !== undefined && !(Array.isArray(v) && !v.length)) out[f] = v;
    }
    return out;
  }).filter(Boolean);
  if (compNotes.length && c.unresolved) c.unresolved = c.unresolved.concat(compNotes);
  const depNotes = [];
  const deps = (c.dependencies || []).map(d => {
    const out = {name: d.name};
    if (d.probe && (d.probe.http || d.probe.tcp)) {
      out.probe = {};
      for (const f of ["http", "tcp", "json_ok", "timeout"])
        if (d.probe[f]) out.probe[f] = d.probe[f];
    } else {
      // 注册校验要求依赖探针含 http/tcp：不静默丢弃，转为待人工确认
      depNotes.push(`依赖 ${d.name} 缺少 http/tcp 探针，未随注册提交`);
      return null;
    }
    for (const f of ["affects", "required", "container", "volume", "note"])
      if (d[f] !== null && d[f] !== undefined && d[f] !== "") out[f] = d[f];   // R08：复用绑定结果随注册提交
    return out;
  }).filter(Boolean);
  if (depNotes.length && c.unresolved) c.unresolved = c.unresolved.concat(depNotes);
  const svc = {id: c.id, name: c.name, description: c.description || "", source,
               open: c.open || null,
               evidence: {agent: wiz.agent, summary: (c.evidence?.summary) || "agent 识别候选",
                          files: c.evidence?.files || [], unresolved: c.unresolved || []},
               components: comps};
  if (deps.length) svc.dependencies = deps;
  if (comps.some(x => x.run === "compose") && c._confirmed_provision)
    svc.confirmed_provision = true;   // R07：仅当用户勾选「允许创建容器/拉镜像」才携带
  const edited = candidateEditedPaths(c);
  if (edited.length) svc.edited = edited;   // R06/V2.3：审核期编辑随注册携带（本次编辑优先于旧覆盖）
  if (c._accept_new?.length) svc.accept_new = [...new Set(c._accept_new)];  // V2.3：显式清除指定覆盖
  return {schemaVersion: 1, revision: wiz.project?.revision || 0,
          project: {id: proj.id, name: proj.name, agent: wiz.agent || proj.agent || "none"},
          directories: [{path: root, role: "source"}],
          by: "gui", service: svc};
}

async function wizRegisterOnce(i) {
  const c = wiz.candidates[i];
  const [code, res] = await api("POST", "/api/register", candPayload(c, wiz.project));
  if (code === 409) {  // 批量注册：用服务端最新 revision 重试一次，不静默失败
    await refresh();
    const g = registry?.registry?.projects?.find(p => p.id === wiz.project.id);
    if (g) wiz.project = g;
    return await api("POST", "/api/register", candPayload(c, wiz.project));
  }
  return [code, res];
}

async function wizRegister() {
  if (!wiz.project) return;
  pending["wiz-reg"] = true; wiz.registering = true; render();
  for (let i = 0; i < wiz.candidates.length; i++) {
    const c = wiz.candidates[i];
    if (c._sel === false) continue;
    // R07：provision=up 未确认 → 后台必 400；GUI 先解释并拦下该条（其余候选不受影响）
    if (isComposeCand(c) && effectiveProvision(c) === "up" && !c._confirmed_provision) {
      wiz.results[i] = {code: 400, res: {error: "provision=up 需先勾选「允许创建容器/拉镜像——由我确认」（后台同样拒绝未确认的 up）"}};
      continue;
    }
    try {
      const [code, res] = await wizRegisterOnce(i);
      wiz.results[i] = {code, res};
      if (res?.revision != null && wiz.project) wiz.project.revision = res.revision;  // 后续候选不再撞修订号
    } catch (e) { wiz.results[i] = {code: 0, res: {error: "无法连接控制服务"}}; setConn(false); }
  }
  wiz.registering = false; pending["wiz-reg"] = null;
  await refresh(); render();
}

async function wizPrefetchDiff(i) {
  const c = wiz.candidates[i];
  if (!c || wiz.diffs[i] || !wiz.project) return;
  try {
    const payload = candPayload(c, wiz.project);
    const [code, res] = await api("POST", "/api/register", {...payload, dry_run: true});
    if (code === 200) {
      // V2.3：diff 命中已登记服务时取其覆盖层（端点未就绪/404/501 → 静默降级）
      if (res && res.action === "diff" && res.service_id) {
        try {
          const [oc, o] = await api("GET", `/api/services/${res.service_id}/overrides`);
          if (oc === 200 && o && o.ok) res.overrideFields = Object.keys(o.fields || {});
        } catch (e2) { /* 覆盖层获取失败不阻塞 diff */ }
      }
      wiz.diffs[i] = res;
      render();
    }
  } catch (e) { /* 差异预览失败不阻塞注册 */ }
}

// V2.3「采用新值」：把字段加入候选的 accept_new，刷新该候选的 dry_run diff
function wizAcceptNew(i, field) {
  const c = wiz.candidates && wiz.candidates[i];
  if (!c || !field) return;
  c._accept_new = [...new Set([...(c._accept_new || []), field])];
  delete wiz.diffs[i];
  wizPrefetchDiff(i);   // 重新预览（应用覆盖后的 diff = 实际）
  render();
}

async function wizStartService(sid) {
  pending["wiz-start-" + sid] = true; render();
  try { await api("POST", `/api/projects/${sid}/start`, {open: true}); setConn(true); }
  catch (e) { setConn(false); }
  pending["wiz-start-" + sid] = null;
  await refresh(); render();
}

function wizStartManual() {
  wiz.manual = true;
  if (wiz.step === "dir") wiz.step = "review";
  if (!wiz.manualService) {
    const name = (wiz.name || wiz.dir.split("/").filter(Boolean).pop() || "service").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "service";
    wiz.manualService = {id: name, name: wiz.name || name, source: wiz.dir, open: "",
                         components: [{id: "main", kind: "server", name: "main", cmd: [], cwd: ".", port: null, ready: null}]};
  }
  render();
}
function wizManualField(key, value) { wiz.manualService[key] = value; }
function wizManualComp(i, key, value) {
  const c = wiz.manualService.components[i] = {...wiz.manualService.components[i]};
  if (key === "cmd") c.cmd = value.split(/\s+/).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "ready") c.ready = value ? {http: value} : null;
}
function wizManualAddComp() {
  const n = wiz.manualService.components.length + 1;
  wiz.manualService.components.push({id: "comp" + n, kind: "server", name: "comp" + n, cmd: [], cwd: ".", port: null, ready: null});
  render();
}

async function ensureWizProject() {
  if (wiz.project) return wiz.project;
  const dir = (wiz.dir || "").trim();
  const name = (wiz.name || dir.split("/").filter(Boolean).pop() || "").trim();
  if (!dir || !name) { msgs["wiz-manual"] = {text: "请先填写项目目录与名称", bad: true}; render(); return null; }
  const [code, res] = await api("POST", "/api/projects", {name, directories: [{path: dir, role: "source"}], agent: wiz.agent || "none"});
  if (code === 200 && res.ok) { wiz.project = res.project; return res.project; }
  msgs["wiz-manual"] = {text: res?.error || "创建项目失败", bad: true};
  return null;
}

async function wizManualRegister() {
  const proj = await ensureWizProject();
  if (!proj) { render(); return; }
  const m = wiz.manualService;
  if (!m.id || !m.name || !m.source || !m.components.length) {
    msgs["wiz-manual"] = {text: "id / 名称 / 源码目录 / 至少一个组件为必填", bad: true}; render(); return;
  }
  const comps = m.components.map(k => {
    const out = {id: k.id, kind: k.kind || "server", name: k.name || k.id, cmd: k.cmd || [], cwd: k.cwd || "."};
    if (k.port) { out.port = k.port; out.ready = k.ready?.http && urlPort(k.ready.http) === k.port ? {http: k.ready.http} : {http: `http://127.0.0.1:${k.port}/`}; }
    return out;
  });
  const payload = {schemaVersion: 1, revision: proj.revision || 0,
                   project: {id: proj.id, name: proj.name, agent: wiz.agent || "none"},
                   directories: [{path: wiz.dir, role: "source"}], by: "gui",
                   service: {id: m.id, name: m.name, description: "", source: m.source, open: m.open || null,
                             evidence: {agent: "none", summary: "手动登记"}, components: comps}};
  pending["wiz-manual"] = true; msgs["wiz-manual"] = null; render();
  try {
    const [code, res] = await api("POST", "/api/register", payload);
    wiz.manualResult = {code, res};
    msgs["wiz-manual"] = code === 200 ? {text: `已注册（${res.action}）`} : null;
    if (code === 409 && res?.current_revision != null && wiz.project) wiz.project.revision = res.current_revision;
  } catch (e) { wiz.manualResult = {code: 0, res: {error: "无法连接控制服务"}}; setConn(false); }
  pending["wiz-manual"] = null;
  await refresh(); render();
}

// ------------------------------------------------------------ 原生入口（macOS 主窗口菜单调用）

window.lsOpenView = function(v) { setView(v); };
window.lsShowLogs = function(id) { setView("all"); loadLogs(id); };
window.lsFocusService = function(id) {
  view = "all"; open[id] = true; render();
  requestAnimationFrame(() => document.getElementById("p-" + id)?.scrollIntoView({block: "center"}));
};
// W2：从菜单栏「查看原因」直达诊断行（展开 + 聚焦 + 滚动到诊断，与浏览器内路径同一函数）
window.lsDiagnose = function(id) {
  view = "all"; open[id] = true;
  showServiceReason(id);
};

// ------------------------------------------------------------ 刷新循环

function setView(v) {
  view = v;
  if (v === "resources") loadResources();
  if (v === "agents") loadAgents();
  if (v === "removed") loadRemoved();
  if (v === "new-project") {
    if (!agentsData) loadAgents();
    if (!draftsData) loadDrafts();   // R6：草稿随添加流程展示
  }
  render();
}

async function refresh(manual) {
  try {
    if (manual) { const [, r] = await api("POST", "/api/refresh"); }
    const [code, snapNew] = await api("GET", "/api/status");
    if (code !== 200 || !snapNew) throw new Error(snapNew?.error || "status failed");
    snap = snapNew;
    const [rc, reg] = await api("GET", "/api/registry");
    if (rc === 200 && reg?.ok) registry = reg;
    try {  // V3.5：chip 依赖 settings/routes，随刷新一并等待，避免渲染竞态
      const [lc, lv] = await api("GET", "/api/locove");
      if (lc === 200 && lv) locoveData = lv;
    } catch (e) { /* 域名面不可用不阻塞状态刷新 */ }
    if (!agentCandidates) loadCandidates().then(render);
    setConn(true);
    if (draftsData) loadDrafts();
  } catch (e) {
    setConn(false);
    if (snap) for (const p of snap.projects) { p.state = "unknown"; p.label = "未知"; p.op = null; p.can_open = false; p.reason = ""; }
  }
  render();
}

document.getElementById("globalSearch").addEventListener("input", render);
// ⋯ 菜单键盘可达：Esc 关闭，↑/↓ 在菜单项间移动（V2.11）
document.addEventListener("keydown", e => {
  if (!menuState) return;
  if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  let btns = [];
  try { btns = Array.from(menuState.el.querySelectorAll("button")); } catch (err) { return; }
  if (!btns.length) return;
  e.preventDefault();
  const i = btns.indexOf(document.activeElement);
  const next = e.key === "ArrowDown" ? (i + 1) % btns.length : (i <= 0 ? btns.length - 1 : i - 1);
  if (btns[next] && btns[next].focus) btns[next].focus();
});
// W1/W2 深链：#p-<id> 载入即展开定位该服务（浏览器书签 / 原生 / Agent 同一事实源）
{ const m = location.hash.match(/^#p-(.+)$/); if (m) open[m[1]] = true; }
refresh();
// UX2（review 2026-11-05）：日志区是 .detail 内的 <pre>（不再是旧 details[open]）。
// 悬停阅读或正持有文本选区时暂停轮询刷新与后台重建——整树 innerHTML 替换会打断
// 选择、焦点与滚动位置；离开/释放选区后下一周期自动恢复。render() 也引用本函数，
// 函数声明提升保证可用。
function logReading() {
  const pre = document.querySelector(".detail pre:hover");
  if (pre) return true;
  if (typeof window.getSelection !== "function") return false;  // 无头/精简 DOM 无选区 API
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) {
    for (let n = sel.anchorNode; n; n = n.parentElement)
      if (n.tagName === "PRE" && n.closest(".detail")) return true;
  }
  return false;
}
setInterval(() => { if (!logReading()) refresh(); }, 3000);
