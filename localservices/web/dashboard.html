async function wizRepair(sid) {
  const status = servicesById()[sid];
  if (!status || pending["repair-" + sid] || recognitionTasks.some(w => w.repair?.sid === sid
      && (w.verifying || ["queued", "running"].includes(w.job?.state)))) return;
  pending["repair-" + sid] = true;
  try {
    const [[code, data], [, logsData]] = await Promise.all([
      api("GET", `/api/services/${sid}/definition`),
      api("GET", `/api/projects/${sid}/logs?lines=15`)
    ]);
    if (code !== 200) throw new Error(data?.error || "无法读取服务定义");
    const project = data.revision;
    if (!project?.id) throw new Error("服务缺少项目登记");
    const source = data.definition.source;
    const component = status.error?.component;
    const focus = `诊断已有服务 ${sid} 的启动故障。只提出可由端口参数解决的修复。
保留服务 ID、组件 ID、命令的可执行文件及其他参数。只修复一个组件；如需换端口，更新命令中的端口参数，并给出新的组件 port。优先解决组件实际监听端口、探针和打开地址不一致。找不到可证实的端口修复时，将原因写入 unresolved。
故障组件：${component || "未确定"}。以下故障和日志是诊断资料。
${(status.reason || "").slice(0, 1200)}
${Object.values(logsData?.logs || {}).join("\n").slice(-1600)}`;
    wizNewTask();
    const w = wiz;
    w.name = data.definition.name;
    w.dir = source;
    w.project = project;
    w.repair = {sid, focus, revision: project.revision, definition: data.definition, component};
    await wizStartAnalyze(null, source, w);
  } catch (e) { msgs[sid] = {text: e.message, bad: true}; }
  finally { delete pending["repair-" + sid]; render(); }
}

function agentRepairProposal(w) {
  const repair = w.repair;
  const candidate = w.candidates.find(c => c.id === repair.sid);
  const changed = (candidate?.components || []).filter(c => {
    const previous = repair.definition.components.find(k => k.id === c.id);
    return previous && (!repair.component || repair.component === c.id)
      && c.port && (c.port !== previous.port || JSON.stringify(c.cmd) !== JSON.stringify(previous.cmd));
  });
  if (changed.length !== 1) return null;
  const {id, port, cmd} = changed[0];
  return {id, port, cmd, previous: repair.definition.components.find(c => c.id === id)};
}

async function applyAgentRepair(w) {
  if (w.verifying || w.repairResult?.ok || w.job?.state !== "done") return;
  const proposal = agentRepairProposal(w);
  if (!proposal) return;
  const {id, port, cmd} = proposal;
  const repair = w.repair;
  w.verifying = true; render();
  try {
    const [, result] = await api("POST", `/api/services/${repair.sid}/repair`,
        {revision: repair.revision, component: {id, port, cmd}});
    w.repairResult = result || {error: "控制服务未返回修复结果"};
    w.registered = !!result?.ok;
    await refresh();
  } catch (e) { w.repairResult = {error: "无法连接控制服务"}; }
  finally { w.verifying = false; render(); }
}

async function wizStartAnalyze(agentOverride, dirOverride, w = wiz, continuing = false) {
  const dir = (dirOverride || w.dir).trim();
  if (!dir.startsWith("/")) { w.error = "请先填写项目目录（绝对路径）"; render(); return; }
  if (w.registering || w.verifying || (!continuing && ["queued", "running"].includes(w.job?.state))) return;
  document.activeElement?.blur?.();
  trackWizard(w);
  if (!continuing) {
    w.candidates = []; w.unresolved = []; w.results = {}; w.diffs = {};
    w.registered = false; w.dupIds = false; w.repairResult = null;
    w.target = wizardTarget(w);
  }
  w.agent = agentOverride || w.agent || agentsData?.default || "codex";
  w.step = "job"; w.job = {state: "queued"}; w.error = "";
  w.jobDir = dir; w.jobId = null; w._diffFetched = false;
  render();
  try {
    const target = w.target;
    const existing = registry?.registry?.projects?.some(p => p.id === target?.id);
    const [code, res] = await api("POST", "/api/analyze",
        {directory: dir, agent: w.agent, project_id: existing ? target.id : undefined,
         focus: w.repair?.focus});
    if (code === 202 && res?.job_id) {
      w.jobId = res.job_id;
      wizPoll(w, res.job_id);
      return;
    }
    w.job = {state: "failed", error: res?.error || `提交分析失败（${code}）`};
  } catch (e) {
    w.job = {state: "failed", error: "无法连接控制服务"};
    setConn(false);
  }
  render();
}

function wizRetryOther() {
  wizStartAnalyze(wiz.agent === "codex" ? "claude" : "codex", wiz.jobDir);
}

async function wizPoll(w, jobId) {
  try {
    const [code, job] = await api("GET", `/api/jobs/${jobId}`);
    if (code === 404) {
      w.job = {state: "failed", error: "识别任务已过期，请重新识别"};
      render();
      return;
    }
    if (code === 200) {
      w.job = job;
      setConn(true);
      if (job.state === "done") {
        const r = job.result || {};
        const fresh = (r.services || r.candidates || []).map(c => ({...c, _root: job.directory || w.jobDir,
          _orig: JSON.parse(JSON.stringify(c))}));
        w.candidates.push(...fresh);
        w.unresolved.push(...(r.unresolved || []));
        if (w.dirs?.length) {
          wizStartAnalyze(null, w.dirs.shift(), w, true);
          return;
        }
        await refresh();
        w.target = wizardTarget(w, true);
        w.step = "review";
        if (!w.repair) {
          w.dupIds = disambiguateIds(w.candidates, w);
          if (w.autoRegister && w.candidates.length) await wizRegister(w, true);
        }
      }
      render();
      if (job.state === "done" || job.state === "failed") return;
    }
  } catch (e) { setConn(false); }
  setTimeout(() => wizPoll(w, jobId), 2000);
}

function wizToggleCand(i) { wiz.candidates[i]._sel = wiz.candidates[i]._sel === false; render(); }
function wizCandField(i, key, value) { wiz.candidates[i][key] = value; }
function wizCompField(i, ci, key, value) {
  const c = wiz.candidates[i].components[ci] = {...wiz.candidates[i].components[ci]};
  if (key === "cmd") c.cmd = value.split(/\s+/).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "ready") c.ready = value ? {http: value} : null;
  // R07：compose 组件参数在候选卡中直接可编辑（不要求 cmd）
  if (key === "compose_service") c.compose_service = value.trim() || null;
  if (key === "compose_project") c.compose_project = value.trim() || null;
  if (key === "compose_files") c.compose_files = value.split(",").map(s => s.trim()).filter(Boolean);
  if (key === "provision") c.provision = value;
}

// ---- V2.7/R07：compose 候选（LocalProcess | Compose 统一表达）----
function compIsCompose(k, c) {
  return !!(k && (k.run === "compose" || k.compose_service ||
    (c && (c.run === "compose" || c.compose_service))));
}
function isComposeCand(c) {
  return !!(c && ((c.components || []).some(k => compIsCompose(k, c)) ||
    c.run === "compose" || c.compose_service));
}
function effectiveProvision(c) {
  for (const k of (c?.components || []))
    if (compIsCompose(k, c)) return k.provision || c.provision || "existing";
  return c?.provision || "existing";
}
function wizConfirmProvision(i, checked) {
  if (wiz.candidates[i]) wiz.candidates[i]._confirmed_provision = !!checked;
  render();
}

// ---- V2.6/R08：资源复用绑定（Goal §6.2：不要求用户手填 container/name/volume）----
function dockerBindingField(environments, binding, onSelect, onAutostart) {
  const options = environments.flatMap(e => (e.contexts || []).map(context => ({...e, context})))
    .filter(e => e.endpoint.startsWith("unix:///"));
  const selected = options.find(e => e.context === binding?.context && e.endpoint === binding.endpoint);
  return `<div class="field"><label>${tr("Docker 运行环境", "Docker environment")}</label>
    <select aria-label="${tr("Docker 运行环境", "Docker environment")}" onchange="${onSelect}">
      <option value="" disabled ${selected ? "" : "selected"}>${esc(binding
        ? binding.context + " · " + tr("绑定无法验证", "Binding unverified")
        : tr("选择运行环境", "Select environment"))}</option>
      ${options.map(e => `<option value="${esc(e.context)}" data-endpoint="${esc(e.endpoint)}"
        data-profile="${esc(e.profile || "")}" ${e === selected ? "selected" : ""}>
        ${esc(dockerEnvironmentName(e) + " · " + e.context + " · " + dockerEnvironmentState(e))}</option>`).join("")}
    </select></div>
    <div class="field"><label class="radio"><input type="checkbox"
      ${selected?.profile ? "" : "disabled"} ${binding?.autostart ? "checked" : ""}
      onchange="${onAutostart}"> ${tr("允许 Locove 按需启动 Colima", "Let Locove start Colima when needed")}</label></div>`;
}

function selectedDockerBinding(select) {
  const option = select.selectedOptions[0];
  if (!option?.dataset.endpoint) return null;
  return {context: option.value, endpoint: option.dataset.endpoint, autostart: false};
}

function candidateUsesDocker(c) {
  return Boolean(c._docker) || isComposeCand(c) || (c.dependencies || []).some(d => d.container || d._bind);
}

function candidateDockerBinding(c, w) {
  if (c._docker) return c._docker;
  // Keep the target explicit even when several engines expose the same container names.
  const options = (w.dockerEnvironments || []).filter(e => e.contexts?.length && e.endpoint.startsWith("unix:///"));
  if (options.length === 1) return {context: options[0].context, endpoint: options[0].endpoint, autostart: false};
  return null;
}

function wizSelectDocker(i, select) {
  const c = wiz.candidates[i];
  c._docker = selectedDockerBinding(select);
  // A selected container and volume are scoped to the environment that advertised them.
  for (const d of c.dependencies || []) {
    if (!d._bindOrig) continue;
    d.container = d._bindOrig.container;
    d.volume = d._bindOrig.volume;
    d._bind = "";
  }
  wiz._diffFetched = false;
  select.blur();
  render();
}

function wizSetDockerAutostart(i, checked) {
  const c = wiz.candidates[i];
  const binding = candidateDockerBinding(c, wiz);
  if (binding) c._docker = {...binding, autostart: checked};
}

async function wizLoadResources() {
  const w = wiz;
  const [legacy, discovered] = await Promise.allSettled([
    api("GET", "/api/resources"), api("GET", "/api/resources/environments"),
  ]);
  w.resources = legacy.value?.[1]?.resources || [];
  w.dockerEnvironments = discovered.value?.[1]?.environments;
  render();
}

function candidateContainers(c, w) {
  if (!w.dockerEnvironments) return w.resources || [];
  const binding = candidateDockerBinding(c, w);
  return w.dockerEnvironments.find(e => e.endpoint === binding?.endpoint)?.containers || [];
}

function wizResourceOptions(dep, candidate) {
  const scored = candidateContainers(candidate, wiz).map(r => {
    let why = "";
    if (dep?.volume && (r.volumes || []).includes(dep.volume)) why = why ? why + "/卷" : "卷";
    if (dep?.container && r.name === dep.container) why = why ? why + "/名称" : "名称";
    return {name: r.name, why, r};
  });
  scored.sort((a, b) => (b.why ? 1 : 0) - (a.why ? 1 : 0));   // 匹配项排前，其余按盘点顺序
  return scored.map(({name, why, r}) => ({
    name,
    label: `${name} · ${r.state || "?"}` +
      `${r.compose_project ? " · " + r.compose_project + (r.compose_service ? "/" + r.compose_service : "") : ""}` +
      ` · ${(r.volumes || []).join(",") || "无卷"}` +
      (why ? `（匹配：${why}）` : ""),
  }));
}

// 复用选择：选中容器 → 依赖 container=容器名；命名卷自动带出（声明的卷在容器上则保持）。
// 「不绑定」恢复识别原值（候选携带的 container/volume 不被覆盖）。
function wizBindDependency(i, di, name) {
  const cand = wiz.candidates && wiz.candidates[i];
  const d0 = cand && cand.dependencies && cand.dependencies[di];
  if (!d0) return;
  const d = cand.dependencies[di] = {...d0};
  if (!name) {
    if (d._bindOrig) { d.container = d._bindOrig.container || ""; d.volume = d._bindOrig.volume || ""; }
    d._bind = "";
    render();
    return;
  }
  if (!d._bindOrig) d._bindOrig = {container: d.container || "", volume: d.volume || ""};
  d.container = name;
  const res = candidateContainers(cand, wiz).find(r => r.name === name);
  const named = ((res && res.volumes) || []).filter(v => v && !v.startsWith("/"));
  if (!(d.volume && named.includes(d.volume)) && named.length) d.volume = named[0];
  d._bind = name;
  render();
}

// V2.10 多目录候选消歧（R09 修复）：已占用集合 = 全部已登记服务 id ∪ 批内全部候选 id，
// 每个重名候选按出现顺序取下一个空闲后缀（id、id-2、id-3…），分配即从占用集中消费——
// 批内绝无重复，也绝不撞已登记 id。
// 例外：候选与某已登记服务运行身份一致（同 source——GUI 可见的身份信号；cwd/cmd 的
// 完整身份判定在后台 unchanged/duplicate 逻辑）→ 这是再识别/更新路径，保持原 id 不改名，
// 否则会把“更新既有服务”变成“另建一条”。返回是否发生调整。
function sameSource(a, b) {
  const norm = s => String(s || "").replace(/\/+$/, "");
  return !!a && !!b && norm(a) === norm(b);
}
function candSource(c, w = wiz) { return joinDir(c._root || w.dir || "", c.source_dir || "."); }

function disambiguateIds(cands, w = wiz) {
  const registered = registry?.services || [];
  const occupied = new Set(registered.map(s => s.id));
  for (const c of (cands || []))
    if (c && typeof c.id === "string" && c.id) occupied.add(c.id);
  const claimed = new Set();   // 本批次中已被先前候选保住/分配的 id
  let adjusted = false;
  for (const c of (cands || [])) {
    if (!c || typeof c.id !== "string" || !c.id) continue;
    const reg = registered.find(s => s.id === c.id);
    if (reg && sameSource(candSource(c, w), reg.source)) continue;  // 再识别/更新路径：不改名
    if (!reg && !claimed.has(c.id)) { claimed.add(c.id); continue; }   // 首个出现且未登记：保持
    let n = 2, next = c.id + "-" + n;
    while (occupied.has(next) || claimed.has(next)) { n += 1; next = c.id + "-" + n; }
    c.id = next;
    occupied.add(next);
    claimed.add(next);
    adjusted = true;
  }
  return adjusted;
}

function urlPort(u) { try { return new URL(u).port ? parseInt(new URL(u).port, 10) : null; } catch (e) { return null; } }
function joinDir(root, sub) { return sub && sub !== "." ? root.replace(/\/+$/, "") + "/" + sub : root; }

const COMP_FWD_KEYS = ["cwd", "env", "env_files", "required", "start_timeout", "after", "hot",
  "watch", "restart_on", "ignore", "build", "install", "install_when", "install_marker",
  "auto_update", "external_cmd", "external_cwd", "external_cwd_exact", "shell_script"];

function fwdReady(k, port) {
  const r = k.ready;
  if (!r) return port ? {http: `http://127.0.0.1:${port}/`} : null;
  const out = {};
  for (const f of ["http", "tcp", "json_ok", "timeout", "interval"])
    if (r[f] !== null && r[f] !== undefined && r[f] !== "") out[f] = r[f];
  if (port && out.http && urlPort(out.http) && urlPort(out.http) !== port)
    out.http = out.http.replace(`:${urlPort(out.http)}`, `:${port}`);  // 端口改动同步探针
  return Object.keys(out).length ? out : (port ? {http: `http://127.0.0.1:${port}/`} : null);
}

function candPayload(c, proj, w = wiz) {
  const root = c._root || w.dir;
  const source = joinDir(root, c.source_dir || ".");
  const compNotes = [];
  const comps = (c.components || []).map(k => {
    const out = {id: k.id, kind: k.kind || "server", name: k.name || k.id};
    if (compIsCompose(k, c)) {
      // V2.7/R07：compose 参数必须转发（run/compose_service/compose_project/compose_files/provision），
      // 组件级值优先、候选级值兜底；run=compose 无本地 cmd（不校验 cmd）。
      out.run = "compose";
      out.cwd = k.cwd || c.cwd || ".";
      out.compose_service = k.compose_service || c.compose_service || null;
      if (!out.compose_service) {
        compNotes.push(`组件 ${k.id} 为 compose 但缺 compose_service，未随注册提交（请补填后重试）`);
        return null;
      }
      if (k.compose_project || c.compose_project) out.compose_project = k.compose_project || c.compose_project;
      if ((k.compose_files || []).length || (c.compose_files || []).length)
        out.compose_files = (k.compose_files || []).length ? k.compose_files : c.compose_files;
      out.provision = k.provision || c.provision || "existing";
    } else {
      out.cmd = k.cmd || [];
      out.cwd = k.cwd || ".";
    }
    if (k.port) out.port = k.port;
    const rd = fwdReady(k, k.port || null);
    if (rd) out.ready = rd;   // 无端口组件的探针（如固定外部端口）同样转发
    for (const f of COMP_FWD_KEYS) {
      const v = k[f];
      if (v !== null && v !== undefined && !(Array.isArray(v) && !v.length)) out[f] = v;
    }
    return out;
  }).filter(Boolean);
  if (compNotes.length && c.unresolved) c.unresolved = c.unresolved.concat(compNotes);
  const depNotes = [];
  const deps = (c.dependencies || []).map(d => {
    const out = {name: d.name};
    if (d.probe && (d.probe.http || d.probe.tcp)) {
      out.probe = {};
      for (const f of ["http", "tcp", "json_ok", "timeout"])
        if (d.probe[f]) out.probe[f] = d.probe[f];
    } else {
      // 注册校验要求依赖探针含 http/tcp：不静默丢弃，转为待人工确认
      depNotes.push(`依赖 ${d.name} 缺少 http/tcp 探针，未随注册提交`);
      return null;
    }
    for (const f of ["affects", "required", "container", "volume", "note"])
      if (d[f] !== null && d[f] !== undefined && d[f] !== "") out[f] = d[f];   // R08：复用绑定结果随注册提交
    return out;
  }).filter(Boolean);
  if (depNotes.length && c.unresolved) c.unresolved = c.unresolved.concat(depNotes);
  const svc = {id: c.id, name: c.name, description: c.description || "", source,
               open: c.open || null,
               evidence: {agent: w.agent, summary: (c.evidence?.summary) || "agent 识别候选",
                          files: c.evidence?.files || [], unresolved: c.unresolved || []},
               components: comps};
  if (deps.length) svc.dependencies = deps;
  const binding = candidateUsesDocker(c) && candidateDockerBinding(c, w);
  if (binding) svc.docker = binding;
  if (comps.some(x => x.run === "compose") && c._confirmed_provision)
    svc.confirmed_provision = true;   // R07：仅当用户勾选「允许创建容器/拉镜像」才携带
  const edited = candidateEditedPaths(c);
  if (edited.length) svc.edited = edited;   // R06/V2.3：审核期编辑随注册携带（本次编辑优先于旧覆盖）
  if (c._accept_new?.length) svc.accept_new = [...new Set(c._accept_new)];  // V2.3：显式清除指定覆盖
  return {schemaVersion: 1, revision: proj.revision || 0,
          project: {id: proj.id, name: proj.name, agent: w.agent || proj.agent || "none"},
          directories: [{path: root, role: "source"}],
          by: "gui", service: svc};
}

async function wizRegisterOnce(w, i, verify) {
  const c = w.candidates[i];
  if (candidateUsesDocker(c) && w.dockerEnvironments && !candidateDockerBinding(c, w))
    return [400, {error: tr("请选择 Docker 运行环境", "Select a Docker environment")}];
  const [code, res] = await api("POST", "/api/register", {...candPayload(c, w.target, w), verify_start: verify});
  if (!verify && code === 409 && w.target.revision && res?.current_revision != null) {  // 批量注册：用服务端最新 revision 重试一次，不静默失败
    await refresh();
    const g = registry?.registry?.projects?.find(p => p.id === w.target.id);
    if (!g) return [code, res];
    w.target = {...g};
    return await api("POST", "/api/register", candPayload(c, w.target, w));
  }
  return [code, res];
}

async function wizRegister(w = wiz, verify = false) {
  if (!w.target || w.registering) return;
  w.registering = true; w.verifying = verify; render();
  for (let i = 0; i < w.candidates.length; i++) {
    const c = w.candidates[i];
    if (c._sel === false || (w.results[i]?.res?.service_id || w.results[i]?.res?.draft_id)) continue;
    // R07：provision=up 未确认 → 后台必 400；GUI 先解释并拦下该条（其余候选不受影响）
    if (isComposeCand(c) && effectiveProvision(c) === "up" && !c._confirmed_provision) {
      w.results[i] = {code: 400, res: {error: "provision=up 需先勾选「允许创建容器/拉镜像——由我确认」（后台同样拒绝未确认的 up）"}};
      continue;
    }
    try {
      const [code, res] = await wizRegisterOnce(w, i, verify);
      w.results[i] = {code, res};
      if (code === 200 && res?.service_id) {
        w.target = {...w.target, id: res.project_id, revision: res.revision};
        w.registered = true;
      }  // 后续候选不再撞修订号
    } catch (e) { w.results[i] = {code: 0, res: {error: "无法连接控制服务"}}; setConn(false); }
  }
  w.registering = false; w.verifying = false;
  await refresh(); render();
}

async function wizPrefetchDiff(i) {
  const w = wiz;
  const target = w.target || w.project;
  const c = w.candidates[i];
  if (!c || w.diffs[i] || !target) return;
  try {
    const payload = candPayload(c, target, w);
    const [code, res] = await api("POST", "/api/register", {...payload, dry_run: true});
    if (code === 200) {
      // V2.3：diff 命中已登记服务时取其覆盖层（端点未就绪/404/501 → 静默降级）
      if (res && res.action === "diff" && res.registration_action !== "created" && res.service_id) {
        try {
          const [oc, o] = await api("GET", `/api/services/${res.service_id}/overrides`);
          if (oc === 200 && o && o.ok) res.overrideFields = Object.keys(o.fields || {});
        } catch (e2) { /* 覆盖层获取失败不阻塞 diff */ }
      }
      w.diffs[i] = res;
      render();
    } else if (res) {
      w.diffs[i] = res;
      render();
    }
  } catch (e) { /* 差异预览失败不阻塞注册 */ }
}

// V2.3「采用新值」：把字段加入候选的 accept_new，刷新该候选的 dry_run diff
function wizAcceptNew(i, field) {
  const c = wiz.candidates && wiz.candidates[i];
  if (!c || !field) return;
  c._accept_new = [...new Set([...(c._accept_new || []), field])];
  delete wiz.diffs[i];
  wizPrefetchDiff(i);   // 重新预览（应用覆盖后的 diff = 实际）
  render();
}

async function wizStartService(sid) {
  pending["wiz-start-" + sid] = true; render();
  try { await api("POST", `/api/projects/${sid}/start`, {open: true}); setConn(true); }
  catch (e) { setConn(false); }
  pending["wiz-start-" + sid] = null;
  await refresh(); render();
}

function wizStartManual() {
  if (!wizardTarget(wiz)) { wiz.error = "请先选择项目目录"; render(); return; }
  trackWizard(wiz);
  wiz.manual = true;
  wiz.step = "review";
  if (!wiz.manualService) {
    const name = (wiz.name || wiz.dir.split("/").filter(Boolean).pop() || "service").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "service";
    wiz.manualService = {id: name, name: wiz.name || name, source: wiz.dir, open: "",
                         components: [{id: "main", kind: "server", name: "main", cmd: [], cwd: ".", port: null, ready: null}]};
  }
  render();
}
function wizManualField(key, value) { wiz.manualService[key] = value; }
function wizManualComp(i, key, value) {
  const c = wiz.manualService.components[i] = {...wiz.manualService.components[i]};
  if (key === "cmd") c.cmd = value.split(/\s+/).filter(Boolean);
  if (key === "port") c.port = value ? parseInt(value, 10) || null : null;
  if (key === "ready") c.ready = value ? {http: value} : null;
}
function wizManualAddComp() {
  const n = wiz.manualService.components.length + 1;
  wiz.manualService.components.push({id: "comp" + n, kind: "server", name: "comp" + n, cmd: [], cwd: ".", port: null, ready: null});
  render();
}

async function wizManualRegister() {
  const w = wiz;
  if (w.manualRegistering) return;
  const proj = wizardTarget(w, true);
  if (!proj) { w.error = "请先选择项目目录"; w.step = "dir"; render(); return; }
  const m = wiz.manualService;
  if (!m.id || !m.name || !m.source || !m.components.length) {
    w.manualError = "id / 名称 / 源码目录 / 至少一个组件为必填"; render(); return;
  }
  const comps = m.components.map(k => {
    const out = {id: k.id, kind: k.kind || "server", name: k.name || k.id, cmd: k.cmd || [], cwd: k.cwd || "."};
    if (k.port) { out.port = k.port; out.ready = k.ready?.http && urlPort(k.ready.http) === k.port ? {http: k.ready.http} : {http: `http://127.0.0.1:${k.port}/`}; }
    return out;
  });
  const payload = {schemaVersion: 1, revision: proj.revision || 0,
                   project: {id: proj.id, name: proj.name, agent: wiz.agent || "none"},
                   directories: [{path: wiz.dir, role: "source"}], by: "gui",
                   service: {id: m.id, name: m.name, description: "", source: m.source, open: m.open || null,
                             evidence: {agent: "none", summary: "手动登记"}, components: comps}};
  w.manualRegistering = true; w.manualError = ""; render();
  try {
    const [code, res] = await api("POST", "/api/register", payload);
    w.manualResult = {code, res};
    msgs["wiz-manual"] = code === 200 ? {text: `已注册（${res.action}）`} : null;
    if (code === 200 && res?.service_id) w.registered = true;
  } catch (e) { w.manualResult = {code: 0, res: {error: "无法连接控制服务"}}; setConn(false); }
  w.manualRegistering = false;
  await refresh(); render();
}

// ------------------------------------------------------------ 原生入口（macOS 主窗口菜单调用）

window.lsOpenView = function(v) { setView(v); };
window.lsShowLogs = function(id) { revealService(); loadLogs(id); };
window.lsFocusService = function(id) {
  revealService(); open[id] = true; render();
  requestAnimationFrame(() => document.getElementById("p-" + id)?.scrollIntoView({block: "center"}));
};
// W2：从菜单栏「查看原因」直达诊断行（展开 + 聚焦 + 滚动到诊断，与浏览器内路径同一函数）
window.lsDiagnose = function(id) {
  revealService();
  if (snap) showServiceReason(id);
  else pendingDiagnosis = id;
};

function revealService() {
  view = "all";
  document.getElementById("globalSearch").value = "";
  document.activeElement?.blur?.();
}

// ------------------------------------------------------------ 刷新循环

function setView(v) {
  view = v;
  if (v === "resources") loadResources();
  if (v === "agents") loadAgents();
  if (v === "removed") loadRemoved();
  if (v === "new-project") {
    trackWizard(wiz);
    if (!agentsData) loadAgents();
    if (!draftsData) loadDrafts();   // R6：草稿随添加流程展示
  }
  render();
}

function dashboardUpdateInProgress() {
  return pendingWrites > 0 || manualRefresh || Object.values(pending).some(Boolean) || recognitionTasks.some(task =>
    task.registering || task.manualRegistering || task.verifying || ["queued", "running"].includes(task.job?.state));
}

function dashboardHasEdits() {
  const active = document.activeElement;
  return uiLocked() || Boolean(window.__lsPickCb) || logReading() ||
    (["INPUT", "SELECT", "TEXTAREA"].includes(active?.tagName) && active.id !== "globalSearch") ||
    Object.keys(draftEdit).length > 0 ||
    recognitionTasks.some(task => (!task.registered && (task.dir || task.name || task.manual)) ||
      task.candidates.some((candidate, i) => candidate._sel !== false &&
        !(task.results[i]?.res?.service_id || task.results[i]?.res?.draft_id)));
}

function reloadDashboard(requested = false) {
  if (reloadingDashboard || dashboardUpdateInProgress()) return;
  if (dashboardHasEdits() && (!requested || !confirm(tr(
    "更新工作台会丢弃尚未保存的页面编辑。现在更新？",
    "Reloading the workbench will discard unsaved edits. Reload now?")))) return;
  reloadingDashboard = true;
  try {
    window.sessionStorage.setItem("locove-dashboard-reload", JSON.stringify({
      view, search: document.getElementById("globalSearch").value,
      expanded: Object.keys(open).filter(id => open[id]),
    }));
  } catch (e) { /* 页面仍可更新，即使浏览器禁用会话存储 */ }
  location.reload();
}

function renderDashboardUpdate(revision) {
  const update = document.getElementById("dashboardUpdate");
  update.hidden = !revision || revision === DASHBOARD_REVISION;
  if (update.hidden) return;
  const busy = dashboardUpdateInProgress();
  const message = busy
    ? tr("工作台有更新，将等待当前操作完成。", "A workbench update is ready. Waiting for the current operation.")
    : tr("工作台有更新。可以先完成当前编辑。", "A workbench update is ready. You can finish editing first.");
  const status = document.getElementById("dashboardUpdateMessage");
  if (status.textContent !== message) status.textContent = message;
  const button = document.getElementById("dashboardReload");
  button.textContent = tr("更新工作台", "Reload workbench");
  button.disabled = busy;
  if (!busy) reloadDashboard();
}

async function refresh(manual) {
  if (manual) {
    if (manualRefresh) return;
    const previous = snap?.generated_at || 0;
    manualRefresh = true;
    refreshFailed = false;
    renderStatusBanner();
    try {
      const [code, result] = await api("POST", "/api/refresh").catch(() => []);
      refreshFailed = code !== 200 || !(result?.generated_at > previous);
      await refresh();
      if (connOk === false) refreshFailed = true;
    } finally {
      manualRefresh = false;
      renderStatusBanner();
    }
    return;
  }
  const requestLanguageVersion = languageVersion;
  try {
    const [code, snapNew] = await api("GET", "/api/status");
    if (code !== 200 || !snapNew) throw new Error(snapNew?.error || "status failed");
    if (!manualRefresh && snapNew.generated_at > (snap?.generated_at || 0)) refreshFailed = false;
    snap = snapNew;
    const [rc, reg] = await api("GET", "/api/registry");
    if (rc === 200 && reg?.ok) {
      registry = reg;
      if (!pending.language && requestLanguageVersion === languageVersion) applyLanguage(reg.registry?.settings?.language);
    }
    try {  // V3.5：chip 依赖 settings/routes，随刷新一并等待，避免渲染竞态
      const [lc, lv] = await api("GET", "/api/locove");
      if (lc === 200 && lv) locoveData = lv;
    } catch (e) { /* 域名面不可用不阻塞状态刷新 */ }
    if (!agentCandidates) loadCandidates().then(render);
    if (!diagnosesLoaded) { diagnosesLoaded = true; loadDiagnoses(); }
    setConn(true);
    if (draftsData) loadDrafts();
    if (dockerResourcesVisible() && Date.now() - resourcesFetchedAt > 5000) loadResources();
  } catch (e) {
    setConn(false);
    if (snap) for (const p of snap.projects) { p.state = "unknown"; p.label = "未知"; p.op = null; p.can_open = false; p.reason = ""; }
  }
  if (connOk) renderDashboardUpdate(snap.dashboard_revision);
  if (connOk && pendingDiagnosis) {
    const id = pendingDiagnosis;
    pendingDiagnosis = null;
    window.lsDiagnose(id);
    return;
  }
  render();
  if (connOk && locoveData && pendingEndpointSettings) {
    pendingEndpointSettings = false;
    const query = new URLSearchParams(location.search);
    const service = query.get("service");
    const endpoint = snap.projects.find(p => p.id === service)?.endpoints?.find(e => e.host === query.get("host"));
    if (endpoint) editEndpointCompatibility({service, host: endpoint.host, component: endpoint.component});
  }
}

document.getElementById("globalSearch").addEventListener("input", render);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !manualRefresh && !logReading()) refresh();
});
// ⋯ 菜单键盘可达：Esc 关闭，↑/↓ 在菜单项间移动（V2.11）
document.addEventListener("keydown", e => {
  if (!menuState) return;
  if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  let btns = [];
  try { btns = Array.from(menuState.el.querySelectorAll("button")); } catch (err) { return; }
  if (!btns.length) return;
  e.preventDefault();
  const i = btns.indexOf(document.activeElement);
  const next = e.key === "ArrowDown" ? (i + 1) % btns.length : (i <= 0 ? btns.length - 1 : i - 1);
  if (btns[next] && btns[next].focus) btns[next].focus();
});
// W1/W2 深链：#p-<id> 载入即展开定位该服务（浏览器书签 / 原生 / Agent 同一事实源）
{ const m = location.hash.match(/^#p-(.+)$/); if (m) open[m[1]] = true; }
applyLanguage();
try {
  const saved = window.sessionStorage.getItem("locove-dashboard-reload");
  if (saved) {
    window.sessionStorage.removeItem("locove-dashboard-reload");
    const state = JSON.parse(saved);
    document.getElementById("globalSearch").value = state.search;
    for (const id of state.expanded) open[id] = true;
    setView(state.view);
  }
} catch (e) { /* 禁用存储或会话数据损坏时使用默认视图 */ }
refresh();
// UX2（review 2026-11-05）：日志区是 .detail 内的 <pre>（不再是旧 details[open]）。
// 悬停阅读或正持有文本选区时暂停轮询刷新与后台重建——整树 innerHTML 替换会打断
// 选择、焦点与滚动位置；离开/释放选区后下一周期自动恢复。render() 也引用本函数，
// 函数声明提升保证可用。
function logReading() {
  const pre = document.querySelector(".detail pre:hover");
  if (pre) return true;
  if (typeof window.getSelection !== "function") return false;  // 无头/精简 DOM 无选区 API
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) {
    for (let n = sel.anchorNode; n; n = n.parentElement)
      if (n.tagName === "PRE" && n.closest(".detail")) return true;
  }
  return false;
}
setInterval(() => {
  if (logReading()) return;
  renderStatusBanner();
  if (!manualRefresh) refresh();
}, 3000);
</script>
